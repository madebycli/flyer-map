current_field_ui_slice:
  context: docs/context-field-ui-navigation.yaml
  plan: docs/plans/active/031-field-ui-navigation-rooms-sheets.md
  prompt: docs/prompts/CONTINUE_FIELD_UI_NAVIGATION_LATEST.md
  master_intent:
    - primary navigation is PlatformShell buildPlatformLauncherItems and .platform-menu-grid
    - no Rooms/Fortschritt/Kommentare primary tabs inside TeamCenter
    - separate Team, Rooms, Fortschritt, Kommentare, Streets, Gebiet, Einstellungen launcher destinations
    - shared draggable FieldBottomSheet with fixed handle/header and scrollable body
    - Street save/status/close flow ends on Map instead of reopening Area
    - Online anzeigen affects discovery only, never valid direct Code/QR join
    - normal Join-Zugang anzeigen must not rotate credentials
    - rotation preserves existing memberships
    - same current join credential re-show needs reviewed recoverable-secret design because current D1 contract is hash-only
    - healthy sync status becomes quiet and left-aligned with the platform field controls; actionable errors remain visible
    - group/read-only onboarding defaults to German and cannot break token redemption
    - .platform-grid-button remains Brainrot long-press target
    - Street detail keeps Offen, Erledigt, Später and Nicht zustellbar in an equal-width 2x2 grid; compact comment and red Danger trash actions are stacked vertically in the adjacent action column

security_header_fix:
  path: public/_headers
  applies_to: static assets served directly by Cloudflare Workers Static Assets
  headers:
    - X-Content-Type-Options: nosniff
    - X-Frame-Options: DENY
    - Referrer-Policy: strict-origin-when-cross-origin
    - Cross-Origin-Opener-Policy: same-origin
  worker_generated_responses: hardened separately by worker/indexOrganizer.ts

hard_boundaries:
  - no merge or Ready on PR #92
  - no Production deploy or Production D1 migration
  - do not touch mission-release-2026-09-02-manual
  - Main candidate composes indexOrganizer.ts; Production activation remains separately authorized and must preserve the Production D1 identity
  - no privilege or tenant decision from client state
  - no plaintext credentials in repository, D1, logs, audit, LocalStorage, IndexedDB or RxDB
  - temporary Group QR tokens may exist in the URL fragment for redemption as designed; do not move them into query strings or persistence
  - do not weaken tests, TypeScript, audit, authz or security-header gates

