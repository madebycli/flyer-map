routing_rules:
  - for Organization, Organizer, Admin accounts, MFA, invites, security center, role templates, campaign tenancy or Admin staging, load this overlay after the normal AGENTS/CURRENT/context-map entrypoints
  - for the approved Field launcher/Rooms/comments/Streets/draggable-sheet continuation on PR 76, load context-field-ui-navigation and plan-031 after this overlay before changing PlatformShell, TeamHub/TeamCenter, App sheets or field-group UX
  - GitHub remote refs, PR state, exact-head CI and the latest successful staging artifact outrank embedded handoff SHAs
  - ADR-0026 is accepted and governs Organization identity/authorization
  - Organization is the tenant boundary; account identity is global and memberships are Organization-scoped
  - ids are selectors only; Worker/D1 resolves session, membership and server-known capability for protected mutations
  - RxDB remains operative Campaign data only; credentials, TOTP, recovery, sessions, memberships, roles and audit never belong in RxDB
  - committed production wrangler config remains on worker/indexFc52.ts until a separately approved Production release
  - committed production assets.run_worker_first includes /api/* and exact / so Organizer staging can redirect bare root while indexFc52 preserves normal SPA assets through ASSETS.fetch
  - admin staging derives an isolated organizer config and must never bind Production-D1 or RxDB-Staging-D1
  - legacy campaigns must never be automatically claimed by first bootstrap or Organization creation
  - static Cloudflare assets are hardened through public/_headers while Worker-generated organizer responses are hardened in worker/indexOrganizer.ts
  - the Field primary launcher is PlatformShell/buildPlatformLauncherItems/.platform-menu-grid; do not rebuild Rooms/Fortschritt/Kommentare as TeamCenter tabs
  - Field Group credential rotation preserves existing memberships; current credentials are hash-only and cannot be re-shown without an explicit reviewed architecture change
  - never mark PR 76 ready, merge it, deploy Production or apply Production migrations without explicit separate approval

