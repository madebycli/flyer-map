version: 1
last_updated: 2026-09-04
purpose: Organizer/Admin continuation overlay for the main docs/context-map.yaml routing graph.

entrypoints:
  after_main_graph:
    - docs/prompts/CONTINUE_ORGANIZER_ADMIN_LATEST.md
    - docs/plans/active/030-organizer-admin-platform.md
    - docs/decisions/ADR-0026-organization-admin-identity-and-authorization.md
    - docs/operations/ORGANIZER_ADMIN_STAGING.md

routing_rules:
  - for Organization, Organizer, Admin accounts, MFA, invites, security center, role templates, campaign tenancy or Admin staging, load this overlay after the normal AGENTS/CURRENT/context-map entrypoints
  - GitHub remote refs, PR state and exact-head CI outrank handoff SHAs embedded in documentation
  - ADR-0026 is accepted and is the current Organization identity/authorization decision; ADR-0015 and ADR-0016 remain supporting/proposed context where ADR-0026 does not supersede their detail
  - Organization is the tenant boundary; account identity is global and memberships are Organization-scoped
  - ids are selectors only; Worker/D1 authorization must resolve the current session, membership and server-known capability on every protected mutation
  - RxDB remains operative Campaign data only; credentials, TOTP, recovery, sessions, memberships, roles and audit never belong in RxDB
  - committed production wrangler config must remain on worker/indexFc52.ts until a separately approved production release
  - admin staging must derive an isolated organizer config without mutating the committed production runtime contract
  - legacy campaigns must never be automatically claimed by first bootstrap or Organization creation
  - never mark PR 76 ready, merge it, deploy Production or apply Production migrations without explicit separate approval

nodes:
  - id: organizer-admin-handoff
    path: docs/prompts/CONTINUE_ORGANIZER_ADMIN_LATEST.md
    type: handoff
    status: current
    topics: [organization, organizer, admin, handoff, github, ci, acceptance, staging]
    load_when: [fresh chat, continue organizer admin, resume Plan 030, handoff]

  - id: plan-030-organizer-admin-platform
    path: docs/plans/active/030-organizer-admin-platform.md
    type: plan
    status: active
    topics: [organizations, accounts, admin, campaigns, roles, permissions, security, staging]
    load_when: [Organizer Admin implementation, Plan 030, release acceptance]

  - id: ADR-0026
    path: docs/decisions/ADR-0026-organization-admin-identity-and-authorization.md
    type: decision
    status: accepted
    topics: [organization, account, membership, password, totp, recovery, sessions, tenant, authorization]
    load_when: [admin identity, organization authorization, TOTP, recovery, session, tenant boundary]

  - id: organizations
