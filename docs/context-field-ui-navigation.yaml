purpose: >-
  Continuation overlay for the mobile Field UI navigation, Rooms, comments,
  draggable bottom sheets, Street flow and sync-status work being planned on
  feature/organizer-admin-platform. This overlay exists to prevent a future
  agent from rebuilding primary launcher apps as tabs inside TeamCenter.

