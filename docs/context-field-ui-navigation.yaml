  after_main_graph:
    - docs/context-organizer-admin.yaml
    - docs/plans/active/031-field-ui-navigation-rooms-sheets.md
    - docs/architecture/LIVE_TEAMS.md
    - docs/product/UX.md
    - docs/architecture/MAP.md
    - docs/architecture/COLLABORATION.md
    - docs/architecture/SECURITY.md
    - docs/quality/QUALITY.md

routing_rules:
  - the primary Field app navigation is PlatformShell -> buildPlatformLauncherItems() -> .platform-menu-grid; do not create a second primary navigation inside TeamCenter
  - .platform-grid-button is the field launcher button and remains the Brainrot long-press target; a completed long press must suppress the normal menu click
  - Team, Rooms, Fortschritt, Kommentare, Streets, Einstellungen and Gebiet are separate primary launcher destinations; do not represent Rooms/Fortschritt/Kommentare as .team-center-tabs
  - TeamHub/TeamCenter is for persistent Team selection/management and a concise Team overview only; full Room, progress and comment workflows belong to their own launcher surfaces
  - the current TeamCenter View union overview|rooms|progress|comments and .team-center-tabs are known transition debt, not the target architecture
  - Streets is a reserved primary launcher surface for street search and future Street Engine work; reuse existing Smart Street/MapView contracts where applicable and do not invent a second map engine
  - all mobile sheets should converge on one shared draggable-bottom-sheet behavior: fixed drag handle/header, snap heights, independently scrollable body, safe-area/keyboard-aware footer/composer
  - normal content scrolling must never change sheet height; only dragging the non-scrolling handle/chrome changes the sheet snap point
  - contextual comments remain collapsed behind CommentsContextPanel .comments-context-toggle until requested; when expanded the composer must remain reachable after many comments and with the mobile keyboard open
  - manual Street creation transitions AREA_DETAIL -> STREET_DRAW -> STREET_DETAIL -> CLOSED; closing the Street detail must not reveal the parent Area sheet again
  - Online anzeigen is Field Group discoverability only; it must not decide whether a Room exists and must not gate valid Room Code or QR joins
  - normal Room invite reuse means showing the current active join material again, not rotating it; rotation is a separate credential lifecycle operation
  - current Field Group rotation revokes old join credentials for future joins but preserves existing field_group_memberships; do not describe or implement it as kicking joined members out
  - current accepted LIVE_TEAMS architecture stores only credential hashes and returns plaintext only at issuance/rotation; satisfying later re-show of the same current code requires an explicit reviewed credential-reveal design or ADR amendment before persistence changes
  - never solve Room credential re-show by storing plaintext Room Codes or QR tokens in D1, RxDB, LocalStorage, IndexedDB, logs or audit
  - healthy sync state should be quiet; the current persistent Serverbestätigt/sync status UI is to be reduced to a small unobtrusive indicator while actionable offline/error/conflict states remain visible
  - Read-only/group-link onboarding defaults to German and may appear once per new device, but Group onboarding must occur only after successful server redemption so it cannot consume, remove or block the join token
  - privileged Organizer/Admin invitations remain separate from Room credentials and Team links; server authorization remains authoritative
  - PR 76 stays Draft/unmerged; no Production deploy/migration and no write to mission-release-2026-09-02-manual

