version: 19

entrypoints:
  always:
    - AGENTS.md
    - docs/status/CURRENT.md
    - docs/context-map.yaml

routing_rules:
  - load entrypoints first
  - select nodes whose topics/load_when match the task
  - follow depends_on/constrained_by/implements/governed_by edges as needed
  - prefer accepted/current/active nodes over proposed or historical nodes
  - load proposed architecture only for the corresponding future capability
  - inspect accepted ADRs before changing an architectural or security boundary
  - inspect current open PRs, exact heads and CI before starting or replacing a slice
  - treat prepared D1 migrations as unapplied until deployment/status docs explicitly record remote application
  - for a fresh Plan-017 planner chat, load prompt-latest-feature-complete after the entrypoints, then follow its graph edges
  - for completed House polygon renderer history or its open device gates, load prompt-house-polygon-renderer and plan-house-polygon-renderer, then follow Map, Smart Task identity, Collaboration and Quality edges
  - for Smart Street runtime planning or continuation, load plan-smart-street-runtime, then follow Offline Map, Map, UX, Offline Sync, Smart Task identity and Quality edges
  - for Smart House runtime or preview schema-gate hardening, load plan-smart-house-runtime, then follow Smart Street runtime, House persistence, House renderer, Offline Map, Map, UX, Data, Offline Sync, Security, Smart Task identity and Quality edges
  - for OpenFreeMap basemap, standard house numbers, Smart Map online-first or related Area-Sheet hardening, load plan-openfreemap-smartdata-ui-hardening, then follow Map, Offline Map, Smart Street runtime, Smart House runtime, UX, Collaboration and Quality edges
  - for automatic server-side Area preparation, recovery status/retry, generated Street/House Tasks or migration 0014, load plan-auto-area-task-preparation, then follow Data, Offline Sync, Map, Security, Quality, Offline Map, Smart Task identity and ADR-0021 edges
  - for the normal automatic Area Sheet, Preparation polling/retry, completed task color or removal of browser Smart/offline-download UI, load plan-auto-area-ui-server-preparation after plan-auto-area-task-preparation, then follow UX, Map, Offline Sync, Quality and ADR-0021 edges
  - for FC5 Collection/Pickup runtime, load plan-collection-pickup-persistence, then follow Roadmap, UX, Data, Offline Sync, Map, Security, Collaboration, Live Teams, Access/Session, Smart Task identity, Offline Map, Field Session Events and Quality edges
  - FC5 uses the Master-selected First-Class Collection/Pickup direction; do not route implementation back to Collection-state-on-Distribution unless Plan 021 is explicitly superseded
  - for FC5.1 prioritize Collection-only QR access, Main/Child Areas, Collection Runs, claims/join/leave/release and existing temporary-credential patterns before Pickup search or Road-Stats follow-up slices
  - FC5.2 Pickup runtime is complete through visibility, search/composer, MapLibre rendering, comments, assignment, edit, soft archive, archive review and normal Admin/Collector product flows; route new runtime work to FC5.3 Road Sections, separated statistics, actor highlight/attribution and compensating revert while keeping real-device acceptance separate
  - for the final M5 write contract, load plan-m5-remove-legacy-snapshot-writes and ADR-0022, then follow Data, Offline Sync, Security and Quality; Snapshot PUT is retired and Campaign POST is create-only

