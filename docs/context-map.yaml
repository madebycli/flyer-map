  - { from: plan-feature-complete-platform, to: live-teams, relation: implements_current_slice }
  - { from: plan-feature-complete-platform, to: collaboration, relation: implements_next_slices }
  - { from: prompt-latest-feature-complete, to: plan-feature-complete-platform, relation: continues }
