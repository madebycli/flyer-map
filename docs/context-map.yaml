version: 4

entrypoints:
  always:
    - AGENTS.md
    - docs/status/CURRENT.md
    - docs/context-map.yaml

routing_rules:
  - load entrypoints first
  - select nodes whose topics/load_when match the task
  - follow depends_on/constrained_by/implements/governed_by edges as needed
  - prefer accepted/current/active nodes over proposed or historical nodes
  - load proposed architecture only for the corresponding future capability
  - inspect accepted ADRs before changing an architectural or security boundary
  - inspect current open PRs, exact heads and CI before starting or replacing a slice
  - treat prepared D1 migrations as unapplied until deployment/status docs explicitly record remote application

nodes:
  - id: product
    path: docs/product/PRODUCT.md
    type: product
    status: accepted
    topics: [product, requirements, users, concepts]
    load_when: [product behavior, domain vocabulary, user goals]

  - id: roadmap
    path: docs/product/ROADMAP.md
    type: product
    status: accepted
    topics: [roadmap, feature-complete, offline-map, streets, houses, pickup, collection, field-sessions, live-teams, statistics, organizations, admin, permissions, accounts, support, comments, automations]
    load_when: [new feature planning, milestone planning, long-term scope, collection, live teams, statistics, admin accounts]

  - id: mvp
    path: docs/product/MVP.md
    type: product
    status: accepted
    topics: [mvp, release, field-readiness]
    load_when: [release scope, MVP acceptance, field testing]

  - id: ux
    path: docs/product/UX.md
    type: product
    status: accepted
    topics: [ui, ux, mobile, desktop, accessibility, launcher, bottom-bar, progress, team-colors, admin, support]
    load_when: [UI change, map interaction, mobile behavior, desktop admin UX, launcher, progress UI]

  - id: architecture
