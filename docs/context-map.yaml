version: 11

entrypoints:
  always:
    - AGENTS.md
    - docs/status/CURRENT.md
    - docs/context-map.yaml

routing_rules:
  - load entrypoints first
  - select nodes whose topics/load_when match the task
  - follow depends_on/constrained_by/implements/governed_by edges as needed
  - prefer accepted/current/active nodes over proposed or historical nodes
  - load proposed architecture only for the corresponding future capability
  - inspect accepted ADRs before changing an architectural or security boundary
  - inspect current open PRs, exact heads and CI before starting or replacing a slice
  - treat prepared D1 migrations as unapplied until deployment/status docs explicitly record remote application
  - for a fresh Plan-017 planner chat, load prompt-latest-feature-complete after the entrypoints, then follow its graph edges
  - for completed House polygon renderer history or its open device gates, load prompt-house-polygon-renderer and plan-house-polygon-renderer, then follow Map, Smart Task identity, Collaboration and Quality edges
  - for Smart Street runtime planning or continuation, load plan-smart-street-runtime, then follow Offline Map, Map, UX, Offline Sync, Smart Task identity and Quality edges
  - for Smart House runtime or preview schema-gate hardening, load plan-smart-house-runtime, then follow Smart Street runtime, House persistence, House renderer, Offline Map, Map, UX, Data, Offline Sync, Security, Smart Task identity and Quality edges
  - for FC5 Collection/Pickup persistence planning, load plan-collection-pickup-persistence, then follow Roadmap, UX, Data, Offline Sync, Map, Security, Collaboration, Live Teams, Smart Task identity, Offline Map, Field Session Events, proposed Action Templates and Quality edges

