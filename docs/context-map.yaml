version: 3

entrypoints:
  always:
    - AGENTS.md
    - docs/status/CURRENT.md
    - docs/context-map.yaml

routing_rules:
  - load entrypoints first
  - select nodes whose topics/load_when match the task
  - follow depends_on/constrained_by/implements/governed_by edges as needed
  - prefer accepted/current nodes over historical completed plans
  - load proposed architecture only when working on the corresponding future capability
  - inspect relevant ADRs before changing an accepted architectural boundary
  - inspect current open PRs/branches before starting a replacement implementation slice

nodes:
  - id: product
    path: docs/product/PRODUCT.md
    type: product
    status: accepted
    topics: [product, requirements, users, concepts]
    load_when: [product behavior, domain vocabulary, user goals]

  - id: roadmap
    path: docs/product/ROADMAP.md
    type: product
    status: accepted
    topics: [roadmap, milestones, offline-map, streets, houses, pickup, collection, field-sessions, live-teams, statistics, organizations, admin-panel, permissions, accounts, totp, support, comments, automations, app-shell, dark-mode]
    load_when: [new feature planning, milestone planning, long-term scope, product expansion, collection mode, live teams, statistics, admin accounts]

  - id: mvp
    path: docs/product/MVP.md
    type: product
    status: accepted
    topics: [mvp, release, field-readiness, scope]
    load_when: [release scope, MVP acceptance, field testing]

  - id: ux
    path: docs/product/UX.md
    type: product
    status: accepted
    topics: [ui, ux, mobile, desktop, accessibility, interaction, appearance, app-menu, bottom-bar, progress-bar, team-colors, admin-panel, support]
    load_when: [UI change, map interaction, mobile behavior, desktop admin UX, app-like navigation, progress UI, team color UI, support UI]

