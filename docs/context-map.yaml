version: 29
last_updated: 2026-10-09

entrypoints:
  always:
    - AGENTS.md
    - docs/status/CURRENT.md
    - docs/context-map.yaml

routing_rules:
  - load entrypoints first, then only nodes whose topics or load_when match the task
  - the field map is v5 (src/v5, worker/v5, engine-rs); the legacy map is archived in docs/archive/legacy-map and is history, never a requirement
  - for what was kept, rebuilt or dropped and why, load plan-051-full-rewrite and adr-0036-legacy-map-retired
  - for organiser sign-in, admin, MFA, invites and campaign tenancy load context-organizer-admin and plan-030-organizer-admin-platform
  - inspect accepted ADRs before changing an architectural or security boundary; superseded ones are marked in adr-0036
  - treat prepared D1 migrations as unapplied until a deployment/status document records remote application
  - production is never changed without explicit authorisation and a backup; branch previews share the production D1 (see docs/operations)

