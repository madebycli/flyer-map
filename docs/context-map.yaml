  - { from: live-teams, to: security, relation: constrained_by }
  - { from: live-teams, to: offline-sync, relation: reuses }
  - { from: live-teams, to: collaboration, relation: creates_field_sessions }
  - { from: collaboration, to: security, relation: constrained_by }
