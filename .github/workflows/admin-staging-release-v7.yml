name: Organizer Admin Staging Release V7

on:
  push:
    branches:
      - organizer-admin-staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: organizer-admin-staging-release-v7
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONFIGURED_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_DB_NAME: flyer-map-admin-staging-db
      ADMIN_WORKER_NAME: flyer-map-admin-staging
      PROD_D1_ID: 0113e775-1e43-4d96-8b97-51fdeec7355b
      RXDB_STAGING_D1_ID: bcec3432-18ec-42a2-970a-64d52c8263d5
      AUDITED_SOURCE_SHA: fb437e2f23fc7c851ecd219cfb6ff38991bb95b2
      FINAL_BOOTSTRAP_SECRET_SHA256: cae8013acc419559c73b247443829e66df6f7bd872b55b2428309db0d608f566
    steps:
      - name: Checkout exact audited source
        uses: actions/checkout@v4
        with:
          ref: fb437e2f23fc7c851ecd219cfb6ff38991bb95b2
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact source and production-safe baseline
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$AUDITED_SOURCE_SHA" ]]
          node <<'NODE'
          const fs = require('node:fs');
          const c = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          if (c.main !== './worker/indexFc52.ts') throw new Error(`Production entrypoint changed: ${c.main}`);
          const db = (c.d1_databases || []).find((entry) => entry.binding === 'DB');
          if (db?.database_id !== process.env.PROD_D1_ID) throw new Error('Production D1 baseline changed');
          if ((c.ratelimits || []).some((entry) => entry.name === 'ORGANIZATION_LOGIN_LIMITER')) throw new Error('Organizer limiter leaked into production config');
          if ((c.compatibility_flags || []).includes('nodejs_compat')) throw new Error('Organizer compatibility flag leaked into production config');
          NODE

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Dependency audit
        run: npm run audit:dependencies

      - name: Production-safe build gate
        run: npm run build

      - name: Resolve isolated Cloudflare resources
        id: resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/admin-v7 /tmp/admin-v7-private
          ACCOUNTS_JSON="$(curl --fail-with-body --silent --show-error 'https://api.cloudflare.com/client/v4/accounts?per_page=50' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')"
          [[ "$(printf '%s' "$ACCOUNTS_JSON" | jq -r '.success')" == 'true' ]]
          COUNT="$(printf '%s' "$ACCOUNTS_JSON" | jq '.result|length')"
          if [[ -n "${CONFIGURED_CLOUDFLARE_ACCOUNT_ID:-}" ]] && printf '%s' "$ACCOUNTS_JSON" | jq -e --arg id "$CONFIGURED_CLOUDFLARE_ACCOUNT_ID" '.result[]|select(.id==$id)' >/dev/null; then
            ACCOUNT_ID="$CONFIGURED_CLOUDFLARE_ACCOUNT_ID"
          elif [[ "$COUNT" == '1' ]]; then
            ACCOUNT_ID="$(printf '%s' "$ACCOUNTS_JSON" | jq -r '.result[0].id')"
          else
            echo 'Cloudflare account is ambiguous.' >&2
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          LIST_JSON="$(npx wrangler d1 list --json)"
          ADMIN_D1_ID="$(printf '%s' "$LIST_JSON" | jq -r --arg name "$ADMIN_DB_NAME" '[.[]|select(.name==$name)]|if length==1 then .[0].uuid else empty end')"
          [[ -n "$ADMIN_D1_ID" ]] || { echo 'Admin D1 missing or ambiguous.' >&2; exit 1; }
          [[ "$ADMIN_D1_ID" != "$PROD_D1_ID" && "$ADMIN_D1_ID" != "$RXDB_STAGING_D1_ID" ]] || { echo 'Protected D1 collision.' >&2; exit 1; }
          echo "ADMIN_D1_ID=$ADMIN_D1_ID" >> "$GITHUB_ENV"
          echo "d1_id=$ADMIN_D1_ID" >> "$GITHUB_OUTPUT"

      - name: Create disposable credentials
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_BOOTSTRAP_SECRET="$(openssl rand -hex 32)"
          SMOKE_PASSWORD="Smoke-$(openssl rand -hex 24)"
          TOTP_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$SMOKE_BOOTSTRAP_SECRET"
          echo "::add-mask::$SMOKE_PASSWORD"
          echo "::add-mask::$TOTP_KEY"
          SMOKE_DIGEST="$(printf '%s' "$SMOKE_BOOTSTRAP_SECRET" | sha256sum | awk '{print $1}')"
          echo "SMOKE_BOOTSTRAP_SECRET=$SMOKE_BOOTSTRAP_SECRET" >> "$GITHUB_ENV"
          echo "SMOKE_PASSWORD=$SMOKE_PASSWORD" >> "$GITHUB_ENV"
          echo "TOTP_KEY=$TOTP_KEY" >> "$GITHUB_ENV"
          echo "SMOKE_DIGEST=$SMOKE_DIGEST" >> "$GITHUB_ENV"

      - name: Materialize isolated admin config in runner only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const c = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          if (c.main !== './worker/indexFc52.ts') throw new Error('Production entrypoint baseline is not FC5.2');
          if ((c.d1_databases || []).find((x) => x.binding === 'DB')?.database_id !== process.env.PROD_D1_ID) throw new Error('Production D1 baseline changed');
          c.main = './worker/indexOrganizer.ts';
          c.compatibility_flags = [...new Set([...(c.compatibility_flags || []), 'nodejs_compat'])];
          c.env = c.env || {};
          c.env.admin_staging = {
            name: process.env.ADMIN_WORKER_NAME,
            workers_dev: true,
            vars: {
              ORGANIZATION_BOOTSTRAP_SECRET_SHA256: process.env.SMOKE_DIGEST,
              ORGANIZATION_PASSWORD_KDF_ITERATIONS: '600000',
              ORGANIZATION_KDF_DIAGNOSTICS: '1'
            },
            d1_databases: [{
              binding: 'DB',
              database_name: process.env.ADMIN_DB_NAME,
              database_id: process.env.ADMIN_D1_ID,
              migrations_dir: 'migrations'
            }],
            durable_objects: {bindings: [
              {name: 'CAMPAIGN_SYNC', class_name: 'CampaignSyncDurableObject'},
              {name: 'ORGANIZATION_PASSWORD_KDF', class_name: 'OrganizationPasswordKdfDurableObject'}
            ]},
            ratelimits: [
              {name: 'FIELD_GROUP_JOIN_ACTOR_LIMITER', namespace_id: '91914001', simple: {limit: 30, period: 60}},
              {name: 'FIELD_GROUP_JOIN_CREDENTIAL_LIMITER', namespace_id: '91914002', simple: {limit: 8, period: 60}},
              {name: 'PICKUP_SEARCH_LIMITER', namespace_id: '91914003', simple: {limit: 20, period: 10}},
              {name: 'ORGANIZATION_LOGIN_LIMITER', namespace_id: '91914004', simple: {limit: 12, period: 60}}
            ]
          };
          c.migrations = c.migrations || [];
          if (!c.migrations.some((x) => x.tag === 'v2-organization-password-kdf')) {
            c.migrations.push({tag: 'v2-organization-password-kdf', new_sqlite_classes: ['OrganizationPasswordKdfDurableObject']});
          }
          const protectedIds = new Set([...(c.ratelimits || []).map((x) => String(x.namespace_id)), '91814001', '91814002', '91814003']);
          for (const limiter of c.env.admin_staging.ratelimits) {
            if (protectedIds.has(String(limiter.namespace_id))) throw new Error(`Rate collision ${limiter.namespace_id}`);
          }
          fs.writeFileSync('wrangler.jsonc', JSON.stringify(c, null, 2) + '\n');
          NODE

      - name: Apply and verify isolated Admin D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply "$ADMIN_DB_NAME" --env admin_staging --config wrangler.jsonc --remote
          npx wrangler d1 execute "$ADMIN_DB_NAME" --env admin_staging --config wrangler.jsonc --remote --json --command 'PRAGMA foreign_key_check;' > /tmp/admin-v7/fk-before.json
          jq -e '[.[].results[]?] | length == 0' /tmp/admin-v7/fk-before.json >/dev/null
          STATE="$(npx wrangler d1 execute "$ADMIN_DB_NAME" --env admin_staging --config wrangler.jsonc --remote --json --command "SELECT (SELECT COUNT(*) FROM organization_bootstrap_state) bootstrap_count,(SELECT COUNT(*) FROM organizations) organization_count,(SELECT COUNT(*) FROM organization_accounts) account_count,(SELECT COUNT(*) FROM campaigns WHERE organization_id IS NOT NULL) owned_campaign_count;")"
          printf '%s' "$STATE" > /tmp/admin-v7/state-before.json
          jq -e '.[0].results[0] | .bootstrap_count==0 and .organization_count==0 and .account_count==0 and .owned_campaign_count==0' <<<"$STATE" >/dev/null || { echo 'Admin staging is not pristine.' >&2; exit 1; }

      - name: Configure TOTP encryption key before candidate deploy
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TOTP_KEY" | npx wrangler secret put ORGANIZATION_TOTP_KEY --name "$ADMIN_WORKER_NAME"

      - name: Build and verify smoke candidate
        env:
          CLOUDFLARE_ENV: admin_staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist .wrangler
          npm run build
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const redirect = JSON.parse(fs.readFileSync('.wrangler/deploy/config.json', 'utf8'));
          const generated = JSON.parse(fs.readFileSync(path.resolve('.wrangler/deploy', redirect.configPath), 'utf8'));
          if (generated.name !== process.env.ADMIN_WORKER_NAME) throw new Error('Wrong Worker');
          if ((generated.d1_databases || []).find((x) => x.binding === 'DB')?.database_id !== process.env.ADMIN_D1_ID) throw new Error('Wrong D1');
          if (!(generated.durable_objects?.bindings || []).some((x) => x.name === 'ORGANIZATION_PASSWORD_KDF' && x.class_name === 'OrganizationPasswordKdfDurableObject')) throw new Error('KDF binding missing');
          if (generated.vars?.ORGANIZATION_BOOTSTRAP_SECRET_SHA256 !== process.env.SMOKE_DIGEST) throw new Error('Smoke bootstrap digest mismatch');
          if (generated.vars?.ORGANIZATION_KDF_DIAGNOSTICS !== '1') throw new Error('Smoke KDF diagnostics missing');
          if (!(generated.compatibility_flags || []).includes('nodejs_compat')) throw new Error('nodejs_compat missing from Admin staging');
          const serialized = JSON.stringify(generated);
          if (serialized.includes(process.env.PROD_D1_ID) || serialized.includes(process.env.RXDB_STAGING_D1_ID)) throw new Error('Protected D1 leaked into generated Admin candidate');
          const protectedRateIds = new Set(['91714001','91714002','91714003','91814001','91814002','91814003']);
          for (const limiter of generated.ratelimits || []) if (protectedRateIds.has(String(limiter.namespace_id))) throw new Error('Protected rate limiter leaked into generated Admin candidate');
          NODE
          npx wrangler deploy --dry-run --outdir .wrangler-admin-v7-dry-run

      - name: Deploy smoke candidate
        id: smoke_deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/admin-v7/deploy-smoke.log
          TEST_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/admin-v7/deploy-smoke.log | tail -n1 || true)"
          [[ -n "$TEST_URL" ]] || { echo 'No workers.dev URL found in deploy output.' >&2; exit 1; }
          grep -F 'ORGANIZATION_PASSWORD_KDF' /tmp/admin-v7/deploy-smoke.log >/dev/null
          echo "TEST_URL=$TEST_URL" >> "$GITHUB_ENV"

      - name: Wait for smoke candidate convergence
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            START="$(curl -sSLo /tmp/admin-v7-private/start.html -w '%{http_code}' "$TEST_URL/start" || printf 000)"
            PROBE="$(jq -n --arg s "$SMOKE_BOOTSTRAP_SECRET" '{bootstrapSecret:$s}')"
            CODE="$(curl -sS -o /tmp/admin-v7-private/candidate-probe.json -w '%{http_code}' -X POST "$TEST_URL/api/organization/bootstrap" -H "Origin: $TEST_URL" -H 'Content-Type: application/json' --data "$PROBE" || printf 000)"
            if [[ "$START" -ge 200 && "$START" -lt 400 && "$CODE" == '400' ]]; then
              printf 'candidate_converged=true\n' > /tmp/admin-v7/candidate-status.txt
              exit 0
            fi
            if [[ "$CODE" != '403' && "$CODE" != '000' && "$CODE" != '400' ]]; then
              echo "Unexpected candidate probe status: $CODE" >&2
              exit 1
            fi
            sleep 5
          done
          echo 'Smoke candidate did not converge.' >&2
          exit 1

      - name: Real bootstrap password TOTP API smoke
        id: runtime_smoke
        shell: bash
        run: |
          set -euo pipefail
          fail_diag(){ jq -n --arg stage "$1" --arg status "$2" --arg code "$3" --arg reason "${4:-}" '{ok:false,stage:$stage,http_status:$status,error_code:$code,reason:$reason}' > /tmp/admin-v7/runtime-smoke.json; exit 1; }
          USERNAME="runtime.smoke.${GITHUB_RUN_ID}"
          ORG="Runtime Smoke ${GITHUB_RUN_ID}"
          echo "SMOKE_USERNAME=$USERNAME" >> "$GITHUB_ENV"
          jq -n --arg organizationName "$ORG" --arg username "$USERNAME" --arg password "$SMOKE_PASSWORD" --arg bootstrapSecret "$SMOKE_BOOTSTRAP_SECRET" '{organizationName:$organizationName,username:$username,password:$password,bootstrapSecret:$bootstrapSecret}' > /tmp/admin-v7-private/bootstrap.json
          B="$(curl -sS -o /tmp/admin-v7-private/bootstrap-response.json -w '%{http_code}' -c /tmp/admin-v7-private/cookies.txt -X POST "$TEST_URL/api/organization/bootstrap" -H "Origin: $TEST_URL" -H 'Content-Type: application/json' --data-binary @/tmp/admin-v7-private/bootstrap.json || printf 000)"
          if [[ "$B" != '201' ]]; then CODE="$(jq -r '.error.code//"non_json"' /tmp/admin-v7-private/bootstrap-response.json 2>/dev/null || printf non_json)"; REASON="$(jq -r '.error.details.reason//""' /tmp/admin-v7-private/bootstrap-response.json 2>/dev/null || true)"; fail_diag bootstrap "$B" "$CODE" "$REASON"; fi
          jq -e '(.organization.id|type=="string") and (.account.id|type=="string") and (.recoveryCodes|length==10) and (.otpauthUri|startswith("otpauth://totp/"))' /tmp/admin-v7-private/bootstrap-response.json >/dev/null || fail_diag bootstrap_contract 201 invalid_contract
          jq -n --arg username "$USERNAME" --arg password "$SMOKE_PASSWORD" '{username:$username,password:$password}' > /tmp/admin-v7-private/login.json
          L="$(curl -sS -o /tmp/admin-v7-private/login-response.json -w '%{http_code}' -b /tmp/admin-v7-private/cookies.txt -c /tmp/admin-v7-private/cookies.txt -X POST "$TEST_URL/api/organization/login/password" -H "Origin: $TEST_URL" -H 'Content-Type: application/json' --data-binary @/tmp/admin-v7-private/login.json || printf 000)"
          [[ "$L" == '200' ]] || fail_diag password_login "$L" "$(jq -r '.error.code//"non_json"' /tmp/admin-v7-private/login-response.json 2>/dev/null || printf non_json)"
          OTP_SECRET="$(jq -r '.otpauthUri' /tmp/admin-v7-private/bootstrap-response.json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(new URL(s.trim()).searchParams.get("secret")||""));')"
          echo "::add-mask::$OTP_SECRET"
          OTP="$(python - "$OTP_SECRET" <<'PY'
          import base64,hashlib,hmac,struct,sys,time
          key=base64.b32decode(sys.argv[1],casefold=True); c=int(time.time())//30
          d=hmac.new(key,struct.pack('>Q',c),hashlib.sha1).digest(); o=d[-1]&15
          n=((d[o]&127)<<24)|((d[o+1]&255)<<16)|((d[o+2]&255)<<8)|(d[o+3]&255)
          print(f'{n%1000000:06d}')
          PY
          )"
          M="$(curl -sS -o /tmp/admin-v7-private/totp-response.json -w '%{http_code}' -b /tmp/admin-v7-private/cookies.txt -c /tmp/admin-v7-private/cookies.txt -X POST "$TEST_URL/api/organization/login/totp" -H "Origin: $TEST_URL" -H 'Content-Type: application/json' --data "{\"code\":\"$OTP\"}" || printf 000)"
          [[ "$M" == '200' ]] || fail_diag totp_login "$M" "$(jq -r '.error.code//"non_json"' /tmp/admin-v7-private/totp-response.json 2>/dev/null || printf non_json)"
          ME="$(curl -sS -o /tmp/admin-v7-private/me.json -w '%{http_code}' -b /tmp/admin-v7-private/cookies.txt "$TEST_URL/api/organization/me" || printf 000)"
          [[ "$ME" == '200' ]] || fail_diag session_me "$ME" unavailable
          jq -e '.assurance=="mfa" and (.memberships|length==1) and .memberships[0].role=="organizer"' /tmp/admin-v7-private/me.json >/dev/null || fail_diag session_contract 200 invalid_contract
          jq -n --arg bootstrap "$B" --arg password "$L" --arg totp "$M" --arg me "$ME" '{ok:true,bootstrap_status:$bootstrap,password_status:$password,totp_status:$totp,me_status:$me}' > /tmp/admin-v7/runtime-smoke.json

      - name: Install Chromium for real browser gate
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Real browser login create logout login multi-campaign gate
        id: browser_smoke
        shell: bash
        run: |
          set -euo pipefail
          cat > admin-browser-gate.mjs <<'JS'
          import crypto from 'node:crypto';
          import { chromium } from 'playwright';

          const url = process.env.TEST_URL;
          const username = process.env.SMOKE_USERNAME;
          const password = process.env.SMOKE_PASSWORD;
          const runId = process.env.GITHUB_RUN_ID;
          const bootstrap = JSON.parse(await (await import('node:fs/promises')).readFile('/tmp/admin-v7-private/bootstrap-response.json', 'utf8'));
          const otpUri = new URL(bootstrap.otpauthUri);
          const secret = otpUri.searchParams.get('secret');
          if (!url || !username || !password || !secret) throw new Error('Browser gate inputs missing');

          function decodeBase32(value) {
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
            let bits = '';
            for (const char of value.replace(/=+$/u, '').toUpperCase()) {
              const index = alphabet.indexOf(char);
              if (index < 0) throw new Error('Invalid base32 secret');
              bits += index.toString(2).padStart(5, '0');
            }
            const bytes = [];
            for (let i = 0; i + 8 <= bits.length; i += 8) bytes.push(Number.parseInt(bits.slice(i, i + 8), 2));
            return Buffer.from(bytes);
          }

          function totp() {
            const counter = Math.floor(Date.now() / 1000 / 30);
            const message = Buffer.alloc(8);
            message.writeBigUInt64BE(BigInt(counter));
            const digest = crypto.createHmac('sha1', decodeBase32(secret)).update(message).digest();
            const offset = digest[digest.length - 1] & 0x0f;
            const binary = ((digest[offset] & 0x7f) << 24) | ((digest[offset + 1] & 0xff) << 16) | ((digest[offset + 2] & 0xff) << 8) | (digest[offset + 3] & 0xff);
            return String(binary % 1_000_000).padStart(6, '0');
          }

          async function waitForFreshCounter() {
            const waitMs = 30_000 - (Date.now() % 30_000) + 1_500;
            await new Promise((resolve) => setTimeout(resolve, waitMs));
          }

          async function login(page) {
            await page.goto(`${url}/login`, { waitUntil: 'domcontentloaded' });
            await page.getByLabel('Benutzername').fill(username);
            await page.getByLabel('Passwort').fill(password);
            await page.getByRole('button', { name: 'Weiter', exact: true }).click();
            await page.getByLabel('6-stelliger Code').waitFor();
            await waitForFreshCounter();
            await page.getByLabel('6-stelliger Code').fill(totp());
            await page.getByRole('button', { name: 'Anmelden', exact: true }).click();
            await page.waitForURL('**/admin');
            await page.getByRole('heading', { name: 'Aktionen', exact: true }).waitFor();
          }

          async function createCampaign(page, name) {
            await page.getByRole('button', { name: /Neue Aktion/u }).click();
            await page.waitForURL('**/new*');
            await page.getByLabel('Name der Aktion').fill(name);
            await page.getByRole('button', { name: 'Aktion erstellen', exact: true }).click();
            await page.waitForURL('**/admin/campaign/**');
            await page.getByRole('heading', { name, exact: true }).waitFor();
            await page.getByRole('button', { name: 'Aktionen', exact: true }).first().click();
            await page.waitForURL('**/admin');
          }

          const browser = await chromium.launch({ headless: true, args: ['--use-gl=swiftshader'] });
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            page.setDefaultTimeout(20_000);
            await login(page);
            const campaignA = `Browser Aktion A ${runId}`;
            const campaignB = `Browser Aktion B ${runId}`;
            await createCampaign(page, campaignA);
            await createCampaign(page, campaignB);
            await page.getByRole('button', { name: 'Abmelden', exact: true }).click();
            await page.waitForURL('**/login');
            await login(page);
            await page.getByText(campaignA, { exact: true }).waitFor();
            await page.getByText(campaignB, { exact: true }).waitFor();
            await page.screenshot({ path: '/tmp/admin-v7/browser-admin.png', fullPage: true });
            await (await import('node:fs/promises')).writeFile('/tmp/admin-v7/browser-status.json', JSON.stringify({ok:true, login:true, create:true, logout:true, relogin:true, multiCampaign:true}) + '\n');
          } finally {
            await browser.close();
          }
          JS
          node admin-browser-gate.mjs
          rm -f admin-browser-gate.mjs

      - name: Clean disposable Admin state
        id: cleanup
        if: always() && steps.resources.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$ADMIN_DB_NAME" --env admin_staging --config wrangler.jsonc --remote --command "DELETE FROM organization_bootstrap_state; DELETE FROM organizations; DELETE FROM organization_accounts; DELETE FROM organization_login_throttles;"
          CLEAN="$(npx wrangler d1 execute "$ADMIN_DB_NAME" --env admin_staging --config wrangler.jsonc --remote --json --command "SELECT (SELECT COUNT(*) FROM organization_bootstrap_state) bootstrap_count,(SELECT COUNT(*) FROM organizations) organization_count,(SELECT COUNT(*) FROM organization_accounts) account_count,(SELECT COUNT(*) FROM campaigns WHERE organization_id IS NOT NULL) owned_campaign_count;")"
          printf '%s' "$CLEAN" > /tmp/admin-v7/clean-state.json
          jq -e '.[0].results[0] | .bootstrap_count==0 and .organization_count==0 and .account_count==0 and .owned_campaign_count==0' <<<"$CLEAN" >/dev/null
          npx wrangler d1 execute "$ADMIN_DB_NAME" --env admin_staging --config wrangler.jsonc --remote --json --command 'PRAGMA foreign_key_check;' > /tmp/admin-v7/fk-after.json
          jq -e '[.[].results[]?] | length == 0' /tmp/admin-v7/fk-after.json >/dev/null

      - name: Build final private candidate
        id: final_build
        if: always() && steps.cleanup.outcome == 'success'
        env:
          CLOUDFLARE_ENV: admin_staging
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const c = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          c.env.admin_staging.vars.ORGANIZATION_BOOTSTRAP_SECRET_SHA256 = process.env.FINAL_BOOTSTRAP_SECRET_SHA256;
          delete c.env.admin_staging.vars.ORGANIZATION_KDF_DIAGNOSTICS;
          fs.writeFileSync('wrangler.jsonc', JSON.stringify(c, null, 2) + '\n');
          NODE
          rm -rf dist .wrangler/deploy
          npm run build
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const redirect = JSON.parse(fs.readFileSync('.wrangler/deploy/config.json', 'utf8'));
          const generated = JSON.parse(fs.readFileSync(path.resolve('.wrangler/deploy', redirect.configPath), 'utf8'));
          if (generated.name !== process.env.ADMIN_WORKER_NAME) throw new Error('Final Worker mismatch');
          if ((generated.d1_databases || []).find((x) => x.binding === 'DB')?.database_id !== process.env.ADMIN_D1_ID) throw new Error('Final D1 mismatch');
          if (generated.vars?.ORGANIZATION_BOOTSTRAP_SECRET_SHA256 !== process.env.FINAL_BOOTSTRAP_SECRET_SHA256) throw new Error('Final setup digest mismatch');
          if ('ORGANIZATION_KDF_DIAGNOSTICS' in (generated.vars || {})) throw new Error('KDF diagnostics leaked into final candidate');
          const serialized = JSON.stringify(generated);
          if (serialized.includes(process.env.PROD_D1_ID) || serialized.includes(process.env.RXDB_STAGING_D1_ID)) throw new Error('Protected D1 leaked into final candidate');
          NODE

      - name: Deploy final candidate
        id: final_deploy
        if: always() && steps.final_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/admin-v7/deploy-final.log
          FINAL_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/admin-v7/deploy-final.log | tail -n1 || true)"
          [[ -n "$FINAL_URL" ]] || exit 1
          grep -F 'ORGANIZATION_PASSWORD_KDF' /tmp/admin-v7/deploy-final.log >/dev/null
          printf '%s\n' "$FINAL_URL" > /tmp/admin-v7/test-url.txt
          echo "TEST_URL=$FINAL_URL" >> "$GITHUB_ENV"

      - name: Verify final version convergence and public safety
        id: safety
        if: always() && steps.final_deploy.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          PROBE="$(jq -n --arg s "$SMOKE_BOOTSTRAP_SECRET" '{bootstrapSecret:$s}')"
          CONSECUTIVE=0
          for attempt in $(seq 1 24); do
            CODE="$(curl -sS -o /tmp/admin-v7-private/final-rotation-probe.json -w '%{http_code}' -X POST "$TEST_URL/api/organization/bootstrap" -H "Origin: $TEST_URL" -H 'Content-Type: application/json' --data "$PROBE" || printf 000)"
            printf 'rotation_attempt=%s status=%s\n' "$attempt" "$CODE" >> /tmp/admin-v7/safety-status.txt
            if [[ "$CODE" == '403' ]]; then
              CONSECUTIVE=$((CONSECUTIVE+1))
              if [[ "$CONSECUTIVE" -ge 3 ]]; then break; fi
            elif [[ "$CODE" == '400' || "$CODE" == '000' ]]; then
              CONSECUTIVE=0
            else
              echo "Unexpected rotation probe status: $CODE" >&2
              exit 1
            fi
            sleep 5
          done
          [[ "$CONSECUTIVE" -ge 3 ]] || { echo 'Final Worker version did not converge to rotated bootstrap hash.' >&2; exit 1; }
          START="$(curl -sSLo /tmp/admin-v7-private/final-start.html -w '%{http_code}' "$TEST_URL/start")"
          ME="$(curl -sS -o /tmp/admin-v7-private/final-me.json -w '%{http_code}' "$TEST_URL/api/organization/me")"
          ORIGIN="$(curl -sS -o /tmp/admin-v7-private/final-origin.json -w '%{http_code}' -X POST "$TEST_URL/api/organization/login/password" -H 'Origin: https://invalid.example' -H 'Content-Type: application/json' --data '{}')"
          printf 'start=%s\nme=%s\ncross_origin=%s\nrotation_consecutive=%s\n' "$START" "$ME" "$ORIGIN" "$CONSECUTIVE" >> /tmp/admin-v7/safety-status.txt
          [[ "$START" -ge 200 && "$START" -lt 400 ]]
          [[ "$ME" == '401' ]]
          [[ "$ORIGIN" == '403' ]]
          curl -sS -D /tmp/admin-v7/final-headers.txt -o /dev/null "$TEST_URL/start"
          grep -Eqi '^x-frame-options: DENY' /tmp/admin-v7/final-headers.txt
          grep -Eqi '^x-content-type-options: nosniff' /tmp/admin-v7/final-headers.txt
          grep -Eqi '^referrer-policy: strict-origin-when-cross-origin' /tmp/admin-v7/final-headers.txt
          ! grep -F "$PROD_D1_ID" /tmp/admin-v7-private/final-start.html >/dev/null
          ! grep -F "$RXDB_STAGING_D1_ID" /tmp/admin-v7-private/final-start.html >/dev/null
          printf 'safety_output=true\n' >> /tmp/admin-v7/safety-status.txt

      - name: Prove checked-in production config remained untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git show "$AUDITED_SOURCE_SHA:wrangler.jsonc" > /tmp/admin-v7/checked-in-wrangler.jsonc
          node <<'NODE'
          const fs = require('node:fs');
          const c = JSON.parse(fs.readFileSync('/tmp/admin-v7/checked-in-wrangler.jsonc', 'utf8'));
          if (c.main !== './worker/indexFc52.ts') throw new Error('Checked-in production main is not FC5.2');
          if ((c.d1_databases || []).find((x) => x.binding === 'DB')?.database_id !== process.env.PROD_D1_ID) throw new Error('Checked-in production D1 changed');
          if ((c.ratelimits || []).some((x) => x.name === 'ORGANIZATION_LOGIN_LIMITER')) throw new Error('Checked-in production config contains Organizer limiter');
          NODE

      - name: Upload sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-staging-v7-diagnostics
          path: /tmp/admin-v7/
          retention-days: 3
          if-no-files-found: warn

      - name: Final gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.runtime_smoke.outcome }}" == 'success' ]]
          [[ "${{ steps.browser_smoke.outcome }}" == 'success' ]]
          [[ "${{ steps.cleanup.outcome }}" == 'success' ]]
          [[ "${{ steps.final_build.outcome }}" == 'success' ]]
          [[ "${{ steps.final_deploy.outcome }}" == 'success' ]]
          [[ "${{ steps.safety.outcome }}" == 'success' ]]
