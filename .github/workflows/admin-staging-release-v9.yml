name: Organizer Admin Staging Release V9

on:
  push:
    branches:
      - organizer-admin-staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: organizer-admin-staging-release-v9
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONFIGURED_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AUDITED_SOURCE_SHA: 15106e12806dcb991aaea34424f0894b2dbddaa6
      FINAL_BOOTSTRAP_SECRET_SHA256: 75ce557d4c0ed79819d55ecfeffaa5de67a39e925845bb2dc6840d9ba60af0db
    steps:
      - name: Checkout staging derivation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact green feature derivation
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$AUDITED_SOURCE_SHA^{commit}"
          git diff --exit-code "$AUDITED_SOURCE_SHA" HEAD -- . \
            ':(exclude).github/workflows/admin-staging-release-v9.yml' \
            ':(exclude).staging/admin-v9-release.sh' \
            ':(exclude).staging/admin-v9-browser.mjs'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Exact-head tests
        run: npm test

      - name: Exact-head typecheck
        run: npm run typecheck

      - name: Exact-head dependency audit
        run: npm run audit:dependencies

      - name: Exact-head production build
        run: npm run build

      - name: Harden isolated candidate rollout convergence
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('.staging/admin-v9-release.sh')
          text = path.read_text()
          marker = 'for attempt in $(seq 1 24); do\n  START='
          if text.count(marker) != 1:
              raise SystemExit('candidate convergence loop marker changed')
          text = text.replace(marker, 'CANDIDATE_CONSECUTIVE=0\n' + marker, 1)
          old = '  if [[ "$START" -ge 200 && "$START" -lt 400 && "$CODE" == \'400\' ]]; then break; fi\n'
          new = '''  if [[ "$START" -ge 200 && "$START" -lt 400 && "$CODE" == '400' ]]; then
            CANDIDATE_CONSECUTIVE=$((CANDIDATE_CONSECUTIVE+1))
            [[ "$CANDIDATE_CONSECUTIVE" -ge 5 ]] && break
          else
            CANDIDATE_CONSECUTIVE=0
          fi
          '''
          if text.count(old) != 1:
              raise SystemExit('candidate convergence condition changed')
          text = text.replace(old, new, 1)
          old_tail = '  sleep 5\ndone\n\nHEAD_CODE='
          new_tail = '''  sleep 4
          done
          [[ "$CANDIDATE_CONSECUTIVE" -ge 5 ]] || { echo 'Candidate did not converge stably.' >&2; exit 1; }
          jq -n --arg start "$START" --arg probe "$CODE" --argjson consecutive "$CANDIDATE_CONSECUTIVE" '{ok:true,start_status:$start,bootstrap_probe_status:$probe,consecutive:$consecutive}' > "$OUT/candidate-convergence.json"

          HEAD_CODE='''
          if text.count(old_tail) != 1:
              raise SystemExit('candidate convergence tail changed')
          text = text.replace(old_tail, new_tail, 1)
          path.write_text(text)
          PY
          grep -q 'CANDIDATE_CONSECUTIVE' .staging/admin-v9-release.sh

      - name: Run isolated Admin staging acceptance
        shell: bash
        run: bash .staging/admin-v9-release.sh

      - name: Upload sanitized Admin staging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-staging-v9-diagnostics
          path: /tmp/admin-v9/
          retention-days: 3
          if-no-files-found: warn
