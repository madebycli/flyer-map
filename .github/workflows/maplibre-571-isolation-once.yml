name: MapLibre 5.7.1 Isolation Once

on:
  push:
    branches:
      - fix/street-engine-smart-marking
    paths:
      - .github/workflows/maplibre-571-isolation-once.yml

permissions:
  contents: write

jobs:
  isolate-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Show exact paint-property call sites
        shell: bash
        run: |
          set -euo pipefail
          grep -n -C 6 'setPaintProperty' src/map/MapView.tsx
          exit 1
