name: MapLibre 5.7.1 Isolation Once

on:
  push:
    branches:
      - fix/street-engine-smart-marking
    paths:
      - .github/workflows/maplibre-571-isolation-once.yml

permissions:
  contents: write

jobs:
  isolate-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Add runtime-neutral MapLibre 5 paint typing compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/map/MapView.tsx')
          text = path.read_text()
          for prop in ('line-opacity', 'circle-opacity', 'fill-opacity'):
              needle = f'layer.paint["{prop}"]'
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence, found {count}: {needle}')
              text = text.replace(
                  needle,
                  f'({needle} as number | ExpressionSpecification | undefined)',
              )
          path.write_text(text)
          PY
      - name: Pin only MapLibre to historical 5.7.1
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm install --save-exact --no-audit --no-fund maplibre-gl@5.7.1
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (pkg.dependencies?.['maplibre-gl'] !== '5.7.1') throw new Error('package.json is not pinned to MapLibre 5.7.1');
          if (lock.packages?.['']?.dependencies?.['maplibre-gl'] !== '5.7.1') throw new Error('package-lock root is not pinned to MapLibre 5.7.1');
          if (lock.packages?.['node_modules/maplibre-gl']?.version !== '5.7.1') throw new Error('resolved MapLibre package is not 5.7.1');
          NODE
      - name: Verify application runtime against MapLibre 5.7.1
        run: npm run check
      - name: Commit verified version isolation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/map/MapView.tsx package.json package-lock.json
          git commit -m 'test: isolate MapLibre 5.7.1 renderer'
          git push origin HEAD:fix/street-engine-smart-marking
