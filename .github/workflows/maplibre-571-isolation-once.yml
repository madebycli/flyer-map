name: MapLibre 5.7.1 Isolation Once

on:
  push:
    branches:
      - fix/street-engine-smart-marking
    paths:
      - .github/workflows/maplibre-571-isolation-once.yml
      - tests/basemapStyle.test.ts
      - scripts/audit-dependencies.mjs

permissions:
  contents: write

jobs:
  isolate-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin historical MapLibre dependency set
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm install --save-exact --no-audit --no-fund maplibre-gl@5.7.1 @mapbox/unitbezier@0.0.1
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (pkg.dependencies?.['maplibre-gl'] !== '5.7.1') throw new Error('package.json is not pinned to MapLibre 5.7.1');
          if (pkg.dependencies?.['@mapbox/unitbezier'] !== '0.0.1') throw new Error('package.json is not pinned to @mapbox/unitbezier 0.0.1');
          if (lock.packages?.['']?.dependencies?.['maplibre-gl'] !== '5.7.1') throw new Error('package-lock root is not pinned to MapLibre 5.7.1');
          if (lock.packages?.['']?.dependencies?.['@mapbox/unitbezier'] !== '0.0.1') throw new Error('package-lock root is not pinned to @mapbox/unitbezier 0.0.1');
          if (lock.packages?.['node_modules/maplibre-gl']?.version !== '5.7.1') throw new Error('resolved MapLibre package is not 5.7.1');
          if (lock.packages?.['node_modules/@mapbox/unitbezier']?.version !== '0.0.1') throw new Error('resolved @mapbox/unitbezier package is not 0.0.1');
          NODE
      - name: Verify unchanged application runtime against MapLibre 5.7.1
        run: npm run check
      - name: Commit verified version isolation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'test: isolate MapLibre 5.7.1 renderer'
          git push origin HEAD:fix/street-engine-smart-marking
