name: Hotfix clean startup bootstrap source

on:
  push:
    branches:
      - mission-rxdb-sync

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: mission-rxdb-sync
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch clean startup bootstrap ordering
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          store = Path('src/data/campaignStore.ts')
          source = store.read_text()
          old_target = '  const targetCampaignId = campaignIdFromUrl() ?? local.campaign.id;\n'
          new_target = '  const explicitCampaignId = campaignIdFromUrl();\n  const targetCampaignId = explicitCampaignId ?? local.campaign.id;\n'
          if source.count(old_target) != 1:
              raise SystemExit('Expected exactly one clean-start target expression')
          source = source.replace(old_target, new_target, 1)

          old_guard = '      if (!loadedExistingSnapshot && !campaignIdFromUrl() && local.campaign.id === targetCampaignId) {\n'
          new_guard = '      if (!loadedExistingSnapshot && !explicitCampaignId && local.campaign.id === targetCampaignId) {\n'
          if source.count(old_guard) != 1:
              raise SystemExit('Expected exactly one clean-start bootstrap guard')
          source = source.replace(old_guard, new_guard, 1)
          store.write_text(source)

          test = Path('tests/cleanStartupBootstrap.test.ts')
          test.write_text('''import assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\nimport test from "node:test";\n\ntest("clean browser startup preserves the absence of an explicit Campaign until bootstrap", async () => {\n  const source = await readFile(new URL("../src/data/campaignStore.ts", import.meta.url), "utf8");\n  const explicitIndex = source.indexOf("const explicitCampaignId = campaignIdFromUrl();");\n  const normalizeIndex = source.indexOf("setCampaignIdInUrl(targetCampaignId);");\n  const bootstrapIndex = source.indexOf("!loadedExistingSnapshot && !explicitCampaignId");\n  const createIndex = source.indexOf("createCampaignSnapshot(local)");\n\n  assert.ok(explicitIndex >= 0, "explicit Campaign URL state must be captured before URL normalization");\n  assert.ok(normalizeIndex > explicitIndex, "URL normalization must happen after capturing explicit Campaign state");\n  assert.ok(bootstrapIndex > normalizeIndex, "fresh bootstrap decision must use the captured pre-normalization state");\n  assert.ok(createIndex > bootstrapIndex, "fresh clean browsers must still reach initial Campaign creation");\n  assert.doesNotMatch(source, /!loadedExistingSnapshot && !campaignIdFromUrl\\(\\)/u);\n});\n''')
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Dependency audit
        run: npm run audit:dependencies

      - name: Build
        run: npm run build

      - name: Commit verified hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/campaignStore.ts tests/cleanStartupBootstrap.test.ts
          git diff --cached --check
          git commit -m "fix: bootstrap clean browser campaign"
          git push origin HEAD:mission-rxdb-sync
