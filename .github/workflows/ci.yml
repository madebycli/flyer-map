name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release-*"
      - mission-rxdb-sync
      - feature/organizer-admin-platform

permissions:
  contents: read

jobs:
  check:
    # Release integration branches use these same gates before promotion to main.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary="$(grep -E 'not ok|error|Error|Assertion|ERR_|SQLITE|failureType|location|message' test-output.log | tail -n 24 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            if [ -z "$summary" ]; then
              summary="$(tail -n 24 test-output.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            fi
            echo "::error title=npm test failed::$summary"
            exit "$status"
          fi
      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log
          retention-days: 1
      - name: Typecheck
        run: npm run typecheck
      - name: Dependency audit
        run: npm run audit:dependencies
      - name: Production build
        run: npm run build
