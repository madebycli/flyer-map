name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release-*"
      - mission-rxdb-sync
      - feature/organizer-admin-platform

permissions:
  contents: read

jobs:
  check:
    # Release integration branches use these same gates before promotion to main.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Dependency audit
        run: npm run audit:dependencies
      - name: Production build
        run: npm run build
