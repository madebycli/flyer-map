name: One-shot MapLibre live renderer fix

on:
  push:
    branches:
      - mission-rxdb-sync
    paths:
      - .github/workflows/map-renderer-live-sync-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout canonical RxDB branch
        uses: actions/checkout@v4
        with:
          ref: mission-rxdb-sync
          fetch-depth: 1

      - name: Remove lossy MapLibre style-loaded guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/map/MapView.tsx")
          source = path.read_text()
          needle = '    if (!map || !map.isStyleLoaded()) return;\n'
          count = source.count(needle)
          if count != 10:
              raise SystemExit(f"expected exactly 10 lossy live-sync guards, found {count}")
          source = source.replace(needle, '    if (!map) return;\n')
          path.write_text(source)
          PY

          cat > tests/mapRendererLiveSync.test.ts <<'TEST'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import test from "node:test";

          const source = readFileSync(new URL("../src/map/MapView.tsx", import.meta.url), "utf8");

          test("MapLibre live source effects never drop a prop update while style work is pending", () => {
            assert.equal(
              (source.match(/if \(!map \|\| !map\.isStyleLoaded\(\)\) return;/g) ?? []).length,
              0,
            );

            for (const syncCall of [
              "syncAreaData(map, areas);",
              "syncStreetData(map, tasks);",
              "syncHouseData(map, houses);",
              "syncSmartHouseData(map, smartHouseBuildings);",
              "syncSmartHouseSelection(map, smartHouseSelectedSourceIds, mode);",
              "syncCollectionPickupData(map, collectionPickups);",
              "syncCollectionPickupSelection(map, selectedCollectionPickupId, collectionVisible);",
              "syncApplicationFilters(",
            ]) {
              assert.ok(source.includes(syncCall), `missing live MapLibre sync call: ${syncCall}`);
            }
          });

          test("style.load still hydrates every primary application GeoJSON source from latest refs", () => {
            const styleLoad = source.slice(source.indexOf('map.once("style.load"'), source.indexOf('map.on("idle"'));
            assert.match(styleLoad, /const current = dataRef\.current;/);
            assert.match(styleLoad, /syncAreaData\(map, current\.areas\);/);
            assert.match(styleLoad, /syncStreetData\(map, current\.tasks\);/);
            assert.match(styleLoad, /syncHouseData\(map, current\.houses\);/);
          });
          TEST

      - name: Run focused regression and typecheck
        run: |
          node --experimental-transform-types --test tests/mapRendererLiveSync.test.ts
          npm ci
          npm run typecheck

      - name: Commit canonical fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "madebycli"
          git config user.email "root.cli@proton.me"
          git add src/map/MapView.tsx tests/mapRendererLiveSync.test.ts
          git diff --cached --check
          git commit -m "fix: keep MapLibre graphics live with RxDB state"
          git push origin HEAD:mission-rxdb-sync
