name: Staging two-browser RxDB gate

on:
  push:
    branches:
      - mission-rxdb-staging
    paths:
      - .github/workflows/staging-browser-gate.yml
      - .github/scripts/staging-browser-gate.mjs

permissions:
  contents: read

concurrency:
  group: rxdb-staging-browser-gate
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_URL: https://flyer-map-staging.cloudflare-eleven035.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium

      - name: Fresh admin plus two-browser realtime gate
        run: node .github/scripts/staging-browser-gate.mjs
