name: Release Stable and Unstable Channels

on:
  push:
    branches:
      - main
      - unstable

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  stable:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONFIGURED_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STABLE_WORKER_NAME: flyer-map
      STABLE_DB_NAME: flyer-map-db
      STABLE_D1_ID: 0113e775-1e43-4d96-8b97-51fdeec7355b
      STABLE_URL: https://flyer-map.cloudflare-eleven035.workers.dev
      UNSTABLE_URL: https://flyer-map-unstable.cloudflare-eleven035.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enforce Stable source branch invariant
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_REF_NAME" == 'main' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          node <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          const db=c.d1_databases?.[0];
          if(c.name!=='flyer-map') throw new Error('stable_worker_mismatch');
          if(c.vars?.RUNTIME_ENVIRONMENT!=='main') throw new Error('stable_runtime_environment_mismatch');
          if(!db || db.database_name!=='flyer-map-db' || db.database_id!=='0113e775-1e43-4d96-8b97-51fdeec7355b') throw new Error('stable_d1_mismatch');
          NODE

      - name: Verify Stable candidate
        run: |
          npm ci --no-audit --no-fund
          npm run check

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          ACCOUNTS_JSON="$(curl --fail-with-body --silent --show-error 'https://api.cloudflare.com/client/v4/accounts?per_page=50' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')"
          [[ "$(jq -r '.success' <<<"$ACCOUNTS_JSON")" == 'true' ]]
          if [[ -n "${CONFIGURED_CLOUDFLARE_ACCOUNT_ID:-}" ]] && jq -e --arg id "$CONFIGURED_CLOUDFLARE_ACCOUNT_ID" '.result[]|select(.id==$id)' <<<"$ACCOUNTS_JSON" >/dev/null; then
            ACCOUNT_ID="$CONFIGURED_CLOUDFLARE_ACCOUNT_ID"
          elif [[ "$(jq '.result|length' <<<"$ACCOUNTS_JSON")" == '1' ]]; then
            ACCOUNT_ID="$(jq -r '.result[0].id' <<<"$ACCOUNTS_JSON")"
          else
            echo 'Cloudflare account is ambiguous.' >&2
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Read-only verify Stable schema and secrets
        shell: bash
        run: |
          set -euo pipefail
          SCHEMA="$(npx wrangler d1 execute "$STABLE_DB_NAME" --remote --json --command "SELECT name FROM sqlite_master WHERE name IN ('campaign_sync_changes','area_task_preparations','street_network_jobs','street_network_staging','street_base_areas','street_base_chunks','street_work_overlays') ORDER BY name;")"
          jq -e '.[0].results | map(.name) | contains(["area_task_preparations","campaign_sync_changes","street_base_areas","street_base_chunks","street_network_jobs","street_network_staging","street_work_overlays"])' <<<"$SCHEMA" >/dev/null
          SECRET_LIST="$(curl --fail-with-body --silent --show-error "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${STABLE_WORKER_NAME}/secrets" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')"
          jq -e '.success == true' <<<"$SECRET_LIST" >/dev/null
          jq -e '.result[] | select(.name=="ORGANIZATION_TOTP_KEY")' <<<"$SECRET_LIST" >/dev/null
          jq -e '.result[] | select(.name=="FIELD_GROUP_CREDENTIAL_ENCRYPTION_KEY")' <<<"$SECRET_LIST" >/dev/null

      - name: Stamp exact main source revision
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          c.vars={...(c.vars||{}),RUNTIME_ENVIRONMENT:'main',SOURCE_COMMIT_SHA:process.env.GITHUB_SHA};
          fs.writeFileSync('wrangler.jsonc',JSON.stringify(c,null,2)+'\n');
          NODE

      - name: Deploy exact main to Stable without D1 migration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          rm -rf dist .wrangler
          npm run build
          npx wrangler deploy 2>&1 | tee /tmp/stable-deploy.log
          grep -q 'https://flyer-map.cloudflare-eleven035.workers.dev' /tmp/stable-deploy.log

      - name: Smoke Stable and capture release state
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(curl -sS -D /tmp/stable.headers -o /tmp/stable.html -w '%{http_code}' "$STABLE_URL/")"
          LOGIN="$(curl -sS -o /tmp/stable-login.html -w '%{http_code}' "$STABLE_URL/login")"
          ME="$(curl -sS -o /tmp/stable-me.json -w '%{http_code}' "$STABLE_URL/api/organization/me")"
          [[ "$ROOT" -ge 200 && "$ROOT" -lt 400 ]]
          [[ "$LOGIN" -ge 200 && "$LOGIN" -lt 400 ]]
          [[ "$ME" == '401' ]]
          STABLE_RUNTIME="$(curl --fail --silent --show-error "$STABLE_URL/api/runtime")"
          jq -e --arg sha "$GITHUB_SHA" '.ok == true and .environment == "main" and .sourceCommit == $sha' <<<"$STABLE_RUNTIME" >/dev/null
          UNSTABLE_RUNTIME="$(curl --fail --silent --show-error "$UNSTABLE_URL/api/runtime" 2>/dev/null || printf '{}')"
          jq -n \
            --arg recordedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg stableBranch main \
            --arg unstableBranch unstable \
            --arg stableUrl "$STABLE_URL" \
            --arg unstableUrl "$UNSTABLE_URL" \
            --argjson stableRuntime "$STABLE_RUNTIME" \
            --argjson unstableRuntime "$UNSTABLE_RUNTIME" \
            '{schemaVersion:1,recordedAt:$recordedAt,invariant:{stable:{sourceBranch:$stableBranch,url:$stableUrl},unstable:{sourceBranch:$unstableBranch,url:$unstableUrl}},stable:$stableRuntime,unstable:$unstableRuntime}' \
            > /tmp/release-channel-state.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-channel-state-stable
          path: /tmp/release-channel-state.json
          retention-days: 30
          if-no-files-found: ignore

  unstable:
    if: github.ref == 'refs/heads/unstable'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONFIGURED_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BETA_BACKEND_WORKER: flyer-map-unstable-backend
      BETA_DB_NAME: flyer-map-unstable-db
      UNSTABLE_ALIAS_WORKER: flyer-map-unstable
      PROD_D1_ID: 0113e775-1e43-4d96-8b97-51fdeec7355b
      RXDB_STAGING_D1_ID: bcec3432-18ec-42a2-970a-64d52c8263d5
      BOOTSTRAP_SHA256: 2058707356b5b06c207d0e4a49148626058e6e2661af9dd4a4bb86c32d7930d9
      STABLE_URL: https://flyer-map.cloudflare-eleven035.workers.dev
      UNSTABLE_URL: https://flyer-map-unstable.cloudflare-eleven035.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enforce Unstable source branch invariant
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/unstable' ]]
          [[ "$GITHUB_REF_NAME" == 'unstable' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - name: Verify Unstable candidate
        run: |
          npm ci --no-audit --no-fund
          npm run check

      - name: Resolve account and dedicated Unstable D1
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          ACCOUNTS_JSON="$(curl --fail-with-body --silent --show-error 'https://api.cloudflare.com/client/v4/accounts?per_page=50' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')"
          [[ "$(jq -r '.success' <<<"$ACCOUNTS_JSON")" == 'true' ]]
          if [[ -n "${CONFIGURED_CLOUDFLARE_ACCOUNT_ID:-}" ]] && jq -e --arg id "$CONFIGURED_CLOUDFLARE_ACCOUNT_ID" '.result[]|select(.id==$id)' <<<"$ACCOUNTS_JSON" >/dev/null; then
            ACCOUNT_ID="$CONFIGURED_CLOUDFLARE_ACCOUNT_ID"
          elif [[ "$(jq '.result|length' <<<"$ACCOUNTS_JSON")" == '1' ]]; then
            ACCOUNT_ID="$(jq -r '.result[0].id' <<<"$ACCOUNTS_JSON")"
          else
            echo 'Cloudflare account is ambiguous.' >&2
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

          LIST_JSON="$(npx wrangler d1 list --json)"
          BETA_D1_ID="$(jq -r --arg name "$BETA_DB_NAME" '[.[]|select(.name==$name)]|if length==1 then .[0].uuid else empty end' <<<"$LIST_JSON")"
          if [[ -z "$BETA_D1_ID" ]]; then
            CREATED="$(curl --fail-with-body --silent --show-error -X POST "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/d1/database" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data "{\"name\":\"${BETA_DB_NAME}\"}")"
            jq -e '.success == true' <<<"$CREATED" >/dev/null
            BETA_D1_ID="$(jq -r '.result.uuid' <<<"$CREATED")"
          fi
          [[ -n "$BETA_D1_ID" ]]
          [[ "$BETA_D1_ID" != "$PROD_D1_ID" ]]
          [[ "$BETA_D1_ID" != "$RXDB_STAGING_D1_ID" ]]
          echo "BETA_D1_ID=$BETA_D1_ID" >> "$GITHUB_ENV"

      - name: Materialize isolated Unstable config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          c.name=process.env.BETA_BACKEND_WORKER;
          c.workers_dev=true;
          c.vars={
            ...(c.vars||{}),
            RUNTIME_ENVIRONMENT:'unstable',
            SOURCE_COMMIT_SHA:process.env.GITHUB_SHA,
            ORGANIZATION_KDF_DIAGNOSTICS:'0',
            ORGANIZATION_OPTIONAL_MFA:'1',
            ORGANIZATION_BOOTSTRAP_SECRET_SHA256:process.env.BOOTSTRAP_SHA256,
          };
          c.d1_databases=[{
            binding:'DB',
            database_name:process.env.BETA_DB_NAME,
            database_id:process.env.BETA_D1_ID,
            migrations_dir:'migrations',
          }];
          c.ratelimits=[
            {name:'FIELD_GROUP_JOIN_ACTOR_LIMITER',namespace_id:'92014001',simple:{limit:30,period:60}},
            {name:'FIELD_GROUP_JOIN_CREDENTIAL_LIMITER',namespace_id:'92014002',simple:{limit:8,period:60}},
            {name:'PICKUP_SEARCH_LIMITER',namespace_id:'92014003',simple:{limit:20,period:10}},
            {name:'ORGANIZATION_LOGIN_LIMITER',namespace_id:'92014004',simple:{limit:12,period:60}},
          ];
          fs.writeFileSync('wrangler.jsonc',JSON.stringify(c,null,2)+'\n');
          NODE

      - name: Apply official migrations only to dedicated Unstable D1
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/unstable' ]]
          npx wrangler d1 migrations apply "$BETA_DB_NAME" --remote --config wrangler.jsonc
          SCHEMA="$(npx wrangler d1 execute "$BETA_DB_NAME" --remote --config wrangler.jsonc --json --command "SELECT name FROM sqlite_master WHERE name IN ('organizations','organization_accounts','campaign_sync_changes','street_base_chunks','campaign_sync_retention','auth_trusted_devices') ORDER BY name;")"
          jq -e '.[0].results | map(.name) | contains(["auth_trusted_devices","campaign_sync_changes","campaign_sync_retention","organization_accounts","organizations","street_base_chunks"])' <<<"$SCHEMA" >/dev/null
          ORG_COLS="$(npx wrangler d1 execute "$BETA_DB_NAME" --remote --config wrangler.jsonc --json --command "PRAGMA table_info('organization_accounts');")"
          jq -e '.[0].results | map(.name) | contains(["mfa_required"])' <<<"$ORG_COLS" >/dev/null
          RETENTION_COLS="$(npx wrangler d1 execute "$BETA_DB_NAME" --remote --config wrangler.jsonc --json --command "PRAGMA table_info('campaign_sync_retention');")"
          jq -e '.[0].results | map(.name) | contains(["campaign_id","collection_name","min_checkpoint_seq","epoch","updated_at"])' <<<"$RETENTION_COLS" >/dev/null
          TRUSTED_COLS="$(npx wrangler d1 execute "$BETA_DB_NAME" --remote --config wrangler.jsonc --json --command "PRAGMA table_info('auth_trusted_devices');")"
          jq -e '.[0].results | map(.name) | contains(["subject_kind","subject_id","family_id","token_hash","idle_expires_at","absolute_expires_at","revoked_at","replaced_by_id"])' <<<"$TRUSTED_COLS" >/dev/null

      - name: Prepare missing Unstable secrets
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error -o /tmp/unstable-secret-list.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${BETA_BACKEND_WORKER}/secrets" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' || true)"
          if [[ "$STATUS" != '200' ]] || ! jq -e '.success == true' /tmp/unstable-secret-list.json >/dev/null 2>&1; then
            printf '%s\n' '{"success":true,"result":[]}' > /tmp/unstable-secret-list.json
          fi
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const list=JSON.parse(fs.readFileSync('/tmp/unstable-secret-list.json','utf8')).result || [];
          const names=new Set(list.map(x=>x.name));
          const missing={};
          for (const name of ['ORGANIZATION_TOTP_KEY','FIELD_GROUP_CREDENTIAL_ENCRYPTION_KEY']) {
            if (!names.has(name)) missing[name]=crypto.randomBytes(32).toString('base64url');
          }
          fs.writeFileSync('/tmp/unstable-missing-secrets.json',JSON.stringify(missing));
          fs.writeFileSync('/tmp/unstable-secret-count.txt',String(Object.keys(missing).length));
          console.log(`Missing Unstable secrets prepared: ${Object.keys(missing).length}`);
          NODE

      - name: Build and deploy exact unstable source to isolated backend
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/unstable' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          rm -rf dist .wrangler
          npm run build
          if [[ "$(cat /tmp/unstable-secret-count.txt)" -gt 0 ]]; then
            npx wrangler deploy --config dist/flyer_map/wrangler.json --secrets-file /tmp/unstable-missing-secrets.json 2>&1 | tee /tmp/unstable-backend.log
          else
            npx wrangler deploy --config dist/flyer_map/wrangler.json 2>&1 | tee /tmp/unstable-backend.log
          fi
          grep -q 'flyer-map-unstable-backend.cloudflare-eleven035.workers.dev' /tmp/unstable-backend.log

      - name: Deploy public Unstable alias to isolated backend
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/unstable' ]]
          mkdir -p /tmp/unstable-alias
          cat > /tmp/unstable-alias/index.mjs <<'EOF'
          const upstreamHost='flyer-map-unstable-backend.cloudflare-eleven035.workers.dev';
          export default {
            async fetch(request) {
              const upstreamUrl=new URL(request.url);
              upstreamUrl.protocol='https:';
              upstreamUrl.hostname=upstreamHost;
              const upstreamRequest=new Request(upstreamUrl,request);
              const response=await fetch(upstreamRequest);
              const headers=new Headers(response.headers);
              headers.set('x-flyer-release-channel','unstable');
              if (response.webSocket) {
                return new Response(null,{status:101,headers,webSocket:response.webSocket});
              }
              return new Response(response.body,{status:response.status,statusText:response.statusText,headers});
            }
          };
          EOF
          cat > /tmp/unstable-alias/wrangler.jsonc <<'EOF'
          {
            "name": "flyer-map-unstable",
            "main": "index.mjs",
            "compatibility_date": "2026-08-01",
            "workers_dev": true
          }
          EOF
          (cd /tmp/unstable-alias && npx --yes wrangler@4 deploy --config wrangler.jsonc) 2>&1 | tee /tmp/unstable-alias.log
          grep -q 'https://flyer-map-unstable.cloudflare-eleven035.workers.dev' /tmp/unstable-alias.log

      - name: Smoke Unstable and capture release state
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(curl -sS -D /tmp/unstable.headers -o /tmp/unstable.html -w '%{http_code}' "$UNSTABLE_URL/")"
          LOGIN="$(curl -sS -o /tmp/unstable-login.html -w '%{http_code}' "$UNSTABLE_URL/login")"
          START="$(curl -sS -o /tmp/unstable-start.html -w '%{http_code}' "$UNSTABLE_URL/start")"
          ME="$(curl -sS -o /tmp/unstable-me.json -w '%{http_code}' "$UNSTABLE_URL/api/organization/me")"
          [[ "$ROOT" -ge 200 && "$ROOT" -lt 400 ]]
          [[ "$LOGIN" -ge 200 && "$LOGIN" -lt 400 ]]
          [[ "$START" -ge 200 && "$START" -lt 400 ]]
          [[ "$ME" == '401' ]]
          grep -qi '^x-flyer-release-channel: unstable' /tmp/unstable.headers
          UNSTABLE_RUNTIME="$(curl --fail --silent --show-error "$UNSTABLE_URL/api/runtime")"
          jq -e --arg sha "$GITHUB_SHA" '.ok == true and .environment == "unstable" and .sourceCommit == $sha' <<<"$UNSTABLE_RUNTIME" >/dev/null
          STABLE_RUNTIME="$(curl --fail --silent --show-error "$STABLE_URL/api/runtime" 2>/dev/null || printf '{}')"
          jq -n \
            --arg recordedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg stableBranch main \
            --arg unstableBranch unstable \
            --arg stableUrl "$STABLE_URL" \
            --arg unstableUrl "$UNSTABLE_URL" \
            --argjson stableRuntime "$STABLE_RUNTIME" \
            --argjson unstableRuntime "$UNSTABLE_RUNTIME" \
            '{schemaVersion:1,recordedAt:$recordedAt,invariant:{stable:{sourceBranch:$stableBranch,url:$stableUrl},unstable:{sourceBranch:$unstableBranch,url:$unstableUrl}},stable:$stableRuntime,unstable:$unstableRuntime}' \
            > /tmp/release-channel-state.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-channel-state-unstable
          path: /tmp/release-channel-state.json
          retention-days: 30
          if-no-files-found: ignore
