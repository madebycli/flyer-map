name: D1 Beta Read Attribution

on:
  workflow_dispatch:
  push:
    branches: [beta]
    paths:
      - .github/workflows/d1-beta-read-attribution.yml

permissions:
  contents: read

concurrency:
  group: d1-beta-read-attribution
  cancel-in-progress: false

jobs:
  attribute:
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONFIGURED_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BETA_DB_NAME: flyer-map-beta-db
      BETA_URL: https://flyer-map-beta.cloudflare-eleven035.workers.dev
      PROD_D1_ID: 0113e775-1e43-4d96-8b97-51fdeec7355b
      RXDB_STAGING_D1_ID: bcec3432-18ec-42a2-970a-64d52c8263d5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned CLI
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Resolve exact isolated Beta D1
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          ACCOUNTS_JSON="$(curl --fail-with-body --silent --show-error 'https://api.cloudflare.com/client/v4/accounts?per_page=50' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')"
          [[ "$(jq -r '.success' <<<"$ACCOUNTS_JSON")" == 'true' ]]
          if [[ -n "${CONFIGURED_CLOUDFLARE_ACCOUNT_ID:-}" ]] && jq -e --arg id "$CONFIGURED_CLOUDFLARE_ACCOUNT_ID" '.result[]|select(.id==$id)' <<<"$ACCOUNTS_JSON" >/dev/null; then
            ACCOUNT_ID="$CONFIGURED_CLOUDFLARE_ACCOUNT_ID"
          elif [[ "$(jq '.result|length' <<<"$ACCOUNTS_JSON")" == '1' ]]; then
            ACCOUNT_ID="$(jq -r '.result[0].id' <<<"$ACCOUNTS_JSON")"
          else
            echo 'Cloudflare account is ambiguous.' >&2
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          LIST_JSON="$(npx wrangler d1 list --json)"
          BETA_D1_ID="$(jq -r --arg name "$BETA_DB_NAME" '[.[]|select(.name==$name)]|if length==1 then .[0].uuid else empty end' <<<"$LIST_JSON")"
          [[ -n "$BETA_D1_ID" ]] || { echo 'Dedicated Beta D1 missing or ambiguous.' >&2; exit 1; }
          [[ "$BETA_D1_ID" != "$PROD_D1_ID" ]]
          [[ "$BETA_D1_ID" != "$RXDB_STAGING_D1_ID" ]]
          echo "BETA_D1_ID=$BETA_D1_ID" >> "$GITHUB_ENV"
          echo "Resolved isolated Beta D1: ${BETA_DB_NAME} (${BETA_D1_ID})"

      - name: Wait for exact Beta source commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            RUNTIME="$(curl --silent --show-error --retry 2 --retry-all-errors "${BETA_URL}/api/runtime?d1-audit=${GITHUB_SHA}-${attempt}" || true)"
            if jq -e --arg sha "$GITHUB_SHA" '.ok == true and .environment == "unstable" and .sourceCommit == $sha' <<<"$RUNTIME" >/dev/null 2>&1; then
              echo 'Exact Beta source commit is live.'
              exit 0
            fi
            sleep 2
          done
          echo "Expected Beta commit did not become live: ${GITHUB_SHA}" >&2
          exit 1

      - name: Materialize one-shot remote StreetEngine audit Worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .d1-audit /tmp/d1-attribution
          AUDIT_WORKER_NAME="flyer-map-beta-d1-audit-${GITHUB_RUN_ID}"
          AUDIT_PATH="$(node -e "console.log(require('node:crypto').randomBytes(24).toString('hex'))")"
          CAMPAIGN_ID="campaign_d1_audit_${GITHUB_RUN_ID}"
          TEAM_ID="team_d1_audit_${GITHUB_RUN_ID}"
          AREA_ID="area_d1_audit_${GITHUB_RUN_ID}"
          {
            echo "AUDIT_WORKER_NAME=$AUDIT_WORKER_NAME"
            echo "AUDIT_PATH=$AUDIT_PATH"
            echo "AUDIT_CAMPAIGN_ID=$CAMPAIGN_ID"
            echo "AUDIT_TEAM_ID=$TEAM_ID"
            echo "AUDIT_AREA_ID=$AREA_ID"
          } >> "$GITHUB_ENV"

          cat > .d1-audit/index.ts <<'TS'
          import { prepareAreaTasks } from '../worker/areaTaskPreparation.ts';

          const AUDIT_PATH='__AUDIT_PATH__';
          const CAMPAIGN_ID='__CAMPAIGN_ID__';
          const TEAM_ID='__TEAM_ID__';
          const AREA_ID='__AREA_ID__';
          const json=(value:unknown,status=200)=>new Response(JSON.stringify(value),{status,headers:{'content-type':'application/json'}});
          const normalize=(query:string)=>query.replace(/\s+/g,' ').trim();
          type QueryMetric={executions:number;rowsRead:number;rowsWritten:number;durationMs:number};
          type Metrics={queryCount:number;batchCount:number;queries:Record<string,QueryMetric>};
          const numberMeta=(meta:any,snake:string,camel:string)=>Number(meta?.[snake]??meta?.[camel]??0)||0;
          const ensure=(metrics:Metrics,query:string)=>metrics.queries[normalize(query)]??=( {executions:0,rowsRead:0,rowsWritten:0,durationMs:0} );
          const execute=(metrics:Metrics,query:string)=>{metrics.queryCount++;ensure(metrics,query).executions++;};
          const meta=(metrics:Metrics,query:string,result:any)=>{
            const row=ensure(metrics,query),m=result?.meta;
            row.rowsRead+=numberMeta(m,'rows_read','rowsRead');
            row.rowsWritten+=numberMeta(m,'rows_written','rowsWritten');
            row.durationMs+=numberMeta(m,'duration','durationMs');
          };
          class AuditStatement {
            inner:any;
            constructor(inner:any,readonly query:string,readonly metrics:Metrics){this.inner=inner;}
            bind(...values:unknown[]){this.inner=this.inner.bind(...values);return this;}
            async first<T>(){execute(this.metrics,this.query);return this.inner.first<T>();}
            async all<T>(){execute(this.metrics,this.query);const result=await this.inner.all<T>();meta(this.metrics,this.query,result);return result;}
          }
          class AuditDb {
            constructor(readonly inner:any,readonly metrics:Metrics){}
            prepare(query:string){return new AuditStatement(this.inner.prepare(query),query,this.metrics);}
            async batch(statements:AuditStatement[]){
              this.metrics.batchCount++;
              for(const statement of statements)execute(this.metrics,statement.query);
              const results=await this.inner.batch(statements.map(statement=>statement.inner));
              results.forEach((result:any,index:number)=>meta(this.metrics,statements[index].query,result));
              return results;
            }
          }

          const roads=Array.from({length:20},(_,index)=>({
            type:'way',id:10+index,tags:{highway:'residential',name:`Auditstraße ${index}`},
            geometry:[{lon:13.0002+index*0.00047,lat:51.0002},{lon:13.0002+index*0.00047,lat:51.0098}],
          }));
          const buildings=Array.from({length:260},(_,index)=>{
            const x=13.00025+(index%20)*0.00047;
            const y=51.00025+Math.floor(index/20)*0.00065;
            return {
              type:'way',id:1000+index,
              tags:{building:'house','addr:housenumber':String(index+1)},
              geometry:[{lon:x,lat:y},{lon:x+0.00003,lat:y},{lon:x+0.00003,lat:y+0.00003},{lon:x,lat:y}],
            };
          });
          const osmFetch=async(_url:unknown,init?:RequestInit)=>new Response(JSON.stringify({
            osm3s:{timestamp_osm_base:'2026-09-15T00:00:00Z'},
            elements:String(init?.body??'').includes('highway')?roads:buildings,
          }),{headers:{'content-type':'application/json'}});

          export default {
            async fetch(request:Request,env:{DB:any}){
              const url=new URL(request.url);
              if(!url.pathname.startsWith(`/${AUDIT_PATH}/`))return new Response('not found',{status:404});
              const action=url.pathname.slice(AUDIT_PATH.length+2);
              const now=new Date().toISOString();
              if(action==='seed'&&request.method==='POST'){
                const geometry={type:'Polygon',coordinates:[[[13,51],[13.01,51],[13.01,51.01],[13,51.01],[13,51]]]};
                await env.DB.batch([
                  env.DB.prepare("INSERT INTO campaigns(id,name,status,revision,write_token,created_at,updated_at) VALUES(?,?,'active',1,?,?,?)").bind(CAMPAIGN_ID,'D1 Audit','audit',now,now),
                  env.DB.prepare('INSERT INTO teams(id,campaign_id,name,color,created_at,updated_at) VALUES(?,?,?,?,?,?)').bind(TEAM_ID,CAMPAIGN_ID,'Audit Team','#2563eb',now,now),
                  env.DB.prepare('INSERT INTO areas(id,campaign_id,team_id,name,geometry_json,created_at,updated_at) VALUES(?,?,?,?,?,?,?)').bind(AREA_ID,CAMPAIGN_ID,TEAM_ID,'Audit Area',JSON.stringify(geometry),now,now),
                ]);
                return json({ok:true,campaignId:CAMPAIGN_ID,areaId:AREA_ID});
              }
              if(action==='run'&&request.method==='POST'){
                const metrics:Metrics={queryCount:0,batchCount:0,queries:{}};
                const started=performance.now();
                const result=await prepareAreaTasks(new AuditDb(env.DB,metrics) as any,CAMPAIGN_ID,AREA_ID,{fetchImpl:osmFetch as any});
                return json({ok:true,result,durationMs:performance.now()-started,metrics,fixture:{roads:roads.length,houses:buildings.length,addressed:false}});
              }
              if(action==='cleanup'&&request.method==='POST'){
                try{await env.DB.prepare('DELETE FROM campaigns WHERE id=?').bind(CAMPAIGN_ID).run();return json({ok:true});}
                catch(error){return json({ok:false,error:error instanceof Error?error.message:String(error)},500);}
              }
              return new Response('not found',{status:404});
            },
          };
          TS
          sed -i "s/__AUDIT_PATH__/${AUDIT_PATH}/g; s/__CAMPAIGN_ID__/${CAMPAIGN_ID}/g; s/__TEAM_ID__/${TEAM_ID}/g; s/__AREA_ID__/${AREA_ID}/g" .d1-audit/index.ts
          cat > .d1-audit/wrangler.jsonc <<JSON
          {
            "name":"${AUDIT_WORKER_NAME}",
            "main":"index.ts",
            "compatibility_date":"2026-09-01",
            "compatibility_flags":["nodejs_compat"],
            "workers_dev":true,
            "d1_databases":[{"binding":"DB","database_name":"${BETA_DB_NAME}","database_id":"${BETA_D1_ID}"}]
          }
          JSON

      - name: Deploy audit Worker and seed controlled fixture
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config .d1-audit/wrangler.jsonc 2>&1 | tee /tmp/d1-attribution/audit-worker-deploy.log
          AUDIT_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/d1-attribution/audit-worker-deploy.log | tail -n1)"
          [[ -n "$AUDIT_URL" ]]
          echo "AUDIT_URL=$AUDIT_URL" >> "$GITHUB_ENV"
          READY=0
          for attempt in $(seq 1 30); do
            STATUS="$(curl --silent --show-error -o /tmp/d1-attribution/seed.json -w '%{http_code}' -X POST "${AUDIT_URL}/${AUDIT_PATH}/seed" || true)"
            if [[ "$STATUS" == '200' ]] && jq -e '.ok == true' /tmp/d1-attribution/seed.json >/dev/null 2>&1; then READY=1; break; fi
            sleep 2
          done
          cat /tmp/d1-attribution/seed.json
          [[ "$READY" == '1' ]] || { echo 'Audit Worker did not become ready.' >&2; exit 1; }
          sleep 30

      - name: Capture pre-workload D1 Insights
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 insights "$BETA_DB_NAME" --time-period 1d --sort-type sum --sort-by reads --sort-direction DESC --limit 100 --json > /tmp/d1-attribution/baseline-reads.json
          npx wrangler d1 insights "$BETA_DB_NAME" --time-period 1d --sort-type sum --sort-by count --sort-direction DESC --limit 100 --json > /tmp/d1-attribution/baseline-count.json

      - name: Run exactly one remote StreetEngine preparation
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST "${AUDIT_URL}/${AUDIT_PATH}/run" -o /tmp/d1-attribution/workload.json
          cat /tmp/d1-attribution/workload.json
          jq -e '.ok == true and .result.outcome == "ready" and .result.roadCount >= 1 and .result.houseCount == 260 and .metrics.queryCount > 0' /tmp/d1-attribution/workload.json >/dev/null

      - name: Wait for D1 Insights and calculate workload-only delta
        shell: bash
        run: |
          set -euo pipefail
          capture_after() {
            npx wrangler d1 insights "$BETA_DB_NAME" --time-period 1d --sort-type sum --sort-by reads --sort-direction DESC --limit 100 --json > /tmp/d1-attribution/after-reads.json
            npx wrangler d1 insights "$BETA_DB_NAME" --time-period 1d --sort-type sum --sort-by count --sort-direction DESC --limit 100 --json > /tmp/d1-attribution/after-count.json
          }
          matching_execs() {
            node <<'NODE'
          const fs=require('fs');
          const norm=q=>String(q??'').replace(/\s+/g,' ').trim();
          const workload=JSON.parse(fs.readFileSync('/tmp/d1-attribution/workload.json','utf8'));
          const wanted=new Set(Object.keys(workload.metrics.queries).map(norm));
          const load=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const merge=(a,b)=>{const m=new Map();for(const r of [...a,...b]){const q=norm(r.query),old=m.get(q);if(!old||Number(r.numberOfTimesRun||0)>Number(old.numberOfTimesRun||0))m.set(q,r);}return m;};
          const base=merge(load('/tmp/d1-attribution/baseline-reads.json'),load('/tmp/d1-attribution/baseline-count.json'));
          const after=merge(load('/tmp/d1-attribution/after-reads.json'),load('/tmp/d1-attribution/after-count.json'));
          let total=0;for(const q of wanted)total+=Math.max(0,Number(after.get(q)?.numberOfTimesRun||0)-Number(base.get(q)?.numberOfTimesRun||0));
          console.log(total);
          NODE
          }
          EXPECTED="$(jq -r '.metrics.queryCount' /tmp/d1-attribution/workload.json)"
          COMPLETE=0
          for attempt in $(seq 1 36); do
            sleep 10
            capture_after
            OBSERVED="$(matching_execs)"
            echo "D1 Insights propagation: observed=${OBSERVED}, expected=${EXPECTED}"
            if [[ "$OBSERVED" -ge "$EXPECTED" ]]; then COMPLETE=1; break; fi
          done
          [[ "$COMPLETE" == '1' ]] || { echo 'D1 Insights did not expose the complete controlled workload in time.' >&2; exit 1; }

          node <<'NODE'
          const fs=require('fs');
          const norm=q=>String(q??'').replace(/\s+/g,' ').trim();
          const num=v=>Number(v)||0;
          const workload=JSON.parse(fs.readFileSync('/tmp/d1-attribution/workload.json','utf8'));
          const wanted=new Set(Object.keys(workload.metrics.queries).map(norm));
          const load=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const merge=(a,b)=>{const m=new Map();for(const r of [...a,...b]){const q=norm(r.query),old=m.get(q);if(!old||num(r.numberOfTimesRun)>num(old.numberOfTimesRun))m.set(q,r);}return m;};
          const base=merge(load('/tmp/d1-attribution/baseline-reads.json'),load('/tmp/d1-attribution/baseline-count.json'));
          const after=merge(load('/tmp/d1-attribution/after-reads.json'),load('/tmp/d1-attribution/after-count.json'));
          const rows=[];
          for(const q of wanted){
            const b=base.get(q)||{},a=after.get(q)||{};
            const direct=workload.metrics.queries[q]||{executions:0,rowsRead:0,rowsWritten:0,durationMs:0};
            rows.push({query:q,executions:Math.max(0,num(a.numberOfTimesRun)-num(b.numberOfTimesRun)),rowsRead:Math.max(0,num(a.totalRowsRead)-num(b.totalRowsRead)),rowsWritten:Math.max(0,num(a.totalRowsWritten)-num(b.totalRowsWritten)),durationMs:Math.max(0,num(a.totalDurationMs)-num(b.totalDurationMs)),returnedMeta:direct});
          }
          rows.sort((l,r)=>r.rowsRead-l.rowsRead||r.executions-l.executions);
          const fullEdge=rows.filter(row=>/kind\s*=\s*\?/i.test(row.query)&&/street_network_staging/i.test(row.query)&&/ORDER BY chunk_key/i.test(row.query));
          const report={
            capturedAt:new Date().toISOString(),sourceCommitSha:process.env.GITHUB_SHA,betaDbName:process.env.BETA_DB_NAME,betaD1Id:process.env.BETA_D1_ID,
            fixture:workload.fixture,result:workload.result,workerDurationMs:workload.durationMs,queryCount:workload.metrics.queryCount,batchCount:workload.metrics.batchCount,
            d1:{rowsRead:rows.reduce((n,r)=>n+r.rowsRead,0),rowsWritten:rows.reduce((n,r)=>n+r.rowsWritten,0),queryExecutions:rows.reduce((n,r)=>n+r.executions,0),durationMs:rows.reduce((n,r)=>n+r.durationMs,0)},
            topQueries:rows.slice(0,40),fullStagingReadCandidates:fullEdge,
            attributionComplete:rows.reduce((n,r)=>n+r.executions,0)>=workload.metrics.queryCount,
          };
          fs.writeFileSync('/tmp/d1-attribution/report.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          NODE
          jq -e '.attributionComplete == true' /tmp/d1-attribution/report.json >/dev/null

      - name: Cleanup fixture and one-shot Worker
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${AUDIT_URL:-}" && -n "${AUDIT_PATH:-}" ]]; then
            curl --silent --show-error -X POST "${AUDIT_URL}/${AUDIT_PATH}/cleanup" > /tmp/d1-attribution/cleanup.json
          fi
          if [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" && -n "${AUDIT_WORKER_NAME:-}" ]]; then
            curl --silent --show-error -X DELETE "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${AUDIT_WORKER_NAME}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' > /tmp/d1-attribution/delete-worker.json
          fi
          rm -rf .d1-audit
          true

      - name: Upload sanitized attribution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-beta-read-attribution
          path: |
            /tmp/d1-attribution/report.json
            /tmp/d1-attribution/workload.json
            /tmp/d1-attribution/baseline-reads.json
            /tmp/d1-attribution/baseline-count.json
            /tmp/d1-attribution/after-reads.json
            /tmp/d1-attribution/after-count.json
            /tmp/d1-attribution/cleanup.json
            /tmp/d1-attribution/delete-worker.json
          retention-days: 7
          if-no-files-found: ignore

# Temporary controlled rerun marker; removed after the post-fix attribution evidence is captured.
