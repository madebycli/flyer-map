name: D1 Beta Read Attribution

on:
  workflow_dispatch:
  push:
    branches: [unstable]
    paths:
      - .github/workflows/d1-beta-read-attribution.yml

permissions:
  contents: read

jobs:
  attribute:
    if: github.ref == 'refs/heads/unstable'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONFIGURED_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BETA_D1_ID: ac788637-4deb-4574-b5b6-8183770a1c01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned CLI
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Resolve exact Beta D1
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          ACCOUNTS_JSON="$(curl --fail-with-body --silent --show-error 'https://api.cloudflare.com/client/v4/accounts?per_page=50' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')"
          [[ "$(jq -r '.success' <<<"$ACCOUNTS_JSON")" == 'true' ]]
          if [[ -n "${CONFIGURED_CLOUDFLARE_ACCOUNT_ID:-}" ]] && jq -e --arg id "$CONFIGURED_CLOUDFLARE_ACCOUNT_ID" '.result[]|select(.id==$id)' <<<"$ACCOUNTS_JSON" >/dev/null; then
            echo "CLOUDFLARE_ACCOUNT_ID=$CONFIGURED_CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
          elif [[ "$(jq '.result|length' <<<"$ACCOUNTS_JSON")" == '1' ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$(jq -r '.result[0].id' <<<"$ACCOUNTS_JSON")" >> "$GITHUB_ENV"
          else
            echo 'Cloudflare account is ambiguous.' >&2
            exit 1
          fi
          LIST_JSON="$(npx wrangler d1 list --json)"
          BETA_DB_NAME="$(jq -r --arg id "$BETA_D1_ID" '[.[]|select(.uuid==$id)]|if length==1 then .[0].name else empty end' <<<"$LIST_JSON")"
          [[ -n "$BETA_DB_NAME" ]] || { echo 'Exact Beta D1 missing or ambiguous.' >&2; exit 1; }
          echo "BETA_DB_NAME=$BETA_DB_NAME" >> "$GITHUB_ENV"
      - name: Capture real Cloudflare D1 query attribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/d1-attribution
          npx wrangler d1 insights "$BETA_DB_NAME" --time-period 1d --sort-type sum --sort-by reads --sort-direction DESC --limit 50 --json > /tmp/d1-attribution/by-reads.json
          npx wrangler d1 insights "$BETA_DB_NAME" --time-period 1d --sort-type sum --sort-by count --sort-direction DESC --limit 50 --json > /tmp/d1-attribution/by-count.json
          node <<'NODE'
          const fs = require('fs');
          const reads = JSON.parse(fs.readFileSync('/tmp/d1-attribution/by-reads.json','utf8'));
          const count = JSON.parse(fs.readFileSync('/tmp/d1-attribution/by-count.json','utf8'));
          const sanitize = rows => rows.map((row, index) => ({
            rank: index + 1,
            query: row.query,
            avgRowsRead: row.avgRowsRead,
            totalRowsRead: row.totalRowsRead,
            avgRowsWritten: row.avgRowsWritten,
            totalRowsWritten: row.totalRowsWritten,
            avgDurationMs: row.avgDurationMs,
            totalDurationMs: row.totalDurationMs,
            numberOfTimesRun: row.numberOfTimesRun,
            queryEfficiency: row.queryEfficiency,
          }));
          const out = {
            capturedAt: new Date().toISOString(),
            betaD1Id: process.env.BETA_D1_ID,
            sourceCommitSha: process.env.GITHUB_SHA,
            window: '1d',
            byRowsRead: sanitize(reads),
            byExecutionCount: sanitize(count),
          };
          fs.writeFileSync('/tmp/d1-attribution/report.json', JSON.stringify(out, null, 2));
          console.log(JSON.stringify(out, null, 2));
          NODE
      - name: Upload sanitized attribution evidence
        uses: actions/upload-artifact@v4
        with:
          name: d1-beta-read-attribution
          path: /tmp/d1-attribution/report.json
          retention-days: 7
