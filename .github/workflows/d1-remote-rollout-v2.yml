name: D1 Remote Rollout v2

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type exactly: APPLY 0004-0014"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/d1-remote-rollout-v2.yml"

permissions:
  contents: read

concurrency:
  group: d1-production-rollout
  cancel-in-progress: false

jobs:
  rollout:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-d1-rollout-v2]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE: flyer-map-db
      D1_DATABASE_ID: 0113e775-1e43-4d96-8b97-51fdeec7355b
      TARGET_REF: plan-feature-complete-platform
      EXPECTED_SHA: 129bc30cc408cfb2fd840390faaa6e37c5164148
      CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || 'APPLY 0004-0014' }}

    steps:
      - name: Confirm rollout intent
        shell: bash
        run: |
          set -euo pipefail
          test "${CONFIRMATION}" = "APPLY 0004-0014"
          if [ "${{ github.event_name }}" = "push" ]; then
            case "${{ github.event.head_commit.message }}" in
              *"[run-d1-rollout-v2]"*) ;;
              *) exit 1 ;;
            esac
          fi

      - name: Checkout approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 1

      - name: Lock exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Source SHA: ${ACTUAL_SHA}"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"

      - name: Verify approved migration files
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const expected=['0001_initial.sql','0002_m4_access.sql','0003_m5_mutations.sql','0004_m6_task_source_provenance.sql','0005_m6_house_tasks.sql','0006_fc1_field_groups.sql','0007_field_sessions_events.sql','0008_comments.sql','0009_automations.sql','0010_fc5_collection_access_areas_runs.sql','0011_fc5_collection_pickups.sql','0012_fc5_collection_pickup_visibility.sql','0013_fc5_pickup_comments.sql','0014_auto_area_task_preparation.sql'];
          const actual=fs.readdirSync('migrations').filter(n=>/^\d{4}.*\.sql$/.test(n)).sort();
          if(JSON.stringify(actual)!==JSON.stringify(expected)){console.error(actual);process.exit(1)}
          console.log('Migration set verified.');
          NODE

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Cloudflare target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .rollout
          npx wrangler --version
          npx wrangler d1 info "${D1_DATABASE}" | tee .rollout/d1-info.txt
          grep -Fq "${D1_DATABASE_ID}" .rollout/d1-info.txt

      - name: Verify exact remote pre-state
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list "${D1_DATABASE}" --remote
          npx wrangler d1 execute "${D1_DATABASE}" --remote --json --command "SELECT name FROM d1_migrations ORDER BY name;" > .rollout/applied-before.json
          node <<'NODE'
          const fs=require('fs'); const x=JSON.parse(fs.readFileSync('.rollout/applied-before.json','utf8'));
          const rows=(Array.isArray(x)?x:[x]).flatMap(v=>Array.isArray(v.results)?v.results:[]);
          const actual=rows.map(r=>r.name); const expected=['0001_initial.sql','0002_m4_access.sql','0003_m5_mutations.sql'];
          if(JSON.stringify(actual)!==JSON.stringify(expected)){console.error('Unexpected remote migration state',actual);process.exit(1)}
          console.log('Remote pre-state verified.');
          NODE

      - name: Capture Time Travel bookmark
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 time-travel info "${D1_DATABASE}" --json | tee .rollout/time-travel-before.json >/dev/null
          test -s .rollout/time-travel-before.json
          echo "Time Travel bookmark captured."

      - name: Export remote database before rollout
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 export "${D1_DATABASE}" --remote --output=.rollout/before.sql --skip-confirmation
          test -s .rollout/before.sql
          echo "Pre-rollout export bytes: $(wc -c < .rollout/before.sql)"

      - name: Capture clean FK baseline
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "${D1_DATABASE}" --remote --json --command "PRAGMA foreign_key_check;" > .rollout/fk-before.json
          node <<'NODE'
          const fs=require('fs'); const x=JSON.parse(fs.readFileSync('.rollout/fk-before.json','utf8'));
          const rows=(Array.isArray(x)?x:[x]).flatMap(v=>Array.isArray(v.results)?v.results:[]);
          if(rows.length){console.error('FK violations before rollout',rows);process.exit(1)}
          console.log('Baseline FK clean.');
          NODE

      - name: Capture baseline counts
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "${D1_DATABASE}" --remote --json --command "SELECT 'campaigns' AS table_name,COUNT(*) AS row_count FROM campaigns UNION ALL SELECT 'teams',COUNT(*) FROM teams UNION ALL SELECT 'areas',COUNT(*) FROM areas UNION ALL SELECT 'tasks',COUNT(*) FROM tasks UNION ALL SELECT 'campaign_access_grants',COUNT(*) FROM campaign_access_grants UNION ALL SELECT 'campaign_sessions',COUNT(*) FROM campaign_sessions UNION ALL SELECT 'campaign_mutations',COUNT(*) FROM campaign_mutations;" > .rollout/counts-before.json
          node -e "JSON.parse(require('fs').readFileSync('.rollout/counts-before.json','utf8')); console.log('Baseline counts captured.')"

      - name: APPLY remote migrations 0004-0014
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply "${D1_DATABASE}" --remote | tee .rollout/migrations-apply.txt

      - name: Verify remote registry through 0014
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "${D1_DATABASE}" --remote --json --command "SELECT name FROM d1_migrations ORDER BY name;" > .rollout/applied-after.json
          node <<'NODE'
          const fs=require('fs'); const x=JSON.parse(fs.readFileSync('.rollout/applied-after.json','utf8'));
          const rows=(Array.isArray(x)?x:[x]).flatMap(v=>Array.isArray(v.results)?v.results:[]);
          const actual=rows.map(r=>r.name); const expected=['0001_initial.sql','0002_m4_access.sql','0003_m5_mutations.sql','0004_m6_task_source_provenance.sql','0005_m6_house_tasks.sql','0006_fc1_field_groups.sql','0007_field_sessions_events.sql','0008_comments.sql','0009_automations.sql','0010_fc5_collection_access_areas_runs.sql','0011_fc5_collection_pickups.sql','0012_fc5_collection_pickup_visibility.sql','0013_fc5_pickup_comments.sql','0014_auto_area_task_preparation.sql'];
          if(JSON.stringify(actual)!==JSON.stringify(expected)){console.error('Registry mismatch',actual);process.exit(1)}
          console.log('Registry verified through 0014.');
          NODE

      - name: Verify FK and baseline counts preserved
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "${D1_DATABASE}" --remote --json --command "PRAGMA foreign_key_check;" > .rollout/fk-after.json
          npx wrangler d1 execute "${D1_DATABASE}" --remote --json --command "SELECT 'campaigns' AS table_name,COUNT(*) AS row_count FROM campaigns UNION ALL SELECT 'teams',COUNT(*) FROM teams UNION ALL SELECT 'areas',COUNT(*) FROM areas UNION ALL SELECT 'tasks',COUNT(*) FROM tasks UNION ALL SELECT 'campaign_access_grants',COUNT(*) FROM campaign_access_grants UNION ALL SELECT 'campaign_sessions',COUNT(*) FROM campaign_sessions UNION ALL SELECT 'campaign_mutations',COUNT(*) FROM campaign_mutations;" > .rollout/counts-after.json
          node <<'NODE'
          const fs=require('fs'); const rows=p=>{const x=JSON.parse(fs.readFileSync(p,'utf8'));return(Array.isArray(x)?x:[x]).flatMap(v=>Array.isArray(v.results)?v.results:[])};
          if(rows('.rollout/fk-after.json').length){console.error('FK violations after rollout');process.exit(1)}
          const before=Object.fromEntries(rows('.rollout/counts-before.json').map(r=>[r.table_name,Number(r.row_count)]));
          const after=Object.fromEntries(rows('.rollout/counts-after.json').map(r=>[r.table_name,Number(r.row_count)]));
          if(JSON.stringify(before)!==JSON.stringify(after)){console.error('Baseline counts changed',{before,after});process.exit(1)}
          console.log('FK clean and baseline counts preserved.');
          NODE

      - name: Verify critical migrated schema
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "${D1_DATABASE}" --remote --json --command "SELECT type,name FROM sqlite_master WHERE (type='trigger' AND name IN ('trg_field_group_close_history','trg_field_group_expiry_history')) OR (type='table' AND name IN ('comments','domain_events','automation_rules','collection_pickups','area_task_preparations','house_tasks')) ORDER BY type,name;" > .rollout/schema.json
          npx wrangler d1 execute "${D1_DATABASE}" --remote --json --command "SELECT 'tasks' AS table_name,name AS column_name FROM pragma_table_info('tasks') WHERE name IN ('source_json','area_preparation_generation') UNION ALL SELECT 'house_tasks',name FROM pragma_table_info('house_tasks') WHERE name='area_preparation_generation';" > .rollout/columns.json
          node <<'NODE'
          const fs=require('fs'); const rows=p=>{const x=JSON.parse(fs.readFileSync(p,'utf8'));return(Array.isArray(x)?x:[x]).flatMap(v=>Array.isArray(v.results)?v.results:[])};
          const names=new Set(rows('.rollout/schema.json').map(r=>r.name));
          for(const n of ['trg_field_group_close_history','trg_field_group_expiry_history','comments','domain_events','automation_rules','collection_pickups','area_task_preparations','house_tasks']) if(!names.has(n)){console.error('Missing',n);process.exit(1)}
          const cols=new Set(rows('.rollout/columns.json').map(r=>`${r.table_name}.${r.column_name}`));
          for(const n of ['tasks.source_json','tasks.area_preparation_generation','house_tasks.area_preparation_generation']) if(!cols.has(n)){console.error('Missing',n);process.exit(1)}
          console.log('Critical schema verified.');
          NODE

      - name: Verify preview alias matches versioned build
        shell: bash
        run: |
          set -euo pipefail
          V="https://56f131d5-flyer-map.cloudflare-eleven035.workers.dev"
          A="https://plan-feature-complete-platform-flyer-map.cloudflare-eleven035.workers.dev"
          curl -fsSL "${V}/" -o .rollout/v.html
          curl -fsSL "${A}/" -o .rollout/a.html
          VA="$(grep -oE '/assets/[^\" ]+\.(js|css)' .rollout/v.html | sort -u)"
          AA="$(grep -oE '/assets/[^\" ]+\.(js|css)' .rollout/a.html | sort -u)"
          test "${VA}" = "${AA}"
          curl -fsSL "${V}/api/health" >/dev/null
          curl -fsSL "${A}/api/health" >/dev/null
          echo "Preview alias match: YES"

      - name: Rollout success
        shell: bash
        run: |
          echo '### D1 Remote Rollout' >> "$GITHUB_STEP_SUMMARY"
          echo '- Remote migrations 0004-0014: applied' >> "$GITHUB_STEP_SUMMARY"
          echo '- FK check: clean' >> "$GITHUB_STEP_SUMMARY"
          echo '- Baseline counts: preserved' >> "$GITHUB_STEP_SUMMARY"
          echo '- Critical schema: verified' >> "$GITHUB_STEP_SUMMARY"
          echo '- Manual Worker deploy: not performed' >> "$GITHUB_STEP_SUMMARY"
          echo '**ROLLOUT_SUCCESS: YES**' >> "$GITHUB_STEP_SUMMARY"
