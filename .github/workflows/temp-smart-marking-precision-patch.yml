name: Temporary Smart Marking precision patch

on:
  push:
    branches:
      - fix/smart-marking-precision-points-2026-09-16

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/smart-marking-precision-points-2026-09-16
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python scripts/apply-smart-marking-precision-patch.py
      - name: Commit patched product code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/map/MapView.tsx src/map/useNetworkWorkspace.tsx tests/smartStreetRuntime.test.ts
          git diff --cached --check
          git commit -m "Fix Smart Marking precision and visible vertices"
          git push origin HEAD:fix/smart-marking-precision-points-2026-09-16
