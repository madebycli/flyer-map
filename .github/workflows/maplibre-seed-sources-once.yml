name: MapLibre Seed Sources Once

on:
  push:
    branches:
      - fix/street-engine-smart-marking
    paths:
      - .github/workflows/maplibre-seed-sources-once.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Replace initial setData hydration with source seeding
        run: python3 scripts/maplibre_seed_sources_once.py
      - name: Verify candidate
        id: verify
        shell: bash
        run: |
          set +e
          npm ci --no-audit --no-fund 2>&1 | tee /tmp/maplibre-seed-check.log
          install_status=${PIPESTATUS[0]}
          if [[ "$install_status" -ne 0 ]]; then
            exit "$install_status"
          fi
          npm run check 2>&1 | tee -a /tmp/maplibre-seed-check.log
          exit ${PIPESTATUS[0]}
      - name: Upload failed check output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maplibre-seed-check-failure
          path: /tmp/maplibre-seed-check.log
          retention-days: 2
      - name: Commit verified source-seeding fix
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/map/MapView.tsx src/main.tsx tests/mapRendererLifecycleCompat.test.ts tests/houseRenderer.test.ts src/map/maplibreGeoJsonLifecycleCompat.ts
          git commit -m 'fix: seed application GeoJSON at source creation'
          git push origin HEAD:fix/street-engine-smart-marking

# Retry after updating the House renderer regression to require seeded initial data.
