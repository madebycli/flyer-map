name: D1 Beta Attribution Rerun Trigger

on:
  push:
    branches: [beta]
    paths:
      - .github/workflows/d1-beta-rerun-trigger.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch existing controlled D1 attribution workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run d1-beta-read-attribution.yml --ref beta
