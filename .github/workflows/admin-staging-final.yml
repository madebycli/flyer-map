name: Organizer Admin Staging Final

on:
  push:
    branches:
      - organizer-admin-staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: organizer-admin-staging-final-v2
  cancel-in-progress: false

jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONFIGURED_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_DB_NAME: flyer-map-admin-staging-db
      ADMIN_WORKER_NAME: flyer-map-admin-staging
      PROD_D1_ID: 0113e775-1e43-4d96-8b97-51fdeec7355b
      RXDB_STAGING_D1_ID: bcec3432-18ec-42a2-970a-64d52c8263d5
      AUDITED_BASE_SHA: f8f00b2b49dd554d037fac23231d25037f72d58d
      FINAL_BOOTSTRAP_SECRET_SHA256: 330d968a1282453edd0427601226526df39f7ff8a3b3ea6566466a0f40017e1d
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify dependency audit provenance
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${AUDITED_BASE_SHA}^{commit}"
          if ! git diff --quiet "$AUDITED_BASE_SHA" -- package.json package-lock.json; then
            echo "Dependency manifests changed since the last green high-severity audit; refusing inherited audit provenance." >&2
            git diff -- "$AUDITED_BASE_SHA" -- package.json package-lock.json >&2
            exit 1
          fi
          echo "Dependency manifests exactly match audited commit ${AUDITED_BASE_SHA}."
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Resolve Cloudflare account and isolated D1
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNTS_JSON="$(curl --fail-with-body --silent --show-error 'https://api.cloudflare.com/client/v4/accounts?per_page=50' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')"
          [[ "$(printf '%s' "$ACCOUNTS_JSON" | jq -r '.success')" == "true" ]] || exit 1
          ACCOUNT_COUNT="$(printf '%s' "$ACCOUNTS_JSON" | jq '.result | length')"
          if [[ -n "${CONFIGURED_CLOUDFLARE_ACCOUNT_ID:-}" ]] && printf '%s' "$ACCOUNTS_JSON" | jq -e --arg id "$CONFIGURED_CLOUDFLARE_ACCOUNT_ID" '.result[] | select(.id == $id)' >/dev/null; then
            CLOUDFLARE_ACCOUNT_ID="$CONFIGURED_CLOUDFLARE_ACCOUNT_ID"
          elif [[ "$ACCOUNT_COUNT" == "1" ]]; then
            CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$ACCOUNTS_JSON" | jq -r '.result[0].id')"
          else
            echo "Cloudflare account ambiguous; refusing to guess." >&2
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
          LIST_JSON="$(npx wrangler d1 list --json)"
          ADMIN_D1_ID="$(printf '%s' "$LIST_JSON" | jq -r --arg name "$ADMIN_DB_NAME" '[.[] | select(.name == $name)] | if length == 1 then .[0].uuid else empty end')"
          [[ -n "$ADMIN_D1_ID" ]] || { echo "Isolated admin D1 not uniquely resolvable." >&2; exit 1; }
          [[ "$ADMIN_D1_ID" != "$PROD_D1_ID" && "$ADMIN_D1_ID" != "$RXDB_STAGING_D1_ID" ]] || { echo "Admin D1 collides with protected D1." >&2; exit 1; }
          echo "ADMIN_D1_ID=$ADMIN_D1_ID" >> "$GITHUB_ENV"
          echo "database_id=$ADMIN_D1_ID" >> "$GITHUB_OUTPUT"
      - name: Apply isolated migrations
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const c = JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          const prod = (c.d1_databases || []).find(x => x.binding === 'DB');
          if (prod?.database_id !== process.env.PROD_D1_ID) throw new Error('Production D1 baseline changed.');
          if (c.main !== './worker/indexOrganizer.ts') throw new Error(`Unexpected Worker entrypoint ${c.main}.`);
          c.env = c.env || {};
          c.env.admin_staging = {
            name: process.env.ADMIN_WORKER_NAME,
            workers_dev: true,
            vars: { ORGANIZATION_BOOTSTRAP_SECRET_SHA256: process.env.FINAL_BOOTSTRAP_SECRET_SHA256 },
            d1_databases: [{ binding:'DB', database_name:process.env.ADMIN_DB_NAME, database_id:process.env.ADMIN_D1_ID, migrations_dir:'migrations' }],
            durable_objects: { bindings:[{ name:'CAMPAIGN_SYNC', class_name:'CampaignSyncDurableObject' }] },
            ratelimits: [
              { name:'FIELD_GROUP_JOIN_ACTOR_LIMITER', namespace_id:'91914001', simple:{limit:30,period:60} },
              { name:'FIELD_GROUP_JOIN_CREDENTIAL_LIMITER', namespace_id:'91914002', simple:{limit:8,period:60} },
              { name:'PICKUP_SEARCH_LIMITER', namespace_id:'91914003', simple:{limit:20,period:10} },
              { name:'ORGANIZATION_LOGIN_LIMITER', namespace_id:'91914004', simple:{limit:12,period:60} }
            ]
          };
          const protectedIds = new Set([...(c.ratelimits || []).map(x=>String(x.namespace_id)),'91814001','91814002','91814003']);
          for (const r of c.env.admin_staging.ratelimits) if (protectedIds.has(String(r.namespace_id))) throw new Error(`Rate-limit collision ${r.namespace_id}`);
          fs.writeFileSync('wrangler.jsonc', JSON.stringify(c,null,2)+'\n');
          NODE
          npx wrangler d1 migrations apply "$ADMIN_DB_NAME" --env admin_staging --config wrangler.jsonc --remote
      - name: Verify exact migration chain and pristine bootstrap state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/admin-final
          find migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9][0-9]_*.sql' -printf '%f\n' | sort > /tmp/admin-final/local.txt
          [[ "$(wc -l < /tmp/admin-final/local.txt | tr -d ' ')" == "19" ]] || { echo "Local migration chain is not 19 files." >&2; exit 1; }
          npx wrangler d1 execute "$ADMIN_DB_NAME" --env admin_staging --config wrangler.jsonc --remote --json --command 'SELECT id,name FROM d1_migrations ORDER BY id;' > /tmp/admin-final/ledger.json
          jq -r '.[].results[]?.name' /tmp/admin-final/ledger.json > /tmp/admin-final/remote.txt
          diff -u /tmp/admin-final/local.txt /tmp/admin-final/remote.txt
          npx wrangler d1 execute "$ADMIN_DB_NAME" --env admin_staging --config wrangler.jsonc --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('organization_accounts','organization_memberships','organization_password_resets','organization_feature_settings') ORDER BY name;" > /tmp/admin-final/tables.json
          [[ "$(jq '[.[].results[]?.name] | unique | length' /tmp/admin-final/tables.json)" == "4" ]] || exit 1
          npx wrangler d1 execute "$ADMIN_DB_NAME" --env admin_staging --config wrangler.jsonc --remote --json --command 'PRAGMA foreign_key_check;' > /tmp/admin-final/fk.json
          [[ "$(jq '[.[].results[]?] | length' /tmp/admin-final/fk.json)" == "0" ]] || exit 1
          STATE="$(npx wrangler d1 execute "$ADMIN_DB_NAME" --env admin_staging --config wrangler.jsonc --remote --json --command "SELECT (SELECT COUNT(*) FROM organization_bootstrap_state) AS bootstrap_count, (SELECT COUNT(*) FROM organizations) AS organization_count, (SELECT COUNT(*) FROM organization_accounts) AS account_count, (SELECT COUNT(*) FROM campaigns WHERE organization_id IS NOT NULL) AS owned_campaign_count;")"
          printf '%s' "$STATE" > /tmp/admin-final/pre-smoke-state.json
          [[ "$(printf '%s' "$STATE" | jq -r '.[0].results[0].bootstrap_count')" == "0" ]] || { echo "Admin staging is already bootstrapped; refusing destructive runtime smoke." >&2; exit 1; }
          [[ "$(printf '%s' "$STATE" | jq -r '.[0].results[0].organization_count')" == "0" ]] || { echo "Admin staging has organization data; refusing destructive runtime smoke." >&2; exit 1; }
          [[ "$(printf '%s' "$STATE" | jq -r '.[0].results[0].account_count')" == "0" ]] || { echo "Admin staging has account data; refusing destructive runtime smoke." >&2; exit 1; }
          [[ "$(printf '%s' "$STATE" | jq -r '.[0].results[0].owned_campaign_count')" == "0" ]] || { echo "Admin staging has owned campaign data; refusing destructive runtime smoke." >&2; exit 1; }
      - name: Create ephemeral bootstrap probe credential
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_BOOTSTRAP_SECRET="$(openssl rand -hex 32)"
          SMOKE_PASSWORD="Smoke-$(openssl rand -hex 24)"
          echo "::add-mask::$SMOKE_BOOTSTRAP_SECRET"
          echo "::add-mask::$SMOKE_PASSWORD"
          SMOKE_DIGEST="$(printf '%s' "$SMOKE_BOOTSTRAP_SECRET" | sha256sum | awk '{print $1}')"
          echo "SMOKE_BOOTSTRAP_SECRET=$SMOKE_BOOTSTRAP_SECRET" >> "$GITHUB_ENV"
          echo "SMOKE_PASSWORD=$SMOKE_PASSWORD" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_SECRET_SHA256=$SMOKE_DIGEST" >> "$GITHUB_ENV"
      - name: Materialize isolated smoke config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const c = JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          c.env.admin_staging.vars.ORGANIZATION_BOOTSTRAP_SECRET_SHA256 = process.env.BOOTSTRAP_SECRET_SHA256;
          fs.writeFileSync('wrangler.jsonc', JSON.stringify(c,null,2)+'\n');
          NODE
      - name: Build admin staging smoke candidate
        env:
          CLOUDFLARE_ENV: admin_staging
        run: npm run build
      - name: Verify generated isolation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'), path=require('node:path');
          const redirect=JSON.parse(fs.readFileSync('.wrangler/deploy/config.json','utf8'));
          const generated=JSON.parse(fs.readFileSync(path.resolve('.wrangler/deploy',redirect.configPath),'utf8'));
          if (generated.name !== process.env.ADMIN_WORKER_NAME) throw new Error(`Unexpected Worker ${generated.name}`);
          const db=(generated.d1_databases||[]).find(x=>x.binding==='DB');
          if (db?.database_id !== process.env.ADMIN_D1_ID) throw new Error('Wrong D1 binding.');
          if (generated.vars?.ORGANIZATION_BOOTSTRAP_SECRET_SHA256 !== process.env.BOOTSTRAP_SECRET_SHA256) throw new Error('Wrong bootstrap digest.');
          const s=JSON.stringify(generated);
          if (s.includes(process.env.PROD_D1_ID) || s.includes(process.env.RXDB_STAGING_D1_ID)) throw new Error('Protected D1 leaked into generated config.');
          for (const id of ['91914001','91914002','91914003','91914004']) if (!s.includes(id)) throw new Error(`Missing rate namespace ${id}.`);
          NODE
      - name: Dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-admin-final-dry-run
      - name: Deploy smoke candidate
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/admin-final/deploy-smoke.log
          TEST_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/admin-final/deploy-smoke.log | tail -n1 || true)"
          [[ -n "$TEST_URL" ]] || { echo "No workers.dev URL reported." >&2; exit 1; }
          echo "TEST_URL=$TEST_URL" >> "$GITHUB_ENV"
      - name: Configure TOTP encryption key
        shell: bash
        run: |
          set -euo pipefail
          TOTP_KEY="$(openssl rand 32 | base64 | tr '+/' '-_' | tr -d '=\n')"
          echo "::add-mask::$TOTP_KEY"
          printf '%s' "$TOTP_KEY" | npx wrangler secret put ORGANIZATION_TOTP_KEY --name "$ADMIN_WORKER_NAME"
          unset TOTP_KEY
      - name: Real successful bootstrap, password, TOTP and session smoke
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            STATUS="$(curl --silent --show-error --location --output /tmp/admin-final/start.html --write-out '%{http_code}' "$TEST_URL/start" || printf '000')"
            [[ "$STATUS" -ge 200 && "$STATUS" -lt 400 ]] && break
            [[ "$attempt" -lt 24 ]] || { echo "UI unhealthy: HTTP ${STATUS}." >&2; exit 1; }
            sleep 5
          done
          SMOKE_USERNAME="runtime.smoke.${GITHUB_RUN_ID}"
          SMOKE_ORG="Runtime Smoke ${GITHUB_RUN_ID}"
          jq -n --arg organizationName "$SMOKE_ORG" --arg username "$SMOKE_USERNAME" --arg password "$SMOKE_PASSWORD" --arg bootstrapSecret "$SMOKE_BOOTSTRAP_SECRET" '{organizationName:$organizationName,username:$username,password:$password,bootstrapSecret:$bootstrapSecret}' > /tmp/admin-final/bootstrap-payload.json
          BOOTSTRAP_STATUS="$(curl --silent --show-error --output /tmp/admin-final/bootstrap-response.json --write-out '%{http_code}' --cookie-jar /tmp/admin-final/cookies.txt -X POST "$TEST_URL/api/organization/bootstrap" -H "Origin: $TEST_URL" -H 'Content-Type: application/json' --data-binary @/tmp/admin-final/bootstrap-payload.json)"
          if [[ "$BOOTSTRAP_STATUS" != "201" ]]; then
            echo "Real bootstrap failed with HTTP ${BOOTSTRAP_STATUS}." >&2
            jq -c '.error // {error:"non-json-or-unexpected"}' /tmp/admin-final/bootstrap-response.json >&2 || true
            exit 1
          fi
          jq -e '(.organization.id|type=="string") and (.account.id|type=="string") and (.recoveryCodes|length==10) and (.otpauthUri|startswith("otpauth://totp/"))' /tmp/admin-final/bootstrap-response.json >/dev/null
          jq -n --arg username "$SMOKE_USERNAME" --arg password "$SMOKE_PASSWORD" '{username:$username,password:$password}' > /tmp/admin-final/login-payload.json
          LOGIN_STATUS="$(curl --silent --show-error --output /tmp/admin-final/login-response.json --write-out '%{http_code}' --cookie /tmp/admin-final/cookies.txt --cookie-jar /tmp/admin-final/cookies.txt -X POST "$TEST_URL/api/organization/login/password" -H "Origin: $TEST_URL" -H 'Content-Type: application/json' --data-binary @/tmp/admin-final/login-payload.json)"
          [[ "$LOGIN_STATUS" == "200" ]] || { echo "Password login failed with HTTP ${LOGIN_STATUS}." >&2; jq -c '.error // {}' /tmp/admin-final/login-response.json >&2 || true; exit 1; }
          OTP_SECRET="$(jq -r '.otpauthUri' /tmp/admin-final/bootstrap-response.json | node -e 'let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>process.stdout.write(new URL(s.trim()).searchParams.get("secret")||""));')"
          [[ -n "$OTP_SECRET" ]] || { echo "TOTP secret missing from bootstrap response." >&2; exit 1; }
          echo "::add-mask::$OTP_SECRET"
          TOTP_CODE="$(python - "$OTP_SECRET" <<'PY'
          import base64, hashlib, hmac, struct, sys, time
          secret = base64.b32decode(sys.argv[1], casefold=True)
          counter = int(time.time()) // 30
          digest = hmac.new(secret, struct.pack('>Q', counter), hashlib.sha1).digest()
          offset = digest[-1] & 0x0f
          binary = ((digest[offset] & 0x7f) << 24) | ((digest[offset+1] & 0xff) << 16) | ((digest[offset+2] & 0xff) << 8) | (digest[offset+3] & 0xff)
          print(f'{binary % 1000000:06d}')
          PY
          )"
          echo "::add-mask::$TOTP_CODE"
          MFA_STATUS="$(curl --silent --show-error --output /tmp/admin-final/totp-response.json --write-out '%{http_code}' --cookie /tmp/admin-final/cookies.txt --cookie-jar /tmp/admin-final/cookies.txt -X POST "$TEST_URL/api/organization/login/totp" -H "Origin: $TEST_URL" -H 'Content-Type: application/json' --data "{\"code\":\"$TOTP_CODE\"}")"
          [[ "$MFA_STATUS" == "200" ]] || { echo "TOTP login failed with HTTP ${MFA_STATUS}." >&2; jq -c '.error // {}' /tmp/admin-final/totp-response.json >&2 || true; exit 1; }
          ME_STATUS="$(curl --silent --show-error --output /tmp/admin-final/me-smoke.json --write-out '%{http_code}' --cookie /tmp/admin-final/cookies.txt "$TEST_URL/api/organization/me")"
          [[ "$ME_STATUS" == "200" ]] || { echo "Authenticated /me failed with HTTP ${ME_STATUS}." >&2; exit 1; }
          jq -e '.assurance == "mfa" and (.memberships|length==1) and .memberships[0].role == "organizer"' /tmp/admin-final/me-smoke.json >/dev/null
      - name: Verify smoke persistence then clean isolated D1
        shell: bash
        run: |
          set -euo pipefail
          STATE="$(npx wrangler d1 execute "$ADMIN_DB_NAME" --env admin_staging --config wrangler.jsonc --remote --json --command "SELECT (SELECT COUNT(*) FROM organization_bootstrap_state) AS bootstrap_count, (SELECT COUNT(*) FROM organizations) AS organization_count, (SELECT COUNT(*) FROM organization_accounts) AS account_count;")"
          [[ "$(printf '%s' "$STATE" | jq -r '.[0].results[0].bootstrap_count')" == "1" ]] || exit 1
          [[ "$(printf '%s' "$STATE" | jq -r '.[0].results[0].organization_count')" == "1" ]] || exit 1
          [[ "$(printf '%s' "$STATE" | jq -r '.[0].results[0].account_count')" == "1" ]] || exit 1
          npx wrangler d1 execute "$ADMIN_DB_NAME" --env admin_staging --config wrangler.jsonc --remote --command "DELETE FROM organization_bootstrap_state; DELETE FROM organizations; DELETE FROM organization_accounts;"
          CLEAN="$(npx wrangler d1 execute "$ADMIN_DB_NAME" --env admin_staging --config wrangler.jsonc --remote --json --command "SELECT (SELECT COUNT(*) FROM organization_bootstrap_state) AS bootstrap_count, (SELECT COUNT(*) FROM organizations) AS organization_count, (SELECT COUNT(*) FROM organization_accounts) AS account_count, (SELECT COUNT(*) FROM campaigns WHERE organization_id IS NOT NULL) AS owned_campaign_count;")"
          [[ "$(printf '%s' "$CLEAN" | jq -r '.[0].results[0].bootstrap_count')" == "0" ]] || exit 1
          [[ "$(printf '%s' "$CLEAN" | jq -r '.[0].results[0].organization_count')" == "0" ]] || exit 1
          [[ "$(printf '%s' "$CLEAN" | jq -r '.[0].results[0].account_count')" == "0" ]] || exit 1
          [[ "$(printf '%s' "$CLEAN" | jq -r '.[0].results[0].owned_campaign_count')" == "0" ]] || exit 1
          rm -f /tmp/admin-final/bootstrap-payload.json /tmp/admin-final/bootstrap-response.json /tmp/admin-final/login-payload.json /tmp/admin-final/login-response.json /tmp/admin-final/totp-response.json /tmp/admin-final/me-smoke.json /tmp/admin-final/cookies.txt
      - name: Restore private user bootstrap digest and rebuild
        shell: bash
        env:
          CLOUDFLARE_ENV: admin_staging
        run: |
          set -euo pipefail
          echo "BOOTSTRAP_SECRET_SHA256=$FINAL_BOOTSTRAP_SECRET_SHA256" >> "$GITHUB_ENV"
          node <<'NODE'
          const fs = require('node:fs');
          const c = JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          c.env.admin_staging.vars.ORGANIZATION_BOOTSTRAP_SECRET_SHA256 = process.env.FINAL_BOOTSTRAP_SECRET_SHA256;
          fs.writeFileSync('wrangler.jsonc', JSON.stringify(c,null,2)+'\n');
          NODE
          rm -rf dist .wrangler/deploy
          npm run build
      - name: Deploy verified final candidate
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/admin-final/deploy-final.log
          FINAL_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/admin-final/deploy-final.log | tail -n1 || true)"
          [[ -n "$FINAL_URL" ]] || { echo "No workers.dev URL reported." >&2; exit 1; }
          echo "TEST_URL=$FINAL_URL" >> "$GITHUB_ENV"
          echo "test_url=$FINAL_URL" >> "$GITHUB_OUTPUT"
      - name: Final public smoke and bootstrap rotation proof
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --location --output /tmp/admin-final/start.html --write-out '%{http_code}' "$TEST_URL/start")"
          [[ "$STATUS" -ge 200 && "$STATUS" -lt 400 ]] || { echo "Final UI unhealthy: HTTP ${STATUS}." >&2; exit 1; }
          ME="$(curl --silent --show-error --output /tmp/admin-final/me.json --write-out '%{http_code}' "$TEST_URL/api/organization/me")"
          [[ "$ME" == "401" ]] || { echo "Expected /me 401, got ${ME}." >&2; exit 1; }
          BAD_ORIGIN="$(curl --silent --show-error --output /tmp/admin-final/origin.json --write-out '%{http_code}' -X POST "$TEST_URL/api/organization/bootstrap" -H 'Origin: https://invalid.example' -H 'Content-Type: application/json' --data '{}')"
          [[ "$BAD_ORIGIN" == "403" ]] || { echo "Wrong-origin bootstrap was not rejected." >&2; exit 1; }
          OLD_SMOKE="$(jq -n --arg s "$SMOKE_BOOTSTRAP_SECRET" '{organizationName:"Rotation Test",username:"rotation.test",password:"not-a-real-password-123",bootstrapSecret:$s}')"
          ROTATED="$(curl --silent --show-error --output /tmp/admin-final/rotated.json --write-out '%{http_code}' -X POST "$TEST_URL/api/organization/bootstrap" -H "Origin: $TEST_URL" -H 'Content-Type: application/json' --data "$OLD_SMOKE")"
          [[ "$ROTATED" == "403" ]] || { echo "Ephemeral bootstrap credential was not rotated out: ${ROTATED}." >&2; exit 1; }
          curl --silent --show-error --head "$TEST_URL/api/organization/me" > /tmp/admin-final/headers.txt
          grep -Eqi '^x-frame-options: DENY' /tmp/admin-final/headers.txt || { echo "Missing X-Frame-Options DENY." >&2; exit 1; }
          ! grep -F "$PROD_D1_ID" /tmp/admin-final/start.html >/dev/null
          ! grep -F "$RXDB_STAGING_D1_ID" /tmp/admin-final/start.html >/dev/null
          printf '%s\n' "$TEST_URL" > /tmp/admin-final/test-url.txt
      - name: Upload verified handoff
        uses: actions/upload-artifact@v4
        with:
          name: admin-staging-final-handoff
          path: /tmp/admin-final/
          retention-days: 1
      - name: Summary
        shell: bash
        run: |
          {
            echo '## Verified Organizer Admin staging'
            echo
            echo "- Source: \`${GITHUB_SHA}\`"
            echo "- Worker: \`${ADMIN_WORKER_NAME}\`"
            echo "- D1: \`${ADMIN_DB_NAME}\`"
            echo "- D1 ID: \`${ADMIN_D1_ID}\`"
            echo "- URL: ${TEST_URL}"
            echo '- Real bootstrap + password + TOTP + authenticated /me: VERIFIED'
            echo '- Disposable bootstrap data removed from isolated D1: YES'
            echo '- Private user bootstrap digest restored after smoke: YES'
            echo "- Dependency manifests inherited from audited \`${AUDITED_BASE_SHA}\`: YES"
            echo '- Production deploy: NO'
          } >> "$GITHUB_STEP_SUMMARY"
