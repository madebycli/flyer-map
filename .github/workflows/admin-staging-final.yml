name: Organizer Admin Staging Final

on:
  push:
    branches:
      - organizer-admin-staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: organizer-admin-staging-final-v4
  cancel-in-progress: false

jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONFIGURED_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_DB_NAME: flyer-map-admin-staging-db
      ADMIN_WORKER_NAME: flyer-map-admin-staging
      PROD_D1_ID: 0113e775-1e43-4d96-8b97-51fdeec7355b
      RXDB_STAGING_D1_ID: bcec3432-18ec-42a2-970a-64d52c8263d5
      FINAL_BOOTSTRAP_SECRET_SHA256: 330d968a1282453edd0427601226526df39f7ff8a3b3ea6566466a0f40017e1d
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: High severity dependency audit
        run: npm audit --audit-level=high
      - name: Resolve isolated Cloudflare resources
        id: resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/admin-final /tmp/admin-private
          ACCOUNTS_JSON="$(curl --fail-with-body --silent --show-error 'https://api.cloudflare.com/client/v4/accounts?per_page=50' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')"
          [[ "$(printf '%s' "$ACCOUNTS_JSON" | jq -r '.success')" == "true" ]] || exit 1
          COUNT="$(printf '%s' "$ACCOUNTS_JSON" | jq '.result | length')"
          if [[ -n "${CONFIGURED_CLOUDFLARE_ACCOUNT_ID:-}" ]] && printf '%s' "$ACCOUNTS_JSON" | jq -e --arg id "$CONFIGURED_CLOUDFLARE_ACCOUNT_ID" '.result[] | select(.id == $id)' >/dev/null; then
            ACCOUNT_ID="$CONFIGURED_CLOUDFLARE_ACCOUNT_ID"
          elif [[ "$COUNT" == "1" ]]; then
            ACCOUNT_ID="$(printf '%s' "$ACCOUNTS_JSON" | jq -r '.result[0].id')"
          else
            echo 'Cloudflare account is ambiguous.' >&2
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          LIST_JSON="$(npx wrangler d1 list --json)"
          ADMIN_D1_ID="$(printf '%s' "$LIST_JSON" | jq -r --arg name "$ADMIN_DB_NAME" '[.[] | select(.name == $name)] | if length == 1 then .[0].uuid else empty end')"
          [[ -n "$ADMIN_D1_ID" ]] || { echo 'Admin staging D1 is missing or ambiguous.' >&2; exit 1; }
          [[ "$ADMIN_D1_ID" != "$PROD_D1_ID" && "$ADMIN_D1_ID" != "$RXDB_STAGING_D1_ID" ]] || { echo 'Admin D1 collides with a protected database.' >&2; exit 1; }
          echo "ADMIN_D1_ID=$ADMIN_D1_ID" >> "$GITHUB_ENV"
          echo "d1_id=$ADMIN_D1_ID" >> "$GITHUB_OUTPUT"
      - name: Materialize isolated admin config with KDF Durable Object
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const c = JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          if (c.main !== './worker/indexOrganizer.ts') throw new Error(`Unexpected staging entrypoint ${c.main}`);
          const prod = (c.d1_databases || []).find(x => x.binding === 'DB');
          if (prod?.database_id !== process.env.PROD_D1_ID) throw new Error('Production D1 baseline changed.');
          c.env = c.env || {};
          c.env.admin_staging = {
            name: process.env.ADMIN_WORKER_NAME,
            workers_dev: true,
            vars: { ORGANIZATION_BOOTSTRAP_SECRET_SHA256: process.env.FINAL_BOOTSTRAP_SECRET_SHA256 },
            d1_databases: [{ binding:'DB', database_name:process.env.ADMIN_DB_NAME, database_id:process.env.ADMIN_D1_ID, migrations_dir:'migrations' }],
            durable_objects: { bindings:[
              { name:'CAMPAIGN_SYNC', class_name:'CampaignSyncDurableObject' },
              { name:'ORGANIZATION_PASSWORD_KDF', class_name:'OrganizationPasswordKdfDurableObject' }
            ] },
            ratelimits: [
              { name:'FIELD_GROUP_JOIN_ACTOR_LIMITER', namespace_id:'91914001', simple:{limit:30,period:60} },
              { name:'FIELD_GROUP_JOIN_CREDENTIAL_LIMITER', namespace_id:'91914002', simple:{limit:8,period:60} },
              { name:'PICKUP_SEARCH_LIMITER', namespace_id:'91914003', simple:{limit:20,period:10} },
              { name:'ORGANIZATION_LOGIN_LIMITER', namespace_id:'91914004', simple:{limit:12,period:60} }
            ]
          };
          const kdfTag = 'v2-organization-password-kdf';
          c.migrations = c.migrations || [];
          if (!c.migrations.some(m => m.tag === kdfTag)) {
            c.migrations.push({ tag:kdfTag, new_sqlite_classes:['OrganizationPasswordKdfDurableObject'] });
          }
          const protectedIds = new Set([...(c.ratelimits || []).map(x => String(x.namespace_id)), '91814001','91814002','91814003']);
          for (const limiter of c.env.admin_staging.ratelimits) {
            if (protectedIds.has(String(limiter.namespace_id))) throw new Error(`Rate-limit collision ${limiter.namespace_id}`);
          }
          fs.writeFileSync('wrangler.jsonc', JSON.stringify(c,null,2)+'\n');
          NODE
      - name: Apply and verify isolated D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply "$ADMIN_DB_NAME" --env admin_staging --config wrangler.jsonc --remote
          npx wrangler d1 execute "$ADMIN_DB_NAME" --env admin_staging --config wrangler.jsonc --remote --json --command 'PRAGMA foreign_key_check;' > /tmp/admin-final/pre-fk.json
          [[ "$(jq '[.[].results[]?] | length' /tmp/admin-final/pre-fk.json)" == "0" ]] || { echo 'Foreign-key check failed.' >&2; exit 1; }
          STATE="$(npx wrangler d1 execute "$ADMIN_DB_NAME" --env admin_staging --config wrangler.jsonc --remote --json --command "SELECT (SELECT COUNT(*) FROM organization_bootstrap_state) AS bootstrap_count, (SELECT COUNT(*) FROM organizations) AS organization_count, (SELECT COUNT(*) FROM organization_accounts) AS account_count, (SELECT COUNT(*) FROM campaigns WHERE organization_id IS NOT NULL) AS owned_campaign_count;")"
          printf '%s' "$STATE" > /tmp/admin-final/pre-smoke-state.json
          jq -e '.[0].results[0] | .bootstrap_count==0 and .organization_count==0 and .account_count==0 and .owned_campaign_count==0' <<<"$STATE" >/dev/null || { echo 'Admin staging is not pristine; refusing destructive smoke.' >&2; exit 1; }
      - name: Create ephemeral runtime credentials
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_BOOTSTRAP_SECRET="$(openssl rand -hex 32)"
          SMOKE_PASSWORD="Smoke-$(openssl rand -hex 24)"
          echo "::add-mask::$SMOKE_BOOTSTRAP_SECRET"
          echo "::add-mask::$SMOKE_PASSWORD"
          SMOKE_DIGEST="$(printf '%s' "$SMOKE_BOOTSTRAP_SECRET" | sha256sum | awk '{print $1}')"
          echo "SMOKE_BOOTSTRAP_SECRET=$SMOKE_BOOTSTRAP_SECRET" >> "$GITHUB_ENV"
          echo "SMOKE_PASSWORD=$SMOKE_PASSWORD" >> "$GITHUB_ENV"
          echo "SMOKE_DIGEST=$SMOKE_DIGEST" >> "$GITHUB_ENV"
      - name: Build and verify isolated smoke candidate
        env:
          CLOUDFLARE_ENV: admin_staging
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const c = JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          c.env.admin_staging.vars.ORGANIZATION_BOOTSTRAP_SECRET_SHA256 = process.env.SMOKE_DIGEST;
          fs.writeFileSync('wrangler.jsonc', JSON.stringify(c,null,2)+'\n');
          NODE
          npm run build
          node <<'NODE'
          const fs=require('node:fs'), path=require('node:path');
          const redirect=JSON.parse(fs.readFileSync('.wrangler/deploy/config.json','utf8'));
          const generated=JSON.parse(fs.readFileSync(path.resolve('.wrangler/deploy',redirect.configPath),'utf8'));
          if (generated.name !== process.env.ADMIN_WORKER_NAME) throw new Error(`Unexpected Worker ${generated.name}`);
          const db=(generated.d1_databases||[]).find(x=>x.binding==='DB');
          if (db?.database_id !== process.env.ADMIN_D1_ID) throw new Error('Wrong D1 binding.');
          const bindings=generated.durable_objects?.bindings||[];
          if (!bindings.some(x=>x.name==='ORGANIZATION_PASSWORD_KDF' && x.class_name==='OrganizationPasswordKdfDurableObject')) throw new Error('KDF Durable Object binding missing.');
          if (!(generated.migrations||[]).some(x=>x.tag==='v2-organization-password-kdf' && (x.new_sqlite_classes||[]).includes('OrganizationPasswordKdfDurableObject'))) throw new Error('KDF Durable Object migration missing.');
          const s=JSON.stringify(generated);
          if (s.includes(process.env.PROD_D1_ID) || s.includes(process.env.RXDB_STAGING_D1_ID)) throw new Error('Protected D1 leaked into generated config.');
          NODE
          npx wrangler deploy --dry-run --outdir .wrangler-admin-final-dry-run
      - name: Deploy isolated smoke candidate
        id: smoke_deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/admin-final/deploy-smoke.log
          TEST_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/admin-final/deploy-smoke.log | tail -n1 || true)"
          [[ -n "$TEST_URL" ]] || { echo 'No workers.dev URL reported.' >&2; exit 1; }
          grep -F 'ORGANIZATION_PASSWORD_KDF' /tmp/admin-final/deploy-smoke.log >/dev/null || { echo 'KDF binding not reported by Wrangler.' >&2; exit 1; }
          echo "TEST_URL=$TEST_URL" >> "$GITHUB_ENV"
          echo "url=$TEST_URL" >> "$GITHUB_OUTPUT"
      - name: Configure TOTP encryption key
        shell: bash
        run: |
          set -euo pipefail
          TOTP_KEY="$(openssl rand 32 | base64 | tr '+/' '-_' | tr -d '=\n')"
          echo "::add-mask::$TOTP_KEY"
          printf '%s' "$TOTP_KEY" | npx wrangler secret put ORGANIZATION_TOTP_KEY --name "$ADMIN_WORKER_NAME"
          unset TOTP_KEY
      - name: Real bootstrap password TOTP session smoke
        id: runtime_smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          diag_fail() {
            local stage="$1" status="$2" code="$3"
            jq -n --arg stage "$stage" --arg status "$status" --arg code "$code" '{ok:false,stage:$stage,http_status:$status,error_code:$code}' > /tmp/admin-final/runtime-smoke.json
            echo "Runtime smoke failed at ${stage}: HTTP ${status}, code ${code}." >&2
            exit 1
          }
          for attempt in $(seq 1 24); do
            STATUS="$(curl --silent --show-error --location --output /tmp/admin-private/start.html --write-out '%{http_code}' "$TEST_URL/start" || printf '000')"
            [[ "$STATUS" -ge 200 && "$STATUS" -lt 400 ]] && break
            [[ "$attempt" -lt 24 ]] || diag_fail ui "$STATUS" unavailable
            sleep 5
          done
          USERNAME="runtime.smoke.${GITHUB_RUN_ID}"
          ORG="Runtime Smoke ${GITHUB_RUN_ID}"
          jq -n --arg organizationName "$ORG" --arg username "$USERNAME" --arg password "$SMOKE_PASSWORD" --arg bootstrapSecret "$SMOKE_BOOTSTRAP_SECRET" '{organizationName:$organizationName,username:$username,password:$password,bootstrapSecret:$bootstrapSecret}' > /tmp/admin-private/bootstrap-payload.json
          BSTATUS="$(curl --silent --show-error --output /tmp/admin-private/bootstrap-response.json --write-out '%{http_code}' --cookie-jar /tmp/admin-private/cookies.txt -X POST "$TEST_URL/api/organization/bootstrap" -H "Origin: $TEST_URL" -H 'Content-Type: application/json' --data-binary @/tmp/admin-private/bootstrap-payload.json || printf '000')"
          if [[ "$BSTATUS" != "201" ]]; then CODE="$(jq -r '.error.code // "non_json"' /tmp/admin-private/bootstrap-response.json 2>/dev/null || printf 'non_json')"; diag_fail bootstrap "$BSTATUS" "$CODE"; fi
          jq -e '(.organization.id|type=="string") and (.account.id|type=="string") and (.recoveryCodes|length==10) and (.otpauthUri|startswith("otpauth://totp/"))' /tmp/admin-private/bootstrap-response.json >/dev/null || diag_fail bootstrap_contract 201 invalid_contract
          jq -n --arg username "$USERNAME" --arg password "$SMOKE_PASSWORD" '{username:$username,password:$password}' > /tmp/admin-private/login-payload.json
          LSTATUS="$(curl --silent --show-error --output /tmp/admin-private/login-response.json --write-out '%{http_code}' --cookie /tmp/admin-private/cookies.txt --cookie-jar /tmp/admin-private/cookies.txt -X POST "$TEST_URL/api/organization/login/password" -H "Origin: $TEST_URL" -H 'Content-Type: application/json' --data-binary @/tmp/admin-private/login-payload.json || printf '000')"
          if [[ "$LSTATUS" != "200" ]]; then CODE="$(jq -r '.error.code // "non_json"' /tmp/admin-private/login-response.json 2>/dev/null || printf 'non_json')"; diag_fail password_login "$LSTATUS" "$CODE"; fi
          OTP_SECRET="$(jq -r '.otpauthUri' /tmp/admin-private/bootstrap-response.json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(new URL(s.trim()).searchParams.get("secret")||""));')"
          [[ -n "$OTP_SECRET" ]] || diag_fail totp_secret 201 missing_secret
          echo "::add-mask::$OTP_SECRET"
          TOTP_CODE="$(python - "$OTP_SECRET" <<'PY'
          import base64, hashlib, hmac, struct, sys, time
          secret = base64.b32decode(sys.argv[1], casefold=True)
          counter = int(time.time()) // 30
          digest = hmac.new(secret, struct.pack('>Q', counter), hashlib.sha1).digest()
          offset = digest[-1] & 0x0f
          binary = ((digest[offset] & 0x7f) << 24) | ((digest[offset+1] & 0xff) << 16) | ((digest[offset+2] & 0xff) << 8) | (digest[offset+3] & 0xff)
          print(f'{binary % 1000000:06d}')
          PY
          )"
          echo "::add-mask::$TOTP_CODE"
          MSTATUS="$(curl --silent --show-error --output /tmp/admin-private/totp-response.json --write-out '%{http_code}' --cookie /tmp/admin-private/cookies.txt --cookie-jar /tmp/admin-private/cookies.txt -X POST "$TEST_URL/api/organization/login/totp" -H "Origin: $TEST_URL" -H 'Content-Type: application/json' --data "{\"code\":\"$TOTP_CODE\"}" || printf '000')"
          if [[ "$MSTATUS" != "200" ]]; then CODE="$(jq -r '.error.code // "non_json"' /tmp/admin-private/totp-response.json 2>/dev/null || printf 'non_json')"; diag_fail totp_login "$MSTATUS" "$CODE"; fi
          MESTATUS="$(curl --silent --show-error --output /tmp/admin-private/me.json --write-out '%{http_code}' --cookie /tmp/admin-private/cookies.txt "$TEST_URL/api/organization/me" || printf '000')"
          [[ "$MESTATUS" == "200" ]] || diag_fail session_me "$MESTATUS" unavailable
          jq -e '.assurance == "mfa" and (.memberships|length==1) and .memberships[0].role == "organizer"' /tmp/admin-private/me.json >/dev/null || diag_fail session_contract 200 invalid_contract
          jq -n --arg bootstrap "$BSTATUS" --arg password "$LSTATUS" --arg totp "$MSTATUS" --arg me "$MESTATUS" '{ok:true,bootstrap_status:$bootstrap,password_status:$password,totp_status:$totp,me_status:$me}' > /tmp/admin-final/runtime-smoke.json
      - name: Inspect and clean disposable admin state
        id: cleanup
        if: always() && steps.resources.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          STATE="$(npx wrangler d1 execute "$ADMIN_DB_NAME" --env admin_staging --config wrangler.jsonc --remote --json --command "SELECT (SELECT COUNT(*) FROM organization_bootstrap_state) AS bootstrap_count, (SELECT COUNT(*) FROM organizations) AS organization_count, (SELECT COUNT(*) FROM organization_accounts) AS account_count, (SELECT COUNT(*) FROM campaigns WHERE organization_id IS NOT NULL) AS owned_campaign_count;")"
          printf '%s' "$STATE" > /tmp/admin-final/post-smoke-state.json
          npx wrangler d1 execute "$ADMIN_DB_NAME" --env admin_staging --config wrangler.jsonc --remote --command "DELETE FROM organization_bootstrap_state; DELETE FROM organizations; DELETE FROM organization_accounts;"
          CLEAN="$(npx wrangler d1 execute "$ADMIN_DB_NAME" --env admin_staging --config wrangler.jsonc --remote --json --command "SELECT (SELECT COUNT(*) FROM organization_bootstrap_state) AS bootstrap_count, (SELECT COUNT(*) FROM organizations) AS organization_count, (SELECT COUNT(*) FROM organization_accounts) AS account_count, (SELECT COUNT(*) FROM campaigns WHERE organization_id IS NOT NULL) AS owned_campaign_count;")"
          printf '%s' "$CLEAN" > /tmp/admin-final/clean-state.json
          jq -e '.[0].results[0] | .bootstrap_count==0 and .organization_count==0 and .account_count==0 and .owned_campaign_count==0' /tmp/admin-final/clean-state.json >/dev/null
      - name: Restore private bootstrap digest and rebuild
        id: restore
        if: always() && steps.resources.outcome == 'success'
        env:
          CLOUDFLARE_ENV: admin_staging
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const c = JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          if (!c.env?.admin_staging) throw new Error('admin_staging config unavailable');
          c.env.admin_staging.vars.ORGANIZATION_BOOTSTRAP_SECRET_SHA256 = process.env.FINAL_BOOTSTRAP_SECRET_SHA256;
          fs.writeFileSync('wrangler.jsonc', JSON.stringify(c,null,2)+'\n');
          NODE
          rm -rf dist .wrangler/deploy
          npm run build
      - name: Deploy restored final candidate
        id: final_deploy
        if: always() && steps.restore.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/admin-final/deploy-final.log
          FINAL_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/admin-final/deploy-final.log | tail -n1 || true)"
          [[ -n "$FINAL_URL" ]] || { echo 'No final workers.dev URL reported.' >&2; exit 1; }
          grep -F 'ORGANIZATION_PASSWORD_KDF' /tmp/admin-final/deploy-final.log >/dev/null || { echo 'Final KDF binding not reported by Wrangler.' >&2; exit 1; }
          echo "TEST_URL=$FINAL_URL" >> "$GITHUB_ENV"
          echo "url=$FINAL_URL" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$FINAL_URL" > /tmp/admin-final/test-url.txt
      - name: Verify final safe public state
        id: final_safety
        if: always() && steps.final_deploy.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --location --output /tmp/admin-private/final-start.html --write-out '%{http_code}' "$TEST_URL/start")"
          [[ "$STATUS" -ge 200 && "$STATUS" -lt 400 ]] || { echo "Final UI unhealthy: ${STATUS}." >&2; exit 1; }
          ME="$(curl --silent --show-error --output /tmp/admin-private/final-me.json --write-out '%{http_code}' "$TEST_URL/api/organization/me")"
          [[ "$ME" == "401" ]] || { echo "Expected final /me 401, got ${ME}." >&2; exit 1; }
          BAD_ORIGIN="$(curl --silent --show-error --output /tmp/admin-private/final-origin.json --write-out '%{http_code}' -X POST "$TEST_URL/api/organization/bootstrap" -H 'Origin: https://invalid.example' -H 'Content-Type: application/json' --data '{}')"
          [[ "$BAD_ORIGIN" == "403" ]] || { echo 'Wrong-origin bootstrap was not rejected.' >&2; exit 1; }
          ROTATION_PAYLOAD="$(jq -n --arg s "$SMOKE_BOOTSTRAP_SECRET" '{organizationName:"Rotation Test",username:"rotation.test",password:"not-a-real-password-123",bootstrapSecret:$s}')"
          ROTATED="$(curl --silent --show-error --output /tmp/admin-private/final-rotation.json --write-out '%{http_code}' -X POST "$TEST_URL/api/organization/bootstrap" -H "Origin: $TEST_URL" -H 'Content-Type: application/json' --data "$ROTATION_PAYLOAD")"
          [[ "$ROTATED" == "403" ]] || { echo "Ephemeral bootstrap credential still active: ${ROTATED}." >&2; exit 1; }
          curl --silent --show-error --head "$TEST_URL/api/organization/me" > /tmp/admin-final/final-headers.txt
          grep -Eqi '^x-frame-options: DENY' /tmp/admin-final/final-headers.txt
          ! grep -F "$PROD_D1_ID" /tmp/admin-private/final-start.html >/dev/null
          ! grep -F "$RXDB_STAGING_D1_ID" /tmp/admin-private/final-start.html >/dev/null
      - name: Upload sanitized staging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-staging-sanitized-diagnostics
          path: /tmp/admin-final/
          retention-days: 1
          if-no-files-found: warn
      - name: Final gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "runtime_smoke=${{ steps.runtime_smoke.outcome }} cleanup=${{ steps.cleanup.outcome }} restore=${{ steps.restore.outcome }} final_deploy=${{ steps.final_deploy.outcome }} final_safety=${{ steps.final_safety.outcome }}"
          [[ "${{ steps.runtime_smoke.outcome }}" == "success" ]]
          [[ "${{ steps.cleanup.outcome }}" == "success" ]]
          [[ "${{ steps.restore.outcome }}" == "success" ]]
          [[ "${{ steps.final_deploy.outcome }}" == "success" ]]
          [[ "${{ steps.final_safety.outcome }}" == "success" ]]
