name: Independent StreetEngine scale audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run synthetic scale audit
        shell: bash
        run: |
          printf '{"scenario":"environment","node":"%s","npm":"%s"}\n' "$(node --version)" "$(npm --version)" > independent-street-scale.jsonl
          node --experimental-transform-types scripts/street-masterplan-audit.ts | tee -a independent-street-scale.jsonl
      - name: Validate scale outcomes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const rows = readFileSync('independent-street-scale.jsonl', 'utf8').trim().split('\n').map(JSON.parse);
          const scale = rows.filter((row) => row.scenario === 'scale');
          const byHouses = new Map(scale.map((row) => [row.houses, row]));
          for (const houses of [0, 399, 1000, 5000, 10000, 20000]) {
            const row = byHouses.get(houses);
            if (!row || row.result?.outcome !== 'ready' || row.errorCode != null) {
              throw new Error(`expected ready synthetic scale result for ${houses} houses: ${JSON.stringify(row)}`);
            }
            if (row.maxStatements > 50) {
              throw new Error(`bounded request statement budget exceeded for ${houses} houses: ${JSON.stringify(row)}`);
            }
          }
          for (const houses of [10000, 20000]) {
            const row = byHouses.get(houses);
            if (row.fullEdgeReads > 1) {
              throw new Error(`full staged edge payload was reread during linking for ${houses} houses: ${JSON.stringify(row)}`);
            }
            if (row.indexedEdgeReads < 1) {
              throw new Error(`addressed linking did not use bounded edge-label buckets for ${houses} houses: ${JSON.stringify(row)}`);
            }
          }
          console.log('Independent scale gate confirmed 0/399/1k/5k/10k/20k ready, bounded statements, and no repeated full-edge linking reads.');
          NODE
      - name: Upload scale evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-street-scale
          path: independent-street-scale.jsonl
          retention-days: 7
