name: D1 Remote Rollout

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch/ref whose migrations are applied"
        required: true
        default: "plan-feature-complete-platform"
        type: string
      expected_sha:
        description: "Exact commit SHA required before any remote write"
        required: true
        default: "129bc30cc408cfb2fd840390faaa6e37c5164148"
        type: string
      confirmation:
        description: "Type exactly: APPLY 0004-0014"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/d1-remote-rollout.yml"

permissions:
  contents: read

concurrency:
  group: d1-production-rollout
  cancel-in-progress: false

jobs:
  rollout:
    name: Apply D1 migrations 0004-0014
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-d1-rollout]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE: flyer-map-db
      D1_DATABASE_ID: 0113e775-1e43-4d96-8b97-51fdeec7355b
      TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || 'plan-feature-complete-platform' }}
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || '129bc30cc408cfb2fd840390faaa6e37c5164148' }}
      CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || 'APPLY 0004-0014' }}

    steps:
      - name: Confirm explicit rollout intent
        shell: bash
        run: |
          set -euo pipefail
          test "${CONFIRMATION}" = "APPLY 0004-0014"
          if [ "${{ github.event_name }}" = "push" ]; then
            case "${{ github.event.head_commit.message }}" in
              *"[run-d1-rollout]"*) ;;
              *) echo "Missing one-shot rollout marker."; exit 1 ;;
            esac
          fi

      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 1

      - name: Lock exact source commit
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Checked out SHA: ${ACTUAL_SHA}"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"

      - name: Verify exact migration set
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const expected = [
            '0001_initial.sql','0002_m4_access.sql','0003_m5_mutations.sql',
            '0004_m6_task_source_provenance.sql','0005_m6_house_tasks.sql',
            '0006_fc1_field_groups.sql','0007_field_sessions_events.sql',
            '0008_comments.sql','0009_automations.sql',
            '0010_fc5_collection_access_areas_runs.sql','0011_fc5_collection_pickups.sql',
            '0012_fc5_collection_pickup_visibility.sql','0013_fc5_pickup_comments.sql',
            '0014_auto_area_task_preparation.sql'
          ];
          const actual = fs.readdirSync('migrations').filter(n => /^\d{4}.*\.sql$/.test(n)).sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            console.error('Migration set differs from approved 0001-0014 set.', actual);
            process.exit(1);
          }
          NODE

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Wrangler and target D1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .rollout
          npx wrangler --version
          echo "[gate] reading D1 info"
          npx wrangler d1 info "${D1_DATABASE}" | tee .rollout/d1-info.txt
          grep -Fq "${D1_DATABASE_ID}" .rollout/d1-info.txt
          echo "Target D1 verified."

      - name: Verify remote migration state is exactly 0001-0003
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list "${D1_DATABASE}" --remote
          npx wrangler d1 execute "${D1_DATABASE}" --remote --json \
            --command "SELECT name FROM d1_migrations ORDER BY name;" \
            > .rollout/applied-before.json
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('.rollout/applied-before.json','utf8'));
          const rows = (Array.isArray(payload)?payload:[payload]).flatMap(x => Array.isArray(x.results)?x.results:[]);
          const actual = rows.map(r => r.name);
          const expected = ['0001_initial.sql','0002_m4_access.sql','0003_m5_mutations.sql'];
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            console.error('Remote migration state changed:', actual);
            process.exit(1);
          }
          console.log('Remote state verified: only 0001-0003 are applied.');
          NODE

      - name: Capture pre-rollout recovery evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "[recovery] timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "[recovery] trying Time Travel bookmark"
          if npx wrangler d1 time-travel info "${D1_DATABASE}" --json > .rollout/time-travel-before.json; then
            echo "Time Travel bookmark captured."
          else
            echo "Time Travel info command unavailable in this token/database context; continuing because Wrangler migrations apply captures a backup in CI."
          fi
          echo "[recovery] exporting SQL snapshot on runner"
          npx wrangler d1 export "${D1_DATABASE}" --remote --output=.rollout/before.sql --yes
          test -s .rollout/before.sql
          echo "Pre-rollout SQL export bytes: $(wc -c < .rollout/before.sql)"

      - name: Capture baseline foreign keys
        shell: bash
        run: |
          set -euo pipefail
          echo "[baseline] foreign_key_check"
          npx wrangler d1 execute "${D1_DATABASE}" --remote --json \
            --command "PRAGMA foreign_key_check;" > .rollout/fk-before.json
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('.rollout/fk-before.json','utf8'));
          const rows = (Array.isArray(payload)?payload:[payload]).flatMap(x => Array.isArray(x.results)?x.results:[]);
          if (rows.length) { console.error('Foreign-key violations before rollout:', rows); process.exit(1); }
          console.log('Baseline foreign-key check clean.');
          NODE

      - name: Capture baseline counts
        shell: bash
        run: |
          set -euo pipefail
          echo "[baseline] row counts"
          npx wrangler d1 execute "${D1_DATABASE}" --remote --json \
            --command "SELECT 'campaigns' AS table_name, COUNT(*) AS row_count FROM campaigns
                       UNION ALL SELECT 'teams', COUNT(*) FROM teams
                       UNION ALL SELECT 'areas', COUNT(*) FROM areas
                       UNION ALL SELECT 'tasks', COUNT(*) FROM tasks
                       UNION ALL SELECT 'campaign_access_grants', COUNT(*) FROM campaign_access_grants
                       UNION ALL SELECT 'campaign_sessions', COUNT(*) FROM campaign_sessions
                       UNION ALL SELECT 'campaign_mutations', COUNT(*) FROM campaign_mutations;" \
            > .rollout/counts-before.json
          node -e "JSON.parse(require('fs').readFileSync('.rollout/counts-before.json','utf8')); console.log('Baseline counts captured.')"

      - name: APPLY remote D1 migrations 0004-0014
        shell: bash
        run: |
          set -euo pipefail
          echo "Applying approved migrations to ${D1_DATABASE}..."
          npx wrangler d1 migrations apply "${D1_DATABASE}" --remote | tee .rollout/migrations-apply.txt

      - name: Verify all 0001-0014 are applied
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list "${D1_DATABASE}" --remote
          npx wrangler d1 execute "${D1_DATABASE}" --remote --json \
            --command "SELECT name FROM d1_migrations ORDER BY name;" > .rollout/applied-after.json
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('.rollout/applied-after.json','utf8'));
          const rows = (Array.isArray(payload)?payload:[payload]).flatMap(x => Array.isArray(x.results)?x.results:[]);
          const actual = rows.map(r => r.name);
          const expected = [
            '0001_initial.sql','0002_m4_access.sql','0003_m5_mutations.sql',
            '0004_m6_task_source_provenance.sql','0005_m6_house_tasks.sql','0006_fc1_field_groups.sql',
            '0007_field_sessions_events.sql','0008_comments.sql','0009_automations.sql',
            '0010_fc5_collection_access_areas_runs.sql','0011_fc5_collection_pickups.sql',
            '0012_fc5_collection_pickup_visibility.sql','0013_fc5_pickup_comments.sql','0014_auto_area_task_preparation.sql'
          ];
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            console.error('Post-rollout migration registry mismatch:', actual);
            process.exit(1);
          }
          console.log('Remote migration registry verified through 0014.');
          NODE

      - name: Verify integrity and preserve existing row counts
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "${D1_DATABASE}" --remote --json \
            --command "PRAGMA foreign_key_check;" > .rollout/fk-after.json
          npx wrangler d1 execute "${D1_DATABASE}" --remote --json \
            --command "SELECT 'campaigns' AS table_name, COUNT(*) AS row_count FROM campaigns
                       UNION ALL SELECT 'teams', COUNT(*) FROM teams
                       UNION ALL SELECT 'areas', COUNT(*) FROM areas
                       UNION ALL SELECT 'tasks', COUNT(*) FROM tasks
                       UNION ALL SELECT 'campaign_access_grants', COUNT(*) FROM campaign_access_grants
                       UNION ALL SELECT 'campaign_sessions', COUNT(*) FROM campaign_sessions
                       UNION ALL SELECT 'campaign_mutations', COUNT(*) FROM campaign_mutations;" \
            > .rollout/counts-after.json
          node <<'NODE'
          const fs = require('fs');
          const rows = p => {
            const x = JSON.parse(fs.readFileSync(p,'utf8'));
            return (Array.isArray(x)?x:[x]).flatMap(v => Array.isArray(v.results)?v.results:[]);
          };
          if (rows('.rollout/fk-after.json').length) { console.error('Post-rollout FK violations.'); process.exit(1); }
          const before = Object.fromEntries(rows('.rollout/counts-before.json').map(r => [r.table_name, Number(r.row_count)]));
          const after = Object.fromEntries(rows('.rollout/counts-after.json').map(r => [r.table_name, Number(r.row_count)]));
          if (JSON.stringify(before) !== JSON.stringify(after)) {
            console.error('Baseline row counts changed.', {before, after});
            process.exit(1);
          }
          console.log('FK clean and baseline row counts preserved.');
          NODE

      - name: Verify critical 0013 and 0014 schema
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "${D1_DATABASE}" --remote --json \
            --command "SELECT type,name FROM sqlite_master
                       WHERE (type='trigger' AND name IN ('trg_field_group_close_history','trg_field_group_expiry_history'))
                       OR (type='table' AND name IN ('comments','domain_events','automation_rules','collection_pickups','area_task_preparations','house_tasks'))
                       ORDER BY type,name;" > .rollout/schema-critical.json
          npx wrangler d1 execute "${D1_DATABASE}" --remote --json \
            --command "SELECT 'tasks' AS table_name,name AS column_name FROM pragma_table_info('tasks')
                       WHERE name IN ('source_json','area_preparation_generation')
                       UNION ALL SELECT 'house_tasks',name FROM pragma_table_info('house_tasks')
                       WHERE name='area_preparation_generation';" > .rollout/columns-critical.json
          node <<'NODE'
          const fs = require('fs');
          const rows = p => {
            const x=JSON.parse(fs.readFileSync(p,'utf8'));
            return (Array.isArray(x)?x:[x]).flatMap(v=>Array.isArray(v.results)?v.results:[]);
          };
          const names=new Set(rows('.rollout/schema-critical.json').map(r=>r.name));
          for (const n of ['trg_field_group_close_history','trg_field_group_expiry_history','comments','domain_events','automation_rules','collection_pickups','area_task_preparations','house_tasks']) {
            if (!names.has(n)) { console.error('Missing schema object:',n); process.exit(1); }
          }
          const cols=new Set(rows('.rollout/columns-critical.json').map(r=>`${r.table_name}.${r.column_name}`));
          for (const n of ['tasks.source_json','tasks.area_preparation_generation','house_tasks.area_preparation_generation']) {
            if (!cols.has(n)) { console.error('Missing column:',n); process.exit(1); }
          }
          console.log('Critical 0013/0014 schema verified.');
          NODE

      - name: Verify current preview and branch alias
        shell: bash
        run: |
          set -euo pipefail
          VERSIONED="https://56f131d5-flyer-map.cloudflare-eleven035.workers.dev"
          ALIAS="https://plan-feature-complete-platform-flyer-map.cloudflare-eleven035.workers.dev"
          curl -fsSL "${VERSIONED}/" -o .rollout/versioned.html
          curl -fsSL "${ALIAS}/" -o .rollout/alias.html
          VERSIONED_ASSETS="$(grep -oE '/assets/[^\" ]+\.(js|css)' .rollout/versioned.html | sort -u)"
          ALIAS_ASSETS="$(grep -oE '/assets/[^\" ]+\.(js|css)' .rollout/alias.html | sort -u)"
          test "${VERSIONED_ASSETS}" = "${ALIAS_ASSETS}"
          curl -fsSL "${VERSIONED}/api/health" >/dev/null
          curl -fsSL "${ALIAS}/api/health" >/dev/null
          echo "Preview alias asset match: YES" >> "$GITHUB_STEP_SUMMARY"

      - name: Rollout summary
        if: success()
        shell: bash
        run: |
          {
            echo '## D1 Remote Rollout'
            echo
            echo "- Source ref: ${TARGET_REF}"
            echo "- Source SHA: ${EXPECTED_SHA}"
            echo "- Database: ${D1_DATABASE}"
            echo '- Applied: 0004-0014'
            echo '- Foreign-key check: clean'
            echo '- Existing baseline row counts: preserved'
            echo '- Critical 0013/0014 schema: verified'
            echo '- Manual Worker deploy: not performed'
            echo
            echo '**ROLLOUT_SUCCESS: YES**'
          } >> "$GITHUB_STEP_SUMMARY"
