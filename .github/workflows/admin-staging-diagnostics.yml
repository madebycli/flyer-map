name: Organizer Admin Staging Diagnostics

on:
  push:
    branches:
      - organizer-admin-staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONFIGURED_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_DB_NAME: flyer-map-admin-staging-db
      PROD_D1_ID: 0113e775-1e43-4d96-8b97-51fdeec7355b
      RXDB_STAGING_D1_ID: bcec3432-18ec-42a2-970a-64d52c8263d5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Resolve Cloudflare account and isolated D1
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNTS_JSON="$(curl --fail-with-body --silent --show-error 'https://api.cloudflare.com/client/v4/accounts?per_page=50' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')"
          ACCOUNT_COUNT="$(printf '%s' "$ACCOUNTS_JSON" | jq '.result | length')"
          if [[ -n "${CONFIGURED_CLOUDFLARE_ACCOUNT_ID:-}" ]] && printf '%s' "$ACCOUNTS_JSON" | jq -e --arg id "$CONFIGURED_CLOUDFLARE_ACCOUNT_ID" '.result[] | select(.id == $id)' >/dev/null; then
            CLOUDFLARE_ACCOUNT_ID="$CONFIGURED_CLOUDFLARE_ACCOUNT_ID"
          elif [[ "$ACCOUNT_COUNT" == "1" ]]; then
            CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$ACCOUNTS_JSON" | jq -r '.result[0].id')"
          else
            echo "Cannot unambiguously resolve Cloudflare account." >&2
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
          LIST_JSON="$(npx wrangler d1 list --json)"
          ADMIN_D1_ID="$(printf '%s' "$LIST_JSON" | jq -r --arg name "$ADMIN_DB_NAME" '[.[] | select(.name == $name)] | if length == 1 then .[0].uuid else empty end')"
          if [[ -z "$ADMIN_D1_ID" || "$ADMIN_D1_ID" == "$PROD_D1_ID" || "$ADMIN_D1_ID" == "$RXDB_STAGING_D1_ID" ]]; then
            echo "Admin D1 missing, ambiguous, or collides with a protected database." >&2
            exit 1
          fi
          echo "ADMIN_D1_ID=$ADMIN_D1_ID" >> "$GITHUB_ENV"
      - name: Materialize diagnostic config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.env = config.env || {};
          config.env.admin_staging = {
            name: 'flyer-map-admin-staging',
            workers_dev: true,
            d1_databases: [{ binding: 'DB', database_name: process.env.ADMIN_DB_NAME, database_id: process.env.ADMIN_D1_ID, migrations_dir: 'migrations' }],
            durable_objects: { bindings: [{ name: 'CAMPAIGN_SYNC', class_name: 'CampaignSyncDurableObject' }] },
          };
          fs.writeFileSync('wrangler.jsonc', `${JSON.stringify(config, null, 2)}\n`);
          NODE
      - name: Collect safe schema diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/admin-schema-diagnostics
          npx wrangler d1 execute "$ADMIN_DB_NAME" --env admin_staging --config wrangler.jsonc --remote --json --command 'SELECT COUNT(*) AS count FROM d1_migrations;' > /tmp/admin-schema-diagnostics/ledger-count.json
          npx wrangler d1 execute "$ADMIN_DB_NAME" --env admin_staging --config wrangler.jsonc --remote --json --command 'SELECT id, name FROM d1_migrations ORDER BY id;' > /tmp/admin-schema-diagnostics/ledger.json
          npx wrangler d1 execute "$ADMIN_DB_NAME" --env admin_staging --config wrangler.jsonc --remote --json --command "SELECT name, type FROM sqlite_master WHERE name LIKE 'organization_%' ORDER BY name;" > /tmp/admin-schema-diagnostics/organization-schema.json
          npx wrangler d1 execute "$ADMIN_DB_NAME" --env admin_staging --config wrangler.jsonc --remote --json --command 'PRAGMA foreign_key_check;' > /tmp/admin-schema-diagnostics/foreign-keys.json
          npx wrangler d1 migrations list "$ADMIN_DB_NAME" --env admin_staging --config wrangler.jsonc --remote > /tmp/admin-schema-diagnostics/pending.txt 2>&1 || true
      - name: Upload safe schema diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-schema-diagnostics
          path: /tmp/admin-schema-diagnostics/
          retention-days: 1
          if-no-files-found: error
