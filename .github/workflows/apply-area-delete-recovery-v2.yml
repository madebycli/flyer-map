name: Apply Area Delete Recovery Hardening v2

on:
  push:
    branches:
      - fix/street-engine-smart-marking
    paths:
      - .github/workflows/apply-area-delete-recovery-v2.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: contains(github.event.head_commit.message, '[apply-area-delete-recovery-v2]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply deterministic patch
        run: python scripts/apply-area-delete-recovery.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Focused recovery regression
        run: node --experimental-transform-types --test tests/rxdbPushServerWinsFallback.test.ts tests/streetEngineRecovery.test.ts
      - name: Repository gates
        run: npm run check
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'madebycli'
          git config user.email 'root.cli@proton.me'
          git add worker/mutationRepository.ts worker/rxdbSync.ts tests/rxdbPushServerWinsFallback.test.ts
          git commit -m 'fix: make prepared Area deletion fail safe and bounded'
          git push origin HEAD:fix/street-engine-smart-marking
