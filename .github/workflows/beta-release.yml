name: Release Beta Channel

on:
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-beta
  cancel-in-progress: false

jobs:
  beta:
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONFIGURED_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BETA_WORKER_NAME: flyer-map-beta
      BETA_DB_NAME: flyer-map-beta-db
      V4_PBF_URL: https://download.geofabrik.de/europe/germany/nordrhein-westfalen-latest.osm.pbf
      PROD_D1_ID: 0113e775-1e43-4d96-8b97-51fdeec7355b
      RXDB_STAGING_D1_ID: bcec3432-18ec-42a2-970a-64d52c8263d5
      BOOTSTRAP_SHA256: 2058707356b5b06c207d0e4a49148626058e6e2661af9dd4a4bb86c32d7930d9

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enforce Beta source branch invariant
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/beta' ]]
          [[ "$GITHUB_REF_NAME" == 'beta' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - name: Verify Beta candidate
        run: |
          npm ci --no-audit --no-fund
          npm run check

      - name: Resolve Cloudflare account and isolated Beta D1
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          ACCOUNTS_JSON="$(curl --fail-with-body --silent --show-error 'https://api.cloudflare.com/client/v4/accounts?per_page=50' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')"
          [[ "$(jq -r '.success' <<<"$ACCOUNTS_JSON")" == 'true' ]]
          if [[ -n "${CONFIGURED_CLOUDFLARE_ACCOUNT_ID:-}" ]] && jq -e --arg id "$CONFIGURED_CLOUDFLARE_ACCOUNT_ID" '.result[]|select(.id==$id)' <<<"$ACCOUNTS_JSON" >/dev/null; then
            ACCOUNT_ID="$CONFIGURED_CLOUDFLARE_ACCOUNT_ID"
          elif [[ "$(jq '.result|length' <<<"$ACCOUNTS_JSON")" == '1' ]]; then
            ACCOUNT_ID="$(jq -r '.result[0].id' <<<"$ACCOUNTS_JSON")"
          else
            echo 'Cloudflare account is ambiguous.' >&2
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

          LIST_JSON="$(npx wrangler d1 list --json)"
          BETA_D1_ID="$(jq -r --arg name "$BETA_DB_NAME" '[.[]|select(.name==$name)]|if length==1 then .[0].uuid else empty end' <<<"$LIST_JSON")"
          if [[ -z "$BETA_D1_ID" ]]; then
            CREATED="$(curl --fail-with-body --silent --show-error -X POST "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/d1/database" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data "{\"name\":\"${BETA_DB_NAME}\"}")"
            jq -e '.success == true' <<<"$CREATED" >/dev/null
            BETA_D1_ID="$(jq -r '.result.uuid' <<<"$CREATED")"
          fi
          [[ -n "$BETA_D1_ID" ]]
          [[ "$BETA_D1_ID" != "$PROD_D1_ID" ]]
          [[ "$BETA_D1_ID" != "$RXDB_STAGING_D1_ID" ]]
          echo "BETA_D1_ID=$BETA_D1_ID" >> "$GITHUB_ENV"
          echo "Resolved isolated Beta D1: $BETA_DB_NAME ($BETA_D1_ID)"

      - name: Materialize isolated Beta V4 config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          c.name=process.env.BETA_WORKER_NAME;
          c.workers_dev=true;
          c.vars={
            ...(c.vars||{}),
            RUNTIME_ENVIRONMENT:'unstable',
            SOURCE_COMMIT_SHA:process.env.GITHUB_SHA,
            RELEASE_CHANNEL:'beta',
            STREET_ENGINE_VERSION:'v4',
            STREET_ENGINE_V4_CHANNEL:'beta',
            ORGANIZATION_KDF_DIAGNOSTICS:'0',
            ORGANIZATION_OPTIONAL_MFA:'1',
            ORGANIZATION_BOOTSTRAP_SECRET_SHA256:process.env.BOOTSTRAP_SHA256,
          };
          delete c.vars.OSM_OVERPASS_URL;
          c.d1_databases=[{
            binding:'DB',
            database_name:process.env.BETA_DB_NAME,
            database_id:process.env.BETA_D1_ID,
            migrations_dir:'migrations',
          }];
          delete c.r2_buckets;
          c.ratelimits=[
            {name:'FIELD_GROUP_JOIN_ACTOR_LIMITER',namespace_id:'92015001',simple:{limit:30,period:60}},
            {name:'FIELD_GROUP_JOIN_CREDENTIAL_LIMITER',namespace_id:'92015002',simple:{limit:8,period:60}},
            {name:'PICKUP_SEARCH_LIMITER',namespace_id:'92015003',simple:{limit:20,period:10}},
            {name:'ORGANIZATION_LOGIN_LIMITER',namespace_id:'92015004',simple:{limit:12,period:60}},
          ];
          if(c.vars.STREET_ENGINE_VERSION!=='v4'||'OSM_OVERPASS_URL' in c.vars)throw new Error('beta_v4_runtime_config_invalid');
          fs.writeFileSync('wrangler.jsonc',JSON.stringify(c,null,2)+'\n');
          NODE

      - name: Apply official migrations only to isolated Beta D1
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/beta' ]]
          npx wrangler d1 migrations apply "$BETA_DB_NAME" --remote --config wrangler.jsonc

      - name: Repair and verify Beta StreetEngine schema
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/beta' ]]
          [[ "$BETA_D1_ID" != "$PROD_D1_ID" ]]
          [[ "$BETA_D1_ID" != "$RXDB_STAGING_D1_ID" ]]

          rows_json() {
            node -e 'const fs=require("node:fs");const x=JSON.parse(fs.readFileSync(0,"utf8"));const rows=(Array.isArray(x)?x:[x]).flatMap(v=>Array.isArray(v.results)?v.results:[]);process.stdout.write(JSON.stringify(rows));'
          }

          TASK_COLUMNS="$(npx wrangler d1 execute "$BETA_DB_NAME" --remote --config wrangler.jsonc --json --command "PRAGMA table_info(tasks);" | rows_json)"
          HOUSE_COLUMNS="$(npx wrangler d1 execute "$BETA_DB_NAME" --remote --config wrangler.jsonc --json --command "PRAGMA table_info(house_tasks);" | rows_json)"

          if ! jq -e 'any(.name == "area_preparation_generation")' <<<"$TASK_COLUMNS" >/dev/null; then
            npx wrangler d1 execute "$BETA_DB_NAME" --remote --config wrangler.jsonc --command "ALTER TABLE tasks ADD COLUMN area_preparation_generation TEXT;"
          fi
          if ! jq -e 'any(.name == "area_preparation_generation")' <<<"$HOUSE_COLUMNS" >/dev/null; then
            npx wrangler d1 execute "$BETA_DB_NAME" --remote --config wrangler.jsonc --command "ALTER TABLE house_tasks ADD COLUMN area_preparation_generation TEXT;"
          fi
          npx wrangler d1 execute "$BETA_DB_NAME" --remote --config wrangler.jsonc --file scripts/beta-streetengine-schema-repair.sql
          npx wrangler d1 execute "$BETA_DB_NAME" --remote --config wrangler.jsonc --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('area_task_preparations','street_network_state','house_road_positions','street_network_jobs','street_network_staging','street_network_intents') ORDER BY name;" > /tmp/beta-streetengine-tables.json
          npx wrangler d1 execute "$BETA_DB_NAME" --remote --config wrangler.jsonc --json --command "PRAGMA table_info(area_task_preparations);" > /tmp/beta-streetengine-preparation-columns.json
          npx wrangler d1 execute "$BETA_DB_NAME" --remote --config wrangler.jsonc --json --command "PRAGMA table_info(tasks);" > /tmp/beta-streetengine-task-columns.json
          npx wrangler d1 execute "$BETA_DB_NAME" --remote --config wrangler.jsonc --json --command "PRAGMA table_info(house_tasks);" > /tmp/beta-streetengine-house-columns.json
          npx wrangler d1 execute "$BETA_DB_NAME" --remote --config wrangler.jsonc --json --command "PRAGMA foreign_key_check;" > /tmp/beta-streetengine-fk.json
          node <<'NODE'
          const fs=require('node:fs');
          const rows=(path)=>{const x=JSON.parse(fs.readFileSync(path,'utf8'));return(Array.isArray(x)?x:[x]).flatMap(v=>Array.isArray(v.results)?v.results:[]);};
          const tables=new Set(rows('/tmp/beta-streetengine-tables.json').map(r=>r.name));
          for(const name of ['area_task_preparations','street_network_state','house_road_positions','street_network_jobs','street_network_staging','street_network_intents'])if(!tables.has(name))throw new Error(`missing Beta StreetEngine table: ${name}`);
          const prep=new Set(rows('/tmp/beta-streetengine-preparation-columns.json').map(r=>r.name));
          for(const name of ['campaign_id','area_id','geometry_hash','generation','status','road_count','house_count','source_timestamp','started_at','ready_at','failed_at','last_error_code','updated_at'])if(!prep.has(name))throw new Error(`missing area_task_preparations column: ${name}`);
          const tasks=new Set(rows('/tmp/beta-streetengine-task-columns.json').map(r=>r.name));const houses=new Set(rows('/tmp/beta-streetengine-house-columns.json').map(r=>r.name));
          if(!tasks.has('area_preparation_generation'))throw new Error('missing tasks.area_preparation_generation');if(!houses.has('area_preparation_generation'))throw new Error('missing house_tasks.area_preparation_generation');
          const fk=rows('/tmp/beta-streetengine-fk.json');if(fk.length)throw new Error(`Beta D1 foreign key violations: ${JSON.stringify(fk)}`);
          fs.writeFileSync('/tmp/beta-streetengine-schema-summary.json',JSON.stringify({ok:true,tables:[...tables].sort(),taskGeneration:true,houseGeneration:true,foreignKeys:'clean'},null,2)+'\n');
          NODE

      - name: Build and stage Street Engine V4 source pack as Worker assets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/beta' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool

          npx wrangler d1 execute "$BETA_DB_NAME" --remote --config wrangler.jsonc --json --command "SELECT id,name,geometry_json,updated_at,campaign_id FROM areas WHERE campaign_id=(SELECT campaign_id FROM areas ORDER BY updated_at DESC,id DESC LIMIT 1) ORDER BY updated_at,id;" > /tmp/v4-areas-wrangler.json
          node --experimental-transform-types scripts/plan-street-engine-v4-coverage.ts /tmp/v4-areas-wrangler.json /tmp/street-engine-v4-source-meta.json
          V4_BBOX="$(jq -er '.bbox | select(type=="string" and length>0)' /tmp/street-engine-v4-source-meta.json)"
          V4_CAMPAIGN_ID="$(jq -er '.campaignId | select(type=="string" and length>0)' /tmp/street-engine-v4-source-meta.json)"
          V4_COVERAGE_POLICY="$(jq -er '.coveragePolicy' /tmp/street-engine-v4-source-meta.json)"
          V4_RESERVE_DEGREES="$(jq -er '.reserveDegrees' /tmp/street-engine-v4-source-meta.json)"
          [[ "$V4_COVERAGE_POLICY" == 'grid-reserve-v1' ]]
          awk -v reserve="$V4_RESERVE_DEGREES" 'BEGIN{exit !(reserve >= 0 && reserve <= 0.2)}'
          {
            echo "V4_BBOX=$V4_BBOX"
            echo "V4_CAMPAIGN_ID=$V4_CAMPAIGN_ID"
          } >> "$GITHUB_ENV"
          export V4_BBOX V4_CAMPAIGN_ID

          curl --fail-with-body --location --retry 4 --retry-delay 3 --retry-all-errors "$V4_PBF_URL" -o /tmp/nordrhein-westfalen.osm.pbf
          SOURCE_TIMESTAMP="$(osmium fileinfo -g header.option.osmosis_replication_timestamp /tmp/nordrhein-westfalen.osm.pbf 2>/dev/null || true)"
          if [[ -z "$SOURCE_TIMESTAMP" ]]; then SOURCE_TIMESTAMP="$(osmium fileinfo -g header.option.timestamp /tmp/nordrhein-westfalen.osm.pbf 2>/dev/null || true)"; fi
          [[ "$SOURCE_TIMESTAMP" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]
          osmium extract --strategy complete_ways --bbox "$V4_BBOX" /tmp/nordrhein-westfalen.osm.pbf -o /tmp/street-engine-v4.osm.pbf --overwrite
          cat > /tmp/v4-export.json <<'JSON'
          {
            "attributes":{"type":true,"id":true},
            "linear_tags":["highway"],
            "area_tags":["building"],
            "include_tags":["highway","building","addr:*"]
          }
          JSON
          osmium export /tmp/street-engine-v4.osm.pbf -f geojsonseq -c /tmp/v4-export.json -o /tmp/street-engine-v4.geojsonseq --overwrite
          node --experimental-transform-types scripts/build-street-engine-v4-pbf-pack.ts /tmp/street-engine-v4.geojsonseq "$V4_BBOX" "$SOURCE_TIMESTAMP" /tmp/street-engine-v4-pack beta geofabrik-nrw
          jq -e '.engineVersion=="v4" and .algorithmVersion=="v4-pbf-builder-4" and .shardCount>0' /tmp/street-engine-v4-pack/summary.json >/dev/null
          FIRST_V4_SHARD="$(jq -er '.shards[0].file' /tmp/street-engine-v4-pack/summary.json)"
          gzip -t "/tmp/street-engine-v4-pack/$FIRST_V4_SHARD"
          gzip -dc "/tmp/street-engine-v4-pack/$FIRST_V4_SHARD" > /tmp/street-engine-v4-first-shard.frame
          V4_MAGIC_HEX="$(head -c 7 /tmp/street-engine-v4-first-shard.frame | od -An -tx1 | tr -d ' \n')"
          [[ "$V4_MAGIC_HEX" == '464d5345563300' ]] || { echo "Invalid V4 shard magic: $V4_MAGIC_HEX" >&2; exit 1; }
          rm -f /tmp/street-engine-v4-first-shard.frame

          ASSET_ROOT="public/__street-engine-v4"
          rm -rf "$ASSET_ROOT"
          mkdir -p "$ASSET_ROOT"
          while IFS=$'\t' read -r key file; do
            target="$ASSET_ROOT/$key"
            mkdir -p "$(dirname "$target")"
            cp "/tmp/street-engine-v4-pack/$file" "$target"
            expected="$(basename "$file" .bin)"
            actual="$(sha256sum "$target" | awk '{print $1}')"
            [[ "$actual" == "$expected" ]]
          done < <(jq -r '.shards[]|[.key,.file]|@tsv' /tmp/street-engine-v4-pack/summary.json)
          MANIFEST_KEY="$(jq -r '.manifestKey' /tmp/street-engine-v4-pack/summary.json)"
          POINTER_KEY="$(jq -r '.pointerKey' /tmp/street-engine-v4-pack/summary.json)"
          mkdir -p "$(dirname "$ASSET_ROOT/$MANIFEST_KEY")" "$(dirname "$ASSET_ROOT/$POINTER_KEY")"
          cp /tmp/street-engine-v4-pack/manifest.json "$ASSET_ROOT/$MANIFEST_KEY"
          cp /tmp/street-engine-v4-pack/pointer.json "$ASSET_ROOT/$POINTER_KEY"
          MANIFEST_HASH="$(jq -r '.manifestHash' /tmp/street-engine-v4-pack/summary.json)"
          [[ "$(sha256sum "$ASSET_ROOT/$MANIFEST_KEY" | awk '{print $1}')" == "$MANIFEST_HASH" ]]
          cmp /tmp/street-engine-v4-pack/manifest.json "$ASSET_ROOT/$MANIFEST_KEY"
          cmp /tmp/street-engine-v4-pack/pointer.json "$ASSET_ROOT/$POINTER_KEY"
          jq -e --arg hash "$MANIFEST_HASH" '.manifestHash==$hash' "$ASSET_ROOT/$POINTER_KEY" >/dev/null
          jq -n --arg storage "worker-assets" --arg prefix "/__street-engine-v4" --arg manifestHash "$MANIFEST_HASH" --arg manifestKey "$MANIFEST_KEY" --arg pointerKey "$POINTER_KEY" '{storage:$storage,prefix:$prefix,manifestHash:$manifestHash,manifestKey:$manifestKey,pointerKey:$pointerKey}' > /tmp/beta-streetengine-v4-assets.json
          rm -f /tmp/nordrhein-westfalen.osm.pbf /tmp/street-engine-v4.osm.pbf /tmp/street-engine-v4.geojsonseq

      - name: Prepare missing Beta secrets
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error -o /tmp/beta-secret-list.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${BETA_WORKER_NAME}/secrets" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' || true)"
          if [[ "$STATUS" != '200' ]] || ! jq -e '.success == true' /tmp/beta-secret-list.json >/dev/null 2>&1; then printf '%s\n' '{"success":true,"result":[]}' > /tmp/beta-secret-list.json; fi
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');const list=JSON.parse(fs.readFileSync('/tmp/beta-secret-list.json','utf8')).result||[];const names=new Set(list.map(x=>x.name));const missing={};for(const name of ['ORGANIZATION_TOTP_KEY','FIELD_GROUP_CREDENTIAL_ENCRYPTION_KEY'])if(!names.has(name))missing[name]=crypto.randomBytes(32).toString('base64url');fs.writeFileSync('/tmp/beta-missing-secrets.json',JSON.stringify(missing));fs.writeFileSync('/tmp/beta-secret-count.txt',String(Object.keys(missing).length));
          NODE

      - name: Build and deploy exact Beta V4 source directly
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/beta' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          node -e 'const fs=require("node:fs");const c=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));if(c.vars?.STREET_ENGINE_VERSION!=="v4"||c.vars?.OSM_OVERPASS_URL!==undefined||(c.r2_buckets?.length??0)!==0)throw new Error("beta_v4_deploy_invariant_failed")'
          rm -rf dist .wrangler
          npm run build
          ASSET_PREFIX="dist/client/__street-engine-v4"
          MANIFEST_KEY="$(jq -r '.manifestKey' /tmp/street-engine-v4-pack/summary.json)"
          POINTER_KEY="$(jq -r '.pointerKey' /tmp/street-engine-v4-pack/summary.json)"
          test -f "$ASSET_PREFIX/$MANIFEST_KEY"
          test -f "$ASSET_PREFIX/$POINTER_KEY"
          while IFS=$'\t' read -r key _file; do test -f "$ASSET_PREFIX/$key"; done < <(jq -r '.shards[]|[.key,.file]|@tsv' /tmp/street-engine-v4-pack/summary.json)
          if [[ "$(cat /tmp/beta-secret-count.txt)" -gt 0 ]]; then
            npx wrangler deploy --config dist/flyer_map/wrangler.json --secrets-file /tmp/beta-missing-secrets.json 2>&1 | tee /tmp/beta-deploy.log
          else
            npx wrangler deploy --config dist/flyer_map/wrangler.json 2>&1 | tee /tmp/beta-deploy.log
          fi
          BETA_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/beta-deploy.log | tail -n1 || true)"
          [[ -n "$BETA_URL" ]]
          echo "BETA_URL=$BETA_URL" >> "$GITHUB_ENV"
          echo "Beta URL: $BETA_URL"

      - name: Smoke Beta V4
        shell: bash
        run: |
          set -euo pipefail
          echo "Testing $BETA_URL"
          EXPECTED_SHA="$GITHUB_SHA";RUNTIME='';RUNTIME_READY=0
          for attempt in $(seq 1 30); do
            RUNTIME="$(curl --retry 3 --retry-delay 1 --retry-all-errors --silent --show-error "${BETA_URL}/api/runtime?smoke=${EXPECTED_SHA}-${attempt}" || true)"
            if jq -e --arg sha "$EXPECTED_SHA" '.ok==true and .environment=="unstable" and .sourceCommit==$sha and .releaseChannel=="beta" and .streetEngineVersion=="v4" and .streetEngineSourceChannel=="beta" and .capabilities.streetEngineV4==true' <<<"$RUNTIME" >/dev/null 2>&1; then RUNTIME_READY=1;echo "Expected Beta V4 runtime reached on attempt ${attempt}.";break;fi
            echo "Beta V4 runtime not propagated yet (attempt ${attempt}/30): ${RUNTIME}";sleep 2
          done
          echo "$RUNTIME" | jq .
          [[ "$RUNTIME_READY" == '1' ]]
          ROOT="$(curl --retry 8 --retry-delay 2 --retry-all-errors -sS -D /tmp/beta.headers -o /tmp/beta.html -w '%{http_code}' "$BETA_URL/")"
          LOGIN="$(curl --retry 8 --retry-delay 2 --retry-all-errors -sS -o /tmp/beta-login.html -w '%{http_code}' "$BETA_URL/login")"
          START="$(curl --retry 8 --retry-delay 2 --retry-all-errors -sS -o /tmp/beta-start.html -w '%{http_code}' "$BETA_URL/start")"
          ME="$(curl --retry 8 --retry-delay 2 --retry-all-errors -sS -o /tmp/beta-me.json -w '%{http_code}' "$BETA_URL/api/organization/me")"
          echo "root=$ROOT login=$LOGIN start=$START me=$ME"
          [[ "$ROOT" -ge 200 && "$ROOT" -lt 400 ]];[[ "$LOGIN" -ge 200 && "$LOGIN" -lt 400 ]];[[ "$START" -ge 200 && "$START" -lt 400 ]];[[ "$ME" == '401' ]]
          printf '%s\n' "$BETA_URL" > /tmp/beta-url.txt
          printf '%s\n' "$RUNTIME" > /tmp/beta-v4-runtime.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-release-state
          path: |
            /tmp/beta-url.txt
            /tmp/beta-deploy.log
            /tmp/beta.headers
            /tmp/beta-v4-runtime.json
            /tmp/beta-streetengine-schema-summary.json
            /tmp/beta-streetengine-tables.json
            /tmp/beta-streetengine-preparation-columns.json
            /tmp/beta-streetengine-task-columns.json
            /tmp/beta-streetengine-house-columns.json
            /tmp/beta-streetengine-fk.json
            /tmp/beta-streetengine-v4-assets.json
            /tmp/street-engine-v4-source-meta.json
            /tmp/street-engine-v4-pack/summary.json
            /tmp/street-engine-v4-pack/pointer.json
            /tmp/street-engine-v4-pack/manifest.json
          retention-days: 30
          if-no-files-found: ignore
