# flyermap-rs: everything of our own, in Rust. Crates are small and layered; a crate only depends on the ones above it in this list.
#
#   flyermap-host     platform seams: database, HTTP values, secrets, time, outgoing requests, variables                  (no product logic)
#   flyermap-identity who may do what and how people sign in: roles, scopes, one decision, invitations, TOTP, passkeys (pure)
#   flyermap-server   the /v6 API: directory (people, sessions, grants, invitations, audit), sign-in flows                  (host, identity)
#   flyermap-core     pure domain: clock, status, keys, operations, overlay (last writer wins), outbox, conflicts, progress   (no I/O)
#   flyermap-rights   who may read and write where: roles, areas, operation rules                                           (depends on core)
#   flyermap-wire     the HTTP contract of /api/v5 as typed requests and responses                                        (depends on core)
#   flyermap-sync     the push/pull loop as a state machine behind traits (transport, storage, timer)                      (core, wire)
#   flyermap-area     drawing Gebiete: snap, connected drawing, extend, split, checks                                       (own, pure geometry)
#   flyermap-pack     map data of a Gebiet: parts, Overpass query, cleaned answer, gzip pack                               (own, no I/O)
#   flyermap-engine   streets and houses: derive, classify, tiles, route, lasso, search                                    (own, WebAssembly)
#   flyermap-worker   the Cloudflare Worker: router, handlers, repositories                                                (core, rights, wire, pack)
#   flyermap-web      the app: design system, screens, map bridge                                                          (core, wire, sync, engine)
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The web app (scripts/rs-web-build.sh --release): the release profile tuned for size. The UI glue does no heavy work (the engine is its own
# module with the release profile), and "z" halves the WebAssembly: 991 kB -> 499 kB raw, 204 kB -> 153 kB brotli (measured 2026-10-21).
[profile.web]
inherits = "release"
opt-level = "z"
