[package]
name = "flyermap-web"
version.workspace = true
edition.workspace = true
description = "Verteil-Flyer web app (Leptos, CSR, WebAssembly): platform layer, design system, screens. Runs in the browser; the pure parts are tested natively."
publish.workspace = true

[lib]
name = "flyermap_web"

[[bin]]
name = "flyermap-web"
path = "src/main.rs"

[dependencies]
flyermap-area = { path = "../flyermap-area" }
flyermap-core = { path = "../flyermap-core" }
flyermap-diag = { path = "../flyermap-diag" }
flyermap-identity = { path = "../flyermap-identity" }
flyermap-pack = { path = "../flyermap-pack" }
flyermap-rights = { path = "../flyermap-rights" }
flyermap-sync = { path = "../flyermap-sync" }
flyermap-wire = { path = "../flyermap-wire" }
serde.workspace = true
serde_json.workspace = true
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
thiserror.workspace = true
web-sys = { version = "0.3", features = [
  "console", "Window", "Document", "Element", "HtmlElement", "Node", "Storage", "Navigator", "VisualViewport", "CssStyleDeclaration",
  "Event", "EventTarget", "PointerEvent", "KeyboardEvent", "HtmlInputElement", "DomRect", "DomTokenList", "VisibilityState",
  "Request", "RequestInit", "RequestCredentials", "Response", "Headers", "ReadableStream", "ReadableWritablePair", "Location", "Url", "UrlSearchParams",
  "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "Performance",
  "IdbFactory", "IdbDatabase", "IdbOpenDbRequest", "IdbRequest", "IdbTransaction", "IdbTransactionMode", "IdbObjectStore", "IdbVersionChangeEvent",
  "HtmlCanvasElement", "CanvasRenderingContext2d", "CanvasWindingRule", "DomStringList",
  "AudioContext", "AudioNode", "AudioDestinationNode", "AudioParam", "OscillatorNode", "OscillatorType", "GainNode",
  "Geolocation", "PositionOptions", "Position", "Coordinates", "PositionError",
  "MediaQueryList", "Clipboard", "KeyboardEvent", "MouseEvent", "HtmlTextAreaElement", "HtmlButtonElement", "ScrollToOptions", "ScrollBehavior",
] }

[lints]
workspace = true
