<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1514" />
    <meta name="description" content="Verteil-Flyer – schnelle Feldkarte." />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Verteil-Flyer</title>
    <!-- All paths are relative: the app is served next to the React app (under /rs/) as well as alone (dist-rs). -->
    <script>try{if(localStorage.getItem('vf-v5-theme')==='light'){document.documentElement.dataset.theme='light';document.querySelector('meta[name="theme-color"]').setAttribute('content','#f5faf8')}}catch(e){}</script>
    <link rel="preload" href="flyermap-web_bg.wasm" as="fetch" type="application/wasm" crossorigin />
    <link rel="stylesheet" href="app.css" />
    <style>
      /* First paint: dark (or the chosen light) at once, never a white flash; the start screen is plain HTML so it needs no script. */
      html{background:#0f1514;color-scheme:dark}
      html[data-theme=light]{background:#f5faf8;color-scheme:light}
      body{margin:0}
      #splash{position:fixed;inset:0;z-index:1000;display:grid;align-content:center;justify-items:center;gap:1.1rem;padding:1.5rem;background:#0f1514;color:#a9b6b2;font:600 0.95rem/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;transition:opacity .26s ease-out}
      html[data-theme=light] #splash{background:#f5faf8;color:#3f4946}
      #splash.done{opacity:0;pointer-events:none}
      #splash img{width:7rem;height:7rem}
      #splash p{margin:0;min-height:1.3em}
      #splash .splash-bar{position:relative;display:block;width:7rem;height:3px;border-radius:2px;overflow:hidden;background:rgb(102 207 179 / 22%)}
      #splash .splash-bar::after{content:"";position:absolute;inset:0;width:40%;border-radius:2px;background:#66cfb3;animation:splash-run 1.3s ease-in-out infinite}
      html[data-theme=light] #splash .splash-bar{background:rgb(27 122 100 / 18%)}
      html[data-theme=light] #splash .splash-bar::after{background:#1b7a64}
      @keyframes splash-run{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
      @media (prefers-reduced-motion:reduce){#splash{transition:none}#splash .splash-bar::after{animation:none;width:100%}}
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite">
      <img src="logo.svg" alt="" width="112" height="112" />
      <p id="splash-text">Wird gestartet …</p>
      <i class="splash-bar" aria-hidden="true"></i>
    </div>
    <script type="module">
      import init from './flyermap-web.js';
      init({ module_or_path: new URL('flyermap-web_bg.wasm', import.meta.url) }).catch((error) => {
        console.error(error);
        const text = document.getElementById('splash-text');
        if (text) text.textContent = 'Die App konnte nicht starten. Bitte lade die Seite neu.';
      });
    </script>
  </body>
</html>
