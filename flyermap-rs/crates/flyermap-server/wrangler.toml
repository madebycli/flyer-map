# Local and Unstable runs of the Flyer Map 6 server. Production stays on the TypeScript Worker until the cut-over (Plan 061 §9).
name = "flyermap-server-local"
main = "build/index.js"
compatibility_date = "2025-09-01"

[build]
# Symbols must stay in the module: wasm-bindgen needs them for its externref table.
command = "CARGO_PROFILE_RELEASE_STRIP=false worker-build --release ${FM_FEATURES:+--features $FM_FEATURES}"

[[durable_objects.bindings]]
name = "AKTION"
class_name = "AktionObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AktionObject"]

[[d1_databases]]
binding = "DB"
database_name = "flyermap-server-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
