[package]
name = "flyermap-search"
version.workspace = true
edition.workspace = true
description = "Search and command bar of Flyer Map 6 (Plan 061 §6): one in-memory index over streets, houses, Gebiete, Gruppen, people, notes and commands. German-aware (umlauts, ß, Str.), typo tolerant, house numbers, ranked by context. Pure: no I/O, no clock, no randomness."
publish.workspace = true

[dependencies]
rustc-hash = "2"
thiserror.workspace = true
unicode-normalization = "0.1"

