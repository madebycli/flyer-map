[package]
name = "flyermap-engine"
version.workspace = true
edition.workspace = true
description = "Verteil-Flyer v5 street/house engine (derive + restrictToArea), compiled to WebAssembly; byte-compatible with src/v5/engine in TypeScript."
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["c-abi"]
# The WebAssembly C ABI (alloc, derive_area, session_*): what the browser loads as `engine.wasm`. A Rust host that links the engine as a library
# (the map-data pack on the Worker) uses `default-features = false`, so these entry points do not become exports of its own module.
c-abi = []

[dependencies]
serde ={ version = "1", features = ["derive"] }
# exact number parsing, as JSON.parse does (coordinates must not move by a bit between the TypeScript and the Rust path)
serde_json = { version = "1", features = ["float_roundtrip"] }
unicode-normalization = "0.1"
rustc-hash = "2"
bincode = "1"

# The only crate with `unsafe`: its C ABI towards the browser (alloc/dealloc and raw buffers). Every other crate forbids it.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
